                                    <span>${tipeIcon[f.TIPE] || '📝'}</span>
                                    <span class="text-[9px] font-mono text-zinc-400">${this.escape(f.WAKTU)}</span>
                                    <span class="text-[9px] uppercase font-bold px-1.5 py-0.5 rounded ${statusColor[String(f.STATUS).toLowerCase()] || statusColor.baru}">${this.escape(f.STATUS || 'baru')}</span>
                                </div>
                                <button onclick="app.deleteFeedbackInline('${f.ID}')" class="text-zinc-400 hover:text-red-500 p-0.5">
                                    <i data-lucide="trash-2" class="w-3 h-3"></i>
                                </button>
                            </div>
                            <p class="text-xs whitespace-pre-wrap">${this.escape(f.PESAN)}</p>
                            <div class="flex items-center justify-between text-[10px] text-zinc-500">
                                <span class="truncate">${this.escape(f.PENGIRIM || 'anon')}</span>
                                <select onchange="app.updateFeedbackStatusInline('${f.ID}', this.value)" class="text-[9px] bg-zinc-50 dark:bg-zinc-950 border border-zinc-300 dark:border-zinc-700 rounded px-1.5 py-0.5">
                                    <option value="baru" ${f.STATUS==='baru'?'selected':''}>Baru</option>
                                    <option value="dibaca" ${f.STATUS==='dibaca'?'selected':''}>Dibaca</option>
                                    <option value="diproses" ${f.STATUS==='diproses'?'selected':''}>Diproses</option>
                                    <option value="selesai" ${f.STATUS==='selesai'?'selected':''}>Selesai</option>
                                </select>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        },
        
        loadFeedback: function(silent) {
            if (!this.user || !this.isOnline) return;
            const isAdmin = this.user.jabatan.toLowerCase() === 'super admin' || this.user.jabatan.toLowerCase() === 'admin';
            if (!isAdmin) return;
            
            fetch(`${this.apiURL}?action=feedback&email=${encodeURIComponent(this.user.email)}`)
                .then(r => r.json())
                .then(res => {
                    if (res.status === 'success') {
                        this.feedbackList = res.data || [];
                        this.saveCache();
                        if (this.panelOpen && this.currentTab === 'feedback') this.renderPanel();
                    }
                })
                .catch(() => {});
        },
        
        sendFeedback: function() {
            const tipe = document.getElementById('fb-tipe').value;
            const pesan = document.getElementById('fb-pesan').value.trim();
            if (!pesan) { this.toast('Pesan wajib', 'error'); return; }
            
            fetch(this.apiURL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    action: 'saveFeedback',
                    data: { tipe, pesan, pengirim: this.user?.nama || 'anon', kontak: this.user?.email || '' }
                })
            }).then(r => r.json()).then(res => {
                if (res.status === 'success') {
                    this.toast('Terima kasih!', 'success');
                    document.getElementById('fb-pesan').value = '';
                } else {
                    this.toast(res.message, 'error');
                }
            }).catch(() => this.toast('Gagal', 'error'));
        },
        
        updateFeedbackStatusInline: function(id, status) {
            const f = this.feedbackList.find(x => x.ID === id);
            if (f) f.STATUS = status;
            this.saveCache();
            
            fetch(this.apiURL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'updateFeedback', id, status, userEmail: this.user?.email })
            }).catch(() => {});
        },
        
        deleteFeedbackInline: function(id) {
            if (!confirm('Hapus feedback?')) return;
            this.feedbackList = this.feedbackList.filter(x => x.ID !== id);
            this.saveCache();
            this.renderPanel();
            
            fetch(this.apiURL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'deleteFeedback', id, userEmail: this.user?.email })
            }).catch(() => {});
        },
        
        // ============================================================
        // TAB: BACKUP
        // ============================================================
        renderTabBackup: function(canEdit) {
            if (!canEdit) {
                return `<p class="text-xs text-center text-zinc-500 py-8">Login sebagai Admin untuk akses backup</p>`;
            }
            
            const cacheSize = (localStorage.getItem(this.KEYS.CACHE) || '').length;
            const pendingCount = JSON.parse(localStorage.getItem(this.KEYS.PENDING) || '[]').length;
            const lastSync = localStorage.getItem(this.KEYS.LAST_SYNC) || '-';
            
            return `
                <div class="space-y-4">
                    <div class="p-3 bg-zinc-50 dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-lg space-y-2 text-xs">
                        <div class="flex justify-between"><span class="text-zinc-500">Cache size:</span><span class="font-mono">${(cacheSize/1024).toFixed(1)} KB</span></div>
                        <div class="flex justify-between"><span class="text-zinc-500">Pending ops:</span><span class="font-mono">${pendingCount}</span></div>
                        <div class="flex justify-between"><span class="text-zinc-500">Last sync:</span><span class="font-mono text-[10px]">${lastSync}</span></div>
                        <div class="flex justify-between"><span class="text-zinc-500">Menu count:</span><span class="font-mono">${this.menu.length}</span></div>
                    </div>
                    
                    <button onclick="app.exportJSON()" class="w-full px-3 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-semibold flex items-center justify-center gap-1.5">
                        <i data-lucide="download" class="w-3.5 h-3.5"></i> Export Backup (JSON)
                    </button>
                    
                    <label class="w-full px-3 py-2 bg-zinc-800 hover:bg-zinc-900 dark:bg-zinc-100 dark:hover:bg-white text-white dark:text-black rounded-lg text-xs font-semibold flex items-center justify-center gap-1.5 cursor-pointer">
                        <i data-lucide="upload" class="w-3.5 h-3.5"></i> Import Backup
                        <input type="file" id="import-file" accept=".json" class="hidden" onchange="app.importJSON(event)">
                    </label>
                    
                    <hr class="border-zinc-200 dark:border-zinc-800">
                    
                    <button onclick="app.clearCache()" class="w-full px-3 py-2 bg-amber-100 dark:bg-amber-900/30 text-amber-700 dark:text-amber-400 rounded-lg text-xs font-semibold">
                        <i data-lucide="refresh-cw" class="w-3.5 h-3.5 inline mr-1"></i> Clear Cache & Sync Ulang
                    </button>
                    
                    <button onclick="app.factoryReset()" class="w-full px-3 py-2 bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-400 rounded-lg text-xs font-semibold">
                        <i data-lucide="alert-triangle" class="w-3.5 h-3.5 inline mr-1"></i> Reset Semua Data Lokal
                    </button>
                </div>
            `;
        },
        
        exportJSON: function() {
            const data = {
                version: '3.0',
                exportedAt: new Date().toISOString(),
                menu: this.menu,
                kategori: this.kategori,
                info: this.info,
                footer: this.footer
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `superapp-backup-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
            this.toast('Backup didownload', 'success');
        },
        
        importJSON: function(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (!data.menu || !Array.isArray(data.menu)) throw new Error('Invalid format');
                    this.toast(`File berisi ${data.menu.length} menu. Apply manual via Sheet untuk saat ini.`, 'warning');
                } catch(err) {
                    this.toast('File tidak valid: ' + err.message, 'error');
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        },
        
        clearCache: function() {
            if (!confirm('Clear cache & sync ulang dari server?')) return;
            localStorage.removeItem(this.KEYS.CACHE);
            localStorage.removeItem(this.KEYS.LAST_SYNC);
            this.menu = [];
            this.kategori = [];
            this.saveCache();
            this.syncNow();
            this.closePanel();
        },
        
        factoryReset: function() {
            if (!confirm('Reset SEMUA data lokal? Anda akan logout.')) return;
            if (!confirm('Yakin? Tindakan ini tidak bisa dibatalkan.')) return;
            Object.values(this.KEYS).forEach(k => localStorage.removeItem(k));
            location.reload();
        },
        
        // ============================================================
        // TAB: PREFERENSI
        // ============================================================
        renderTabPrefs: function() {
            const p = this.prefs;
            return `
                <div class="space-y-4">
                    <div>
                        <label class="block text-[10px] font-bold uppercase text-zinc-500 mb-1">Tampilan Default</label>
                        <div class="flex gap-2">
                            <button onclick="app.setPref('view','grid')" class="flex-1 px-3 py-2 rounded-lg text-xs font-semibold border ${p.view==='grid' ? 'bg-indigo-600 text-white border-indigo-600' : 'border-zinc-300 dark:border-zinc-700'}">
                                <i data-lucide="layout-grid" class="w-3.5 h-3.5 inline mr-1"></i> Grid
                            </button>
                            <button onclick="app.setPref('view','list')" class="flex-1 px-3 py-2 rounded-lg text-xs font-semibold border ${p.view==='list' ? 'bg-indigo-600 text-white border-indigo-600' : 'border-zinc-300 dark:border-zinc-700'}">
                                <i data-lucide="layout-list" class="w-3.5 h-3.5 inline mr-1"></i> List
                            </button>
                        </div>
                    </div>
                    
                    <label class="flex items-center justify-between p-3 border border-zinc-200 dark:border-zinc-800 rounded-lg cursor-pointer">
                        <div>
                            <p class="text-xs font-semibold">Tampilkan Click Counter</p>
                            <p class="text-[10px] text-zinc-500">Statistik klik pada card</p>
                        </div>
                        <input type="checkbox" ${p.showClicks ? 'checked' : ''} onchange="app.setPref('showClicks', this.checked)" class="w-4 h-4 rounded">
                    </label>
                    
                    <label class="flex items-center justify-between p-3 border border-zinc-200 dark:border-zinc-800 rounded-lg cursor-pointer">
                        <div>
                            <p class="text-xs font-semibold">Tampilkan Banner Info</p>
                            <p class="text-[10px] text-zinc-500">Banner pengumuman di atas</p>
                        </div>
                        <input type="checkbox" ${p.showBanner ? 'checked' : ''} onchange="app.setPref('showBanner', this.checked)" class="w-4 h-4 rounded">
                    </label>
                    
                    <label class="flex items-center justify-between p-3 border border-zinc-200 dark:border-zinc-800 rounded-lg cursor-pointer">
                        <div>
                            <p class="text-xs font-semibold">Auto Sync</p>
                            <p class="text-[10px] text-zinc-500">Sync otomatis tiap ${p.autoSyncInterval} menit</p>
                        </div>
                        <input type="checkbox" ${p.autoSync ? 'checked' : ''} onchange="app.setPref('autoSync', this.checked)" class="w-4 h-4 rounded">
                    </label>
                    
                    <div>
                        <label class="block text-[10px] font-bold uppercase text-zinc-500 mb-1">Interval Auto Sync (menit)</label>
                        <input type="number" min="1" max="60" value="${p.autoSyncInterval}" onchange="app.setPref('autoSyncInterval', Number(this.value))" class="w-full bg-zinc-50 dark:bg-zinc-900 border border-zinc-300 dark:border-zinc-700 rounded-lg px-3 py-2 text-sm">
                    </div>
                    
                    <hr class="border-zinc-200 dark:border-zinc-800">
                    
                    <div class="p-3 bg-zinc-50 dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-lg">
                        <p class="text-[10px] text-zinc-500 mb-2">💡 <strong>Tips:</strong> Aplikasi tidak akan refresh otomatis saat dibuka. Data ditampilkan dari cache terakhir. Klik tombol Sync (🔄) untuk memperbarui.</p>
                    </div>
                </div>
            `;
        },
        
        setPref: function(key, value) {
            this.prefs[key] = value;
            this.savePrefs();
            this.renderPanel();
            
            if (key === 'view') {
                this.updateViewIcon();
                this.renderAll();
            }
            if (key === 'showClicks' || key === 'showBanner') this.renderAll();
        },
        
        // ============================================================
        // UI HELPERS
        // ============================================================
        updateUIState: function() {
            const isLoggedIn = !!this.user;
            const canEdit = isLoggedIn && (this.user.jabatan.toLowerCase() === 'super admin' || this.user.jabatan.toLowerCase() === 'admin');
            
            document.getElementById('form-login').classList.toggle('hidden', isLoggedIn);
            document.getElementById('view-profile').classList.toggle('hidden', !isLoggedIn);
            
            const navBadge = document.getElementById('nav-role-badge');
            const authText = document.getElementById('btn-auth-text');
            const btnTambah = document.getElementById('btn-tambah');
            
            if (isLoggedIn) {
                navBadge.innerText = this.user.jabatan;
                navBadge.className = "text-[9px] font-mono uppercase tracking-wider text-indigo-600 dark:text-indigo-400 font-bold hidden sm:inline";
                authText.innerText = this.user.nama.split(' ')[0];
                
                document.getElementById('prof-name').innerText = this.user.nama;
                document.getElementById('prof-role').innerText = this.user.jabatan;
                document.getElementById('prof-unit').innerText = this.user.unit || '-';
                document.getElementById('prof-email').innerText = this.user.email || '-';
                
                if (canEdit) {
                    btnTambah.classList.remove('hidden');
                } else {
                    btnTambah.classList.add('hidden');
                }
            } else {
                navBadge.innerText = "Guest";
                navBadge.className = "text-[9px] font-mono uppercase tracking-wider text-zinc-500 font-semibold hidden sm:inline";
                authText.innerText = "Login";
                btnTambah.classList.add('hidden');
                this.editMode = false;
            }
            
            lucide.createIcons();
        },
        
        updateSyncIndicator: function(state) {
            const dot = document.getElementById('sync-dot');
            const text = document.getElementById('sync-text');
            const queue = JSON.parse(localStorage.getItem(this.KEYS.PENDING) || '[]');
            const lastSync = localStorage.getItem(this.KEYS.LAST_SYNC);
            
            const s = state || (this.isOnline ? 'synced' : 'offline');
            const states = {
                synced: { color: 'bg-emerald-500' },
                syncing: { color: 'bg-amber-500 sync-pulse' },
                offline: { color: 'bg-zinc-400' },
                error: { color: 'bg-red-500' }
            };
            
            const cfg = states[s] || states.synced;
            dot.className = 'w-1.5 h-1.5 rounded-full ' + cfg.color;
            
            let label = 'Baru saja';
            if (queue.length > 0) label = `Pending (${queue.length})`;
            else if (!this.isOnline) label = 'Offline';
            else if (lastSync) {
                const ago = this.timeAgo(lastSync);
                label = ago;
            }
            
            text.innerText = label;
        },
        
        timeAgo: function(isoString) {
            if (!isoString) return 'Belum sync';
            try {
                const d = new Date(isoString.replace(' ', 'T'));
                const diff = Math.floor((Date.now() - d.getTime()) / 1000);
                if (diff < 60) return 'Baru saja';
                if (diff < 3600) return `${Math.floor(diff/60)}m lalu`;
                if (diff < 86400) return `${Math.floor(diff/3600)}j lalu`;
                return `${Math.floor(diff/86400)}h lalu`;
            } catch(e) { return 'Belum sync'; }
        },
        
        openAuthModal: function() {
            const m = document.getElementById('auth-modal');
            m.classList.remove('hidden'); m.classList.add('flex');
        },
        
        closeModal: function(id) {
            const m = document.getElementById(id);
            if (m) { m.classList.add('hidden'); m.classList.remove('flex'); }
        },
        
        toggleTheme: function() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem(this.KEYS.THEME, isDark ? 'dark' : 'light');
        },
        
        toast: function(msg, type) {
            const colors = {
                success: 'bg-emerald-500', error: 'bg-red-500',
                warning: 'bg-amber-500', info: 'bg-zinc-800 dark:bg-zinc-700'
            };
            const icons = { success: 'check-circle', error: 'alert-circle', warning: 'alert-triangle', info: 'info' };
            
            const el = document.createElement('div');
            el.className = `toast ${colors[type] || colors.info} text-white px-3 py-2 rounded-lg shadow-lg flex items-center gap-2 text-xs font-semibold`;
            el.innerHTML = `<i data-lucide="${icons[type] || 'info'}" class="w-3.5 h-3.5 shrink-0"></i><span class="flex-1">${this.escape(msg)}</span>`;
            
            document.getElementById('toast-container').appendChild(el);
            lucide.createIcons();
            
            setTimeout(() => {
                el.style.transition = 'all 0.25s';
                el.style.opacity = '0';
                el.style.transform = 'translateX(100%)';
                setTimeout(() => el.remove(), 250);
            }, 2500);
        },
        
        // ============================================================
        // ICON & COLOR PICKER
        // ============================================================
        setupIconPicker: function() {
            const grid = document.getElementById('icon-grid');
            const search = document.getElementById('link-icon-search');
            if (!grid) return;
            
            const render = (filter) => {
                const list = filter ? this.ICONS.filter(i => i.includes(filter.toLowerCase())) : this.ICONS;
                grid.innerHTML = list.map(ic => `
                    <div class="icon-btn ${document.getElementById('link-icon').value === ic ? 'selected' : ''}" 
                         onclick="app.selectIcon('${ic}')" title="${ic}">
                        <i data-lucide="${ic}" class="w-4 h-4"></i>
                    </div>
                `).join('');
                lucide.createIcons();
            };
            
            search.addEventListener('input', e => render(e.target.value));
            render('');
        },
        
        selectIcon: function(ic) {
            document.getElementById('link-icon').value = ic;
            document.querySelectorAll('#icon-grid .icon-btn').forEach(b => b.classList.remove('selected'));
            const target = Array.from(document.querySelectorAll('#icon-grid .icon-btn')).find(b => b.title === ic);
            if (target) target.classList.add('selected');
        },
        
        setupColorPicker: function() {
            const picker = document.getElementById('color-picker');
            if (!picker) return;
            const colorMap = {
                zinc: 'bg-zinc-400', blue: 'bg-blue-500', red: 'bg-red-500', green: 'bg-green-500',
                emerald: 'bg-emerald-500', rose: 'bg-rose-500', yellow: 'bg-yellow-500', indigo: 'bg-indigo-500',
                purple: 'bg-purple-500', orange: 'bg-orange-500', pink: 'bg-pink-500', sky: 'bg-sky-500',
                teal: 'bg-teal-500', violet: 'bg-violet-500'
            };
            picker.innerHTML = this.COLORS.map(c => `
                <div class="color-dot ${colorMap[c]}" data-color="${c}" onclick="app.selectColor('${c}')" title="${c}"></div>
            `).join('');
        },
        
        selectColor: function(c) {
            document.getElementById('link-warna').value = c;
            document.querySelectorAll('#color-picker .color-dot').forEach(d => d.classList.remove('selected'));
            const target = document.querySelector(`#color-picker .color-dot[data-color="${c}"]`);
            if (target) target.classList.add('selected');
        },
        
        // ============================================================
        // UTILS
        // ============================================================
        getColorClasses: function(color) {
            const map = {
                blue: 'text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/20',
                red: 'text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-900/20',
                green: 'text-green-600 dark:text-green-400 bg-green-50 dark:bg-green-900/20',
                emerald: 'text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-900/20',
                rose: 'text-rose-600 dark:text-rose-400 bg-rose-50 dark:bg-rose-900/20',
                yellow: 'text-yellow-600 dark:text-yellow-400 bg-yellow-50 dark:bg-yellow-900/20',
                indigo: 'text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-900/20',
                purple: 'text-purple-600 dark:text-purple-400 bg-purple-50 dark:bg-purple-900/20',
                orange: 'text-orange-600 dark:text-orange-400 bg-orange-50 dark:bg-orange-900/20',
                pink: 'text-pink-600 dark:text-pink-400 bg-pink-50 dark:bg-pink-900/20',
                sky: 'text-sky-600 dark:text-sky-400 bg-sky-50 dark:bg-sky-900/20',
                teal: 'text-teal-600 dark:text-teal-400 bg-teal-50 dark:bg-teal-900/20',
                violet: 'text-violet-600 dark:text-violet-400 bg-violet-50 dark:bg-violet-900/20'
            };
            return map[color] || 'text-zinc-600 dark:text-zinc-400 bg-zinc-100 dark:bg-zinc-800';
        },
        
        escape: function(str) {
            return String(str ?? '').replace(/[&<>"']/g, m => ({
                '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
            })[m]);
        },
        
        safeUrl: function(url) {
            try {
                const u = new URL(String(url));
                if (u.protocol === 'http:' || u.protocol === 'https:') return u.href;
            } catch(e) {}
            return '#';
        }
    };
    
    document.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
