<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" content="#0a0b10">
    <meta name="description" content="Console v4.0">
    <title>Console</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/onelabszz/super/refs/heads/main/super.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        ink: {
                            950: '#0a0b10',
                            900: '#0d0f14',
                            850: '#14171f',
                            800: '#181c26',
                            750: '#1e2230',
                            700: '#252a3a',
                            600: '#3a4054',
                        },
                        accent: {
                            DEFAULT: '#a5b4fc',
                            hover: '#c4caff',
                            dim: '#818cf8',
                            soft: 'rgba(165, 180, 252, 0.12)',
                        }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        html, body { background-color: #0a0b10; }
        body { font-family: 'Inter', sans-serif; color: #e4e4e7; overflow-x: hidden; }
        
        /* Subtle grain */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image: radial-gradient(rgba(255,255,255,0.015) 1px, transparent 1px);
            background-size: 3px 3px;
            pointer-events: none; z-index: 0;
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #252a3a; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #3a4054; }
        
        /* Sidebar */
        .sidebar {
            position: fixed; top: 0; left: 0; bottom: 0;
            width: 260px;
            background: #0d0f14;
            border-right: 1px solid #1e2230;
            transform: translateX(-100%);
            transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 60;
            display: flex; flex-direction: column;
        }
        .sidebar.open { transform: translateX(0); }
        
        @media (min-width: 1024px) {
            .sidebar { transform: translateX(0); }
            .sidebar.collapsed { transform: translateX(-100%); }
            .main-area { margin-left: 260px; transition: margin 0.28s cubic-bezier(0.16, 1, 0.3, 1); }
            .main-area.expanded { margin-left: 0; }
        }
        
        .backdrop {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 55;
            opacity: 0; pointer-events: none;
            transition: opacity 0.25s;
        }
        .backdrop.show { opacity: 1; pointer-events: auto; }
        
        @media (min-width: 1024px) { .backdrop { display: none !important; } }
        
        /* Nav items */
        .nav-item {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 13px; font-weight: 500;
            color: #a1a1aa;
            transition: all 0.15s;
            cursor: pointer;
            position: relative;
        }
        .nav-item:hover { background: #181c26; color: #e4e4e7; }
        .nav-item.active { background: rgba(165, 180, 252, 0.1); color: #a5b4fc; font-weight: 600; }
        .nav-item.active::before {
            content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
            width: 3px; height: 20px;
            background: #a5b4fc; border-radius: 0 3px 3px 0;
        }
        
        /* Card */
        .card {
            background: #14171f;
            border: 1px solid #1e2230;
            border-radius: 14px;
            transition: all 0.2s;
        }
        
        /* Link card */
        .link-card {
            display: flex; flex-direction: column; align-items: center;
            padding: 14px 10px;
            text-align: center;
            cursor: pointer;
            position: relative;
        }
        @media (hover: hover) {
            .link-card:hover { transform: translateY(-2px); border-color: rgba(165, 180, 252, 0.3); }
        }
        .link-card:active { transform: scale(0.98); }
        
        /* Icon circle */
        .icon-circle {
            width: 46px; height: 46px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            position: relative;
            margin-bottom: 10px;
        }
        .icon-circle::after {
            content: ''; position: absolute; inset: -3px;
            border-radius: 50%;
            background: inherit;
            opacity: 0.35;
            filter: blur(14px);
            z-index: -1;
        }
        
        /* Buttons */
        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 13px; font-weight: 600;
            transition: all 0.15s;
            cursor: pointer;
            border: none;
            white-space: nowrap;
        }
        .btn-primary { background: #a5b4fc; color: #0a0b10; }
        .btn-primary:hover { background: #c4caff; }
        .btn-primary:active { transform: scale(0.97); }
        .btn-ghost { background: transparent; color: #a1a1aa; border: 1px solid #1e2230; }
        .btn-ghost:hover { background: #181c26; color: #e4e4e7; border-color: #252a3a; }
        .btn-danger { background: rgba(252, 165, 165, 0.1); color: #fca5a5; border: 1px solid rgba(252, 165, 165, 0.2); }
        .btn-danger:hover { background: rgba(252, 165, 165, 0.15); }
        .btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 8px; }
        
        /* Icon button */
        .icon-btn {
            width: 34px; height: 34px;
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: 9px;
            color: #a1a1aa;
            transition: all 0.15s;
            cursor: pointer;
            background: transparent; border: none;
            flex-shrink: 0;
        }
        .icon-btn:hover { background: #181c26; color: #e4e4e7; }
        .icon-btn:active { transform: scale(0.94); }
        
        /* Input */
        .input {
            width: 100%;
            background: #14171f;
            border: 1px solid #1e2230;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 13px;
            color: #e4e4e7;
            outline: none;
            transition: all 0.15s;
        }
        .input:focus { border-color: rgba(165, 180, 252, 0.5); box-shadow: 0 0 0 3px rgba(165, 180, 252, 0.1); }
        .input::placeholder { color: #52525b; }
        .input:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* Modal */
        .modal {
            position: fixed; inset: 0; z-index: 70;
            display: none; align-items: center; justify-content: center;
            padding: 16px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
        }
        .modal.show { display: flex; }
        .modal-box {
            background: #0d0f14;
            border: 1px solid #1e2230;
            border-radius: 18px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            max-height: 92vh;
            width: 100%;
            display: flex; flex-direction: column;
            overflow: hidden;
            animation: modalIn 0.22s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.96) translateY(8px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        
        /* Toast */
        #toast-container {
            position: fixed; top: 76px; right: 14px; z-index: 80;
            display: flex; flex-direction: column; gap: 8px;
            max-width: 320px;
            pointer-events: none;
        }
        .toast {
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 12.5px; font-weight: 600;
            display: flex; align-items: center; gap: 10px;
            box-shadow: 0 10px 30px -5px rgba(0,0,0,0.4);
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: auto;
            border: 1px solid;
        }
        @keyframes slideIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .toast-success { background: rgba(110, 231, 183, 0.12); color: #6ee7b7; border-color: rgba(110, 231, 183, 0.25); }
        .toast-error { background: rgba(252, 165, 165, 0.12); color: #fca5a5; border-color: rgba(252, 165, 165, 0.25); }
        .toast-warning { background: rgba(252, 211, 77, 0.12); color: #fcd34d; border-color: rgba(252, 211, 77, 0.25); }
        .toast-info { background: rgba(165, 180, 252, 0.12); color: #a5b4fc; border-color: rgba(165, 180, 252, 0.25); }
        
        /* Sync status */
        .sync-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: #6ee7b7; flex-shrink: 0;
        }
        .sync-dot.syncing { background: #a5b4fc; animation: pulse 1.2s ease-in-out infinite; }
        .sync-dot.offline { background: #52525b; }
        .sync-dot.error { background: #fca5a5; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        
        /* Grid/List view for links */
        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
        }
        @media (min-width: 640px) { .links-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); } }
        @media (min-width: 1024px) { .links-grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); } }
        
        .links-list {
            display: flex; flex-direction: column; gap: 6px;
        }
        .link-row {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 12px;
            background: #14171f;
            border: 1px solid #1e2230;
            border-radius: 12px;
            transition: all 0.15s;
            cursor: pointer;
        }
        .link-row:hover { background: #181c26; border-color: rgba(165, 180, 252, 0.3); }
        
        /* Sortable */
        .sortable-ghost { opacity: 0.3; background: rgba(165, 180, 252, 0.2) !important; border-radius: 12px; }
        .drag-handle { cursor: grab; }
        .drag-handle:active { cursor: grabbing; }
        
        /* Section header */
        .section-header {
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 12px;
            padding: 0 2px;
        }
        
        /* Light mode tweaks */
        html:not(.dark) body { background: #f4f5f8; color: #1e2230; }
        html:not(.dark) body::before { background-image: radial-gradient(rgba(0,0,0,0.015) 1px, transparent 1px); }
        html:not(.dark) .sidebar { background: #ffffff; border-color: #e4e4e7; }
        html:not(.dark) .nav-item { color: #52525b; }
        html:not(.dark) .nav-item:hover { background: #f4f4f5; color: #18181b; }
        html:not(.dark) .nav-item.active { background: rgba(129, 140, 248, 0.1); color: #6366f1; }
        html:not(.dark) .nav-item.active::before { background: #6366f1; }
        html:not(.dark) .card, html:not(.dark) .link-card, html:not(.dark) .link-row { background: #ffffff; border-color: #e4e4e7; }
        html:not(.dark) .input { background: #ffffff; border-color: #e4e4e7; color: #18181b; }
        html:not(.dark) .modal-box { background: #ffffff; border-color: #e4e4e7; }
        html:not(.dark) .icon-btn:hover { background: #f4f4f5; color: #18181b; }
        html:not(.dark) .btn-ghost { border-color: #e4e4e7; color: #52525b; }
        html:not(.dark) .btn-ghost:hover { background: #f4f4f5; color: #18181b; }
        html:not(.dark) .text-white { color: #18181b; }
        html:not(.dark) .text-zinc-400 { color: #71717a; }
        html:not(.dark) .text-zinc-500 { color: #71717a; }
        html:not(.dark) .border-ink-750, html:not(.dark) .border-ink-700 { border-color: #e4e4e7; }
    </style>
</head>
<body>

    <!-- SIDEBAR BACKDROP -->
    <div id="sidebar-backdrop" class="backdrop" onclick="app.closeSidebar()"></div>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="sidebar">
        <!-- Header -->
        <div class="flex items-center justify-between p-4 border-b border-ink-750">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl bg-accent flex items-center justify-center shrink-0">
                    <img src="https://raw.githubusercontent.com/onelabszz/super/refs/heads/main/super.png" class="w-6 h-6 object-contain" alt="Logo">
                </div>
                <div class="min-w-0">
                    <h1 class="font-bold text-sm text-white leading-tight">Console</h1>
                    <p class="text-[10px] text-zinc-500 truncate" id="sidebar-user-info">Guest</p>
                </div>
            </div>
            <button onclick="app.closeSidebar()" class="icon-btn lg:hidden">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>
        
        <!-- Nav -->
        <nav class="flex-1 overflow-y-auto p-3 space-y-1">
            <button onclick="app.navigate('dashboard')" data-nav="dashboard" class="nav-item w-full">
                <i data-lucide="home" class="w-4 h-4 shrink-0"></i>
                <span>Dashboard</span>
            </button>
            <button onclick="app.navigate('info')" data-nav="info" class="nav-item w-full">
                <i data-lucide="info" class="w-4 h-4 shrink-0"></i>
                <span>Info & Banner</span>
            </button>
            <button onclick="app.navigate('kategori')" data-nav="kategori" class="nav-item w-full">
                <i data-lucide="folder" class="w-4 h-4 shrink-0"></i>
                <span>Kategori</span>
            </button>
            <button onclick="app.navigate('users')" data-nav="users" class="nav-item w-full">
                <i data-lucide="users" class="w-4 h-4 shrink-0"></i>
                <span>Users</span>
            </button>
            <button onclick="app.navigate('feedback')" data-nav="feedback" class="nav-item w-full">
                <i data-lucide="inbox" class="w-4 h-4 shrink-0"></i>
                <span>Feedback</span>
                <span id="nav-feedback-badge" class="ml-auto text-[10px] bg-red-500/20 text-red-400 font-bold px-1.5 py-0.5 rounded-full hidden">0</span>
            </button>
            
            <div class="my-3 border-t border-ink-750"></div>
            <p class="px-3 py-1 text-[10px] font-bold uppercase tracking-wider text-zinc-600">Sistem</p>
            
            <button onclick="app.navigate('backup')" data-nav="backup" class="nav-item w-full">
                <i data-lucide="database" class="w-4 h-4 shrink-0"></i>
                <span>Backup & Sync</span>
            </button>
            <button onclick="app.navigate('prefs')" data-nav="prefs" class="nav-item w-full">
                <i data-lucide="sliders" class="w-4 h-4 shrink-0"></i>
                <span>Preferensi</span>
            </button>
            <button onclick="app.navigate('diagnostic')" data-nav="diagnostic" class="nav-item w-full">
                <i data-lucide="activity" class="w-4 h-4 shrink-0"></i>
                <span>Diagnostik</span>
            </button>
        </nav>
        
        <!-- Footer -->
        <div class="p-3 border-t border-ink-750 space-y-2">
            <div id="sidebar-auth-area"></div>
        </div>
    </aside>

    <!-- MAIN AREA -->
    <div id="main-area" class="main-area min-h-screen flex flex-col">
        
        <!-- TOP BAR -->
        <header class="sticky top-0 z-40 border-b border-ink-750 bg-ink-950/85" style="backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);">
            <div class="h-14 flex items-center gap-2 px-3">
                <!-- Hamburger -->
                <button onclick="app.toggleSidebar()" class="icon-btn">
                    <i data-lucide="menu" class="w-5 h-5"></i>
                </button>
                
                <!-- Title -->
                <h2 id="page-title" class="font-semibold text-sm text-white truncate">Dashboard</h2>
                
                <!-- Search (desktop only) -->
                <div class="hidden md:flex flex-1 max-w-md mx-auto relative">
                    <i data-lucide="search" class="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500"></i>
                    <input type="text" id="search-input" placeholder="Cari menu..." class="input pl-9 py-1.5 text-xs">
                </div>
                
                <!-- Actions -->
                <div class="flex items-center gap-0.5 ml-auto">
                    <!-- Sync status -->
                    <div class="hidden sm:flex items-center gap-1.5 mr-1.5 px-2 py-1 rounded-md bg-ink-850 text-[10px]">
                        <span id="sync-dot" class="sync-dot"></span>
                        <span id="sync-text" class="text-zinc-500 font-mono">Synced</span>
                    </div>
                    
                    <button onclick="app.syncNow()" id="btn-sync" class="icon-btn" title="Sync">
                        <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                    </button>
                    
                    <button onclick="app.toggleView()" class="icon-btn" title="Ganti tampilan">
                        <i data-lucide="layout-grid" id="view-icon" class="w-4 h-4"></i>
                    </button>
                    
                    <button onclick="app.toggleTheme()" class="icon-btn">
                        <i data-lucide="moon" class="w-4 h-4 hidden dark:block"></i>
                        <i data-lucide="sun" class="w-4 h-4 block dark:hidden"></i>
                    </button>
                    
                    <button onclick="app.openAuthModal()" class="btn btn-primary btn-sm ml-1">
                        <i data-lucide="user-circle" class="w-3.5 h-3.5"></i>
                        <span id="btn-auth-text" class="hidden sm:inline">Login</span>
                    </button>
                </div>
            </div>
            
            <!-- Mobile search -->
            <div class="md:hidden px-3 pb-2.5">
                <div class="relative">
                    <i data-lucide="search" class="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500"></i>
                    <input type="text" id="search-input-mobile" placeholder="Cari menu..." class="input pl-9 py-2 text-xs">
                </div>
            </div>
        </header>
        
        <!-- CONTENT -->
        <main id="page-content" class="flex-1 p-3 sm:p-5 pb-16"></main>
    </div>

    <!-- TOASTS -->
    <div id="toast-container"></div>

    <!-- MODAL: LOGIN -->
    <div id="auth-modal" class="modal">
        <div class="modal-box max-w-sm">
            <button onclick="app.closeModal('auth-modal')" class="icon-btn absolute top-3 right-3 z-10">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
            
            <div id="form-login" class="p-6">
                <div class="text-center mb-6">
                    <div class="w-14 h-14 rounded-2xl bg-accent-soft border border-accent/20 flex items-center justify-center mx-auto mb-3">
                        <i data-lucide="shield-check" class="w-6 h-6 text-accent"></i>
                    </div>
                    <h3 class="text-base font-semibold text-white">Selamat Datang</h3>
                    <p class="text-xs text-zinc-500 mt-1">Masuk untuk mengelola</p>
                </div>
                <form onsubmit="event.preventDefault(); app.doLogin()" class="space-y-3">
                    <input type="email" id="input-email" placeholder="Email" autocomplete="email" class="input">
                    <input type="password" id="input-pass" placeholder="Password" autocomplete="current-password" class="input">
                    <label class="flex items-center gap-2 cursor-pointer text-xs text-zinc-400">
                        <input type="checkbox" id="remember-me" checked class="w-3.5 h-3.5 rounded">
                        <span>Ingat saya</span>
                    </label>
                    <button type="submit" id="btn-submit" class="btn btn-primary w-full py-3 mt-1">
                        <i data-lucide="log-in" class="w-4 h-4"></i>
                        <span>Masuk</span>
                    </button>
                </form>
            </div>
            
            <div id="view-profile" class="hidden">
                <div class="p-6 text-center border-b border-ink-750">
                    <div class="w-16 h-16 rounded-2xl mx-auto mb-3 flex items-center justify-center border border-accent/20 bg-accent-soft">
                        <img src="https://raw.githubusercontent.com/onelabszz/super/refs/heads/main/super.png" class="w-10 h-10 object-contain" alt="Avatar">
                    </div>
                    <h3 class="text-sm font-semibold text-white" id="prof-name">-</h3>
                    <p class="inline-block mt-1.5 px-2.5 py-0.5 bg-accent-soft text-accent text-[10px] font-mono font-bold uppercase rounded-full" id="prof-role">-</p>
                </div>
                <div class="p-4 space-y-3">
                    <div class="flex justify-between text-xs py-2 border-b border-ink-750">
                        <span class="text-zinc-500">Unit</span>
                        <span class="font-medium text-zinc-300" id="prof-unit">-</span>
                    </div>
                    <div class="flex justify-between text-xs py-2 border-b border-ink-750">
                        <span class="text-zinc-500">Email</span>
                        <span class="font-medium text-zinc-300 text-[11px]" id="prof-email">-</span>
                    </div>
                    <button onclick="app.doLogout()" class="btn btn-danger w-full py-2.5 mt-2">
                        <i data-lucide="log-out" class="w-4 h-4"></i>
                        <span>Logout</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: LINK CRUD -->
    <div id="link-modal" class="modal">
        <div class="modal-box max-w-lg">
            <div class="flex items-center justify-between p-4 border-b border-ink-750 shrink-0">
                <h3 class="text-sm font-semibold text-white" id="link-modal-title">Tambah Link</h3>
                <button onclick="app.closeModal('link-modal')" class="icon-btn">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
            
            <div class="p-4 overflow-y-auto space-y-3 flex-1">
                <input type="hidden" id="link-id">
                
                <div>
                    <label class="block text-[10px] font-semibold uppercase tracking-wider text-zinc-500 mb-1.5">Judul *</label>
                    <input type="text" id="link-judul" placeholder="Nama link" class="input">
                </div>
                
                <div>
                    <label class="block text-[10px] font-semibold uppercase tracking-wider text-zinc-500 mb-1.5">URL *</label>
                    <input type="url" id="link-url" placeholder="https://..." class="input font-mono text-xs">
                </div>
                
                <div>
                    <label class="block text-[10px] font-semibold uppercase tracking-wider text-zinc-500 mb-1.5">Deskripsi</label>
                    <textarea id="link-deskripsi" rows="2" placeholder="Deskripsi singkat" class="input resize-none"></textarea>
                </div>
                
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-semibold uppercase tracking-wider text-zinc-500 mb-1.5">Kategori</label>
                        <select id="link-kategori" class="input"></select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-semibold uppercase tracking-wider text-zinc-500 mb-1.5">Akses Role</label>
                        <input type="text" id="link-role" placeholder="Kosong = publik" class="input">
                    </div>
                </div>
                
                <div>
                    <label class="block text-[10px] font-semibold uppercase tracking-wider text-zinc-500 mb-1.5">Icon</label>
                    <input type="text" id="link-icon-search" placeholder="Cari icon..." class="input text-xs py-2 mb-2">
                    <div id="icon-grid" class="grid grid-cols-8 sm:grid-cols-10 gap-1.5 max-h-32 overflow-y-auto p-2 border border-ink-750 rounded-lg bg-ink-900"></div>
                    <input type="hidden" id="link-icon" value="link">
                </div>
                
                <div>
                    <label class="block text-[10px] font-semibold uppercase tracking-wider text-zinc-500 mb-1.5">Warna</label>
                    <div class="flex flex-wrap gap-1.5" id="color-picker"></div>
                    <input type="hidden" id="link-warna" value="indigo">
                </div>
                
                <div class="flex items-center gap-3 pt-1">
                    <label class="flex items-center gap-2 cursor-pointer text-xs text-zinc-300">
                        <input type="checkbox" id="link-pinned" class="w-4 h-4 rounded">
                        <span class="font-medium">⭐ Pin ke atas</span>
                    </label>
                    <select id="link-status" class="input py-1.5 w-auto text-xs">
                        <option value="aktif">Aktif</option>
                        <option value="arsip">Arsip</option>
                    </select>
                </div>
            </div>
            
            <div class="flex items-center gap-2 p-4 border-t border-ink-750 shrink-0">
                <button onclick="app.closeModal('link-modal')" class="btn btn-ghost flex-1">Batal</button>
                <button onclick="app.saveLink()" class="btn btn-primary flex-1">
                    <i data-lucide="save" class="w-4 h-4"></i>
                    <span>Simpan & Sync</span>
                </button>
            </div>
        </div>
    </div>

    <script>
    // ============================================================
    // APP v4.0
    // ============================================================
    const app = {
        apiURL: "https://script.google.com/macros/s/AKfycbx-VZ5H9Yy0drhyHucFrrhe4CHm5R7gNzmA-3VFrhgTBzYJzHYPCMp-TkWDVU0eIdr0/exec",
        
        user: null, menu: [], kategori: [], info: {}, footer: [], users: [], feedbackList: [],
        editMode: false, sortables: [], isOnline: navigator.onLine,
        currentView: 'dashboard',
        sidebarOpen: false,
        
        KEYS: {
            SESSION: 'sa4_session', CACHE: 'sa4_cache', PENDING: 'sa4_pending',
            LAST_SYNC: 'sa4_lastsync', PREFS: 'sa4_prefs', THEME: 'sa4_theme'
        },
        
        prefs: { view: 'grid', showClicks: true, showBanner: true, autoSync: false, autoSyncInterval: 5 },
        
        ICONS: ['link','home','settings','user','users','folder','folder-cog','file','file-text','image','video','music','download','upload','cloud','database','server','globe','map-pin','calendar','clock','mail','message-circle','phone','bell','book','book-open','graduation-cap','clipboard','clipboard-check','award','star','heart','bookmark','tag','shopping-cart','shopping-bag','credit-card','dollar-sign','trending-up','bar-chart','pie-chart','activity','zap','shield','shield-check','lock','unlock','key','eye','search','filter','edit','trash-2','plus','minus','check','x','arrow-right','arrow-up-right','external-link','play','pause','power','wifi','battery','monitor','smartphone','tablet','printer','cpu','hard-drive','code','terminal','git-branch','inbox','send','log-out','log-in','layout-dashboard','package','truck','map','compass','sparkles','rocket','flame','crown','gem','palette','brush','pen-tool','camera','headphones','mic','radio','tv','film','gamepad-2','puzzle','trophy','target','flag','info','help-circle','alert-circle','alert-triangle','save','pencil','loader-2','refresh-cw','layout-grid','layout-list','settings-2','user-circle','user-plus','sliders','check-circle','shield-lock','menu','chevron-right','chevron-down'],
        
        COLORS: ['indigo','sky','emerald','rose','amber','purple','teal','pink','orange','red','green','blue','violet','zinc'],
        
        // ============================================================
        // INIT
        // ============================================================
        init: function() {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            }
            
            const fsFlag = sessionStorage.getItem('force_sync_done');
            if (fsFlag) {
                sessionStorage.removeItem('force_sync_done');
                setTimeout(() => this.toast('Force Sync selesai', 'success'), 800);
                setTimeout(() => this.syncNow(true), 1200);
            }
            
            const savedTheme = localStorage.getItem(this.KEYS.THEME);
            if(savedTheme === 'light') document.documentElement.classList.remove('dark');
            else document.documentElement.classList.add('dark');
            
            try { this.prefs = { ...this.prefs, ...JSON.parse(localStorage.getItem(this.KEYS.PREFS) || '{}') }; } catch(e) {}
            try { const s = JSON.parse(localStorage.getItem(this.KEYS.SESSION) || 'null'); if (s?.user) this.user = s.user; } catch(e) {}
            
            this.loadFromCache();
            this.updateUIState();
            this.updateViewIcon();
            this.updateSyncIndicator();
            this.navigate('dashboard');
            
            ['search-input','search-input-mobile'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.addEventListener('input', (e) => {
                    if (this.currentView !== 'dashboard') this.navigate('dashboard');
                    this.renderDashboard(e.target.value.toLowerCase());
                });
            });
            
            this.setupIconPicker();
            this.setupColorPicker();
            
            window.addEventListener('online', () => { this.isOnline = true; this.updateSyncIndicator(); this.syncPending(); });
            window.addEventListener('offline', () => { this.isOnline = false; this.updateSyncIndicator(); });
            window.addEventListener('storage', (e) => { if (e.key === this.KEYS.CACHE) { this.loadFromCache(); this.renderCurrentView(); } });
            
            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); document.getElementById('search-input')?.focus(); }
                if (e.key === 'Escape') { this.closeModal('auth-modal'); this.closeModal('link-modal'); this.closeSidebar(); }
            });
            
            setTimeout(() => {
                if (this.user && (this.user.jabatan === 'Super Admin' || this.user.jabatan === 'Admin')) this.loadFeedback(true);
            }, 1500);
            
            lucide.createIcons();
        },
        
        // ============================================================
        // SIDEBAR & NAV
        // ============================================================
        toggleSidebar: function() {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');
            const mainArea = document.getElementById('main-area');
            
            // Desktop: toggle collapse
            if (window.innerWidth >= 1024) {
                sidebar.classList.toggle('collapsed');
                mainArea.classList.toggle('expanded');
                return;
            }
            
            // Mobile: overlay
            this.sidebarOpen = !this.sidebarOpen;
            sidebar.classList.toggle('open', this.sidebarOpen);
            backdrop.classList.toggle('show', this.sidebarOpen);
        },
        
        closeSidebar: function() {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');
            if (window.innerWidth < 1024) {
                this.sidebarOpen = false;
                sidebar.classList.remove('open');
                backdrop.classList.remove('show');
            }
        },
        
        navigate: function(view) {
            this.currentView = view;
            
            // Update nav active state
            document.querySelectorAll('.nav-item').forEach(n => {
                n.classList.toggle('active', n.dataset.nav === view);
            });
            
            // Update title
            const titles = {
                dashboard: 'Dashboard', info: 'Info & Banner', kategori: 'Kategori',
                users: 'Users', feedback: 'Feedback', backup: 'Backup & Sync',
                prefs: 'Preferensi', diagnostic: 'Diagnostik'
            };
            document.getElementById('page-title').textContent = titles[view] || 'Dashboard';
            
            // Show/hide search
            const searchDesktop = document.getElementById('search-input')?.parentElement;
            const searchMobile = document.getElementById('search-input-mobile')?.parentElement.parentElement;
            const show = view === 'dashboard';
            if (searchDesktop) searchDesktop.classList.toggle('hidden', !show);
            if (searchMobile) searchMobile.classList.toggle('hidden', !show);
            const viewBtn = document.querySelector('button[onclick="app.toggleView()"]');
            if (viewBtn) viewBtn.style.display = show ? '' : 'none';
            
            this.renderCurrentView();
            this.closeSidebar();
        },
        
        renderCurrentView: function() {
            const el = document.getElementById('page-content');
            const views = {
                dashboard: () => this.renderDashboard(),
                info: () => this.renderInfoPage(),
                kategori: () => this.renderKategoriPage(),
                users: () => this.renderUsersPage(),
                feedback: () => this.renderFeedbackPage(),
                backup: () => this.renderBackupPage(),
                prefs: () => this.renderPrefsPage(),
                diagnostic: () => this.renderDiagnosticPage()
            };
            el.innerHTML = (views[this.currentView] || views.dashboard)();
            if (this.currentView === 'dashboard') this.setupSortable();
            lucide.createIcons();
        },
        
        // ============================================================
        // STORAGE
        // ============================================================
        loadFromCache: function() {
            try {
                const c = JSON.parse(localStorage.getItem(this.KEYS.CACHE) || '{}');
                this.menu = c.menu || []; this.kategori = c.kategori || [];
                this.info = c.info || {}; this.footer = c.footer || [];
                this.users = c.users || []; this.feedbackList = c.feedback || [];
            } catch(e) {}
        },
        
        saveCache: function() {
            localStorage.setItem(this.KEYS.CACHE, JSON.stringify({
                menu: this.menu, kategori: this.kategori, info: this.info,
                footer: this.footer, users: this.users, feedback: this.feedbackList,
                cachedAt: new Date().toISOString()
            }));
        },
        
        saveSession: function() {
            if (this.user) localStorage.setItem(this.KEYS.SESSION, JSON.stringify({ user: this.user, savedAt: new Date().toISOString() }));
            else localStorage.removeItem(this.KEYS.SESSION);
        },
        
        savePrefs: function() { localStorage.setItem(this.KEYS.PREFS, JSON.stringify(this.prefs)); },
        
        // ============================================================
        // DASHBOARD
        // ============================================================
        renderDashboard: function(q) {
            q = q || '';
            const userRole = this.user ? this.user.jabatan.toLowerCase() : '';
            
            let items = this.menu.filter(item => {
                if (item.DELETED === true || item.DELETED === 'TRUE') return false;
                if (item.STATUS === 'arsip') return false;
                if (q && !(
                    String(item.JUDUL).toLowerCase().includes(q) ||
                    String(item.DESKRIPSI || '').toLowerCase().includes(q) ||
                    String(item.URL).toLowerCase().includes(q)
                )) return false;
                const reqRole = String(item.AKSES_ROLE || '').trim();
                if (!reqRole) return true;
                const roles = reqRole.split(',').map(r => r.trim().toLowerCase()).filter(Boolean);
                if (roles.length === 0) return true;
                if (userRole === 'super admin') return true;
                return roles.includes(userRole);
            });
            
            let html = '';
            
            // Banner
            const banner = this.renderBanner();
            
            // Toolbar info
            if (this.user && (userRole === 'super admin' || userRole === 'admin')) {
                html += `
                    <div class="flex items-center justify-between mb-4 gap-3">
                        <p class="text-xs text-zinc-500">
                            ${this.editMode ? '<span class="text-accent font-semibold">Edit mode aktif</span>' : `${items.length} link aktif`}
                        </p>
                        <div class="flex gap-2">
                            <button onclick="app.openLinkModal()" class="btn btn-primary btn-sm">
                                <i data-lucide="plus" class="w-3.5 h-3.5"></i> Tambah
                            </button>
                            <button onclick="app.toggleEditMode()" class="btn ${this.editMode ? 'btn-primary' : 'btn-ghost'} btn-sm">
                                <i data-lucide="${this.editMode ? 'check' : 'pencil'}" class="w-3.5 h-3.5"></i>
                                ${this.editMode ? 'Selesai' : 'Edit'}
                            </button>
                        </div>
                    </div>
                `;
            }
            
            if (items.length === 0) {
                html += `
                    <div class="flex flex-col items-center justify-center py-20 text-zinc-600">
                        <i data-lucide="inbox" class="w-10 h-10 mb-3 opacity-40"></i>
                        <p class="text-xs">${q ? 'Tidak ada hasil untuk "' + this.escape(q) + '"' : 'Belum ada menu'}</p>
                    </div>
                `;
                return banner + html;
            }
            
            // Group by kategori
            const groups = {};
            this.kategori.forEach(k => groups[k.NAMA] = []);
            groups['Lain-lain'] = groups['Lain-lain'] || [];
            items.forEach(item => {
                const kat = item.KATEGORI || 'Lain-lain';
                if (!groups[kat]) groups[kat] = [];
                groups[kat].push(item);
            });
            
            const sortedKat = Object.keys(groups).sort((a, b) => {
                const ka = this.kategori.find(k => k.NAMA === a);
                const kb = this.kategori.find(k => k.NAMA === b);
                return (Number(ka?.URUTAN) || 999) - (Number(kb?.URUTAN) || 999);
            });
            
            const isList = this.prefs.view === 'list';
            
            sortedKat.forEach(katName => {
                const katItems = groups[katName];
                if (!katItems || katItems.length === 0) return;
                
                katItems.sort((a, b) => {
                    const pa = (a.PINNED === true || a.PINNED === 'TRUE') ? 0 : 1;
                    const pb = (b.PINNED === true || b.PINNED === 'TRUE') ? 0 : 1;
                    if (pa !== pb) return pa - pb;
                    return (Number(a.URUTAN) || 999) - (Number(b.URUTAN) || 999);
                });
                
                const katInfo = this.kategori.find(k => k.NAMA === katName);
                const katIcon = katInfo?.ICON || 'folder';
                
                html += `
                    <div class="mb-5">
                        <div class="section-header">
                            <i data-lucide="${katIcon}" class="w-3.5 h-3.5 text-accent"></i>
                            <h3 class="text-[11px] font-semibold uppercase tracking-wider text-zinc-500">${this.escape(katName)}</h3>
                            <span class="text-[10px] text-zinc-600 font-mono ml-1">${katItems.length}</span>
                        </div>
                        ${isList 
                            ? `<div class="links-list menu-list">${katItems.map(i => this.renderRow(i)).join('')}</div>`
                            : `<div class="links-grid menu-grid">${katItems.map(i => this.renderCard(i)).join('')}</div>`
                        }
                    </div>
                `;
            });
            
            return banner + html;
        },
        
        renderBanner: function() {
            const info = this.info;
            const show = this.prefs.showBanner && info && (info.STATUS === 'ON' || info.STATUS === 'on') && info.PESAN;
            if (!show) return '';
            
            const colorMap = {
                green: 'border-emerald-500/30 bg-emerald-500/5 text-emerald-300',
                blue: 'border-sky-500/30 bg-sky-500/5 text-sky-300',
                red: 'border-red-500/30 bg-red-500/5 text-red-300',
                yellow: 'border-amber-500/30 bg-amber-500/5 text-amber-300',
                indigo: 'border-accent/30 bg-accent-soft text-accent'
            };
            const cls = colorMap[info.WARNA] || colorMap.indigo;
            
            return `
                <div class="mb-4 p-3 border rounded-xl flex items-start gap-2.5 ${cls}">
                    <i data-lucide="info" class="w-4 h-4 shrink-0 mt-0.5"></i>
                    <p class="text-xs leading-relaxed flex-1">${this.escape(info.PESAN)}</p>
                    <button onclick="app.hideBanner()" class="opacity-60 hover:opacity-100 p-0.5">
                        <i data-lucide="x" class="w-3.5 h-3.5"></i>
                    </button>
                </div>
            `;
        },
        
        hideBanner: function() {
            this.prefs.showBanner = false;
            this.savePrefs();
            this.renderCurrentView();
        },
        
        renderCard: function(item) {
            const isPinned = item.PINNED === true || item.PINNED === 'TRUE';
            const c = this.colorConfig(item.WARNA);
            const icon = item.ICON || 'link';
            const isEdit = this.editMode;
            const showClicks = this.prefs.showClicks && Number(item.CLICKS) > 0;
            
            return `
                <div class="link-card card ${isEdit ? '' : ''}" data-id="${item.ID}">
                    ${isEdit ? `
                        <div class="drag-handle absolute top-2 left-2 p-1 rounded-md text-zinc-500 z-10">
                            <i data-lucide="grip-vertical" class="w-3 h-3"></i>
                        </div>
                        <div class="absolute top-2 right-2 flex gap-0.5 z-10">
                            <button onclick="event.stopPropagation();app.editLink('${item.ID}')" class="icon-btn w-6 h-6" title="Edit">
                                <i data-lucide="pencil" class="w-3 h-3"></i>
                            </button>
                            <button onclick="event.stopPropagation();app.deleteLink('${item.ID}')" class="icon-btn w-6 h-6 text-red-400" title="Hapus">
                                <i data-lucide="trash-2" class="w-3 h-3"></i>
                            </button>
                        </div>
                    ` : ''}
                    
                    <a href="${isEdit ? 'javascript:void(0)' : this.safeUrl(item.URL)}" 
                       ${!isEdit ? 'target="_blank" rel="noopener"' : ''}
                       onclick="${isEdit ? 'event.preventDefault()' : `app.trackClick('${item.ID}')`}"
                       class="flex flex-col items-center flex-1 w-full ${isEdit ? 'pointer-events-none' : ''}">
                        <div class="icon-circle ${c.bg}" style="${c.glow}">
                            <i data-lucide="${icon}" class="w-5 h-5 ${c.text}"></i>
                        </div>
                        <h4 class="text-xs font-semibold text-white line-clamp-2 leading-snug min-h-[2rem]">${this.escape(item.JUDUL)}</h4>
                        ${showClicks ? `<div class="mt-1 text-[9px] text-zinc-600 font-mono">${item.CLICKS}×</div>` : ''}
                    </a>
                    
                    ${isPinned && !isEdit ? `<div class="absolute top-2 right-2 text-[10px]">⭐</div>` : ''}
                </div>
            `;
        },
        
        renderRow: function(item) {
            const isPinned = item.PINNED === true || item.PINNED === 'TRUE';
            const c = this.colorConfig(item.WARNA);
            const icon = item.ICON || 'link';
            const isEdit = this.editMode;
            const showClicks = this.prefs.showClicks && Number(item.CLICKS) > 0;
            
            return `
                <div class="link-row" data-id="${item.ID}">
                    ${isEdit ? `<div class="drag-handle p-1 text-zinc-500"><i data-lucide="grip-vertical" class="w-3.5 h-3.5"></i></div>` : ''}
                    <a href="${isEdit ? 'javascript:void(0)' : this.safeUrl(item.URL)}"
                       ${!isEdit ? 'target="_blank" rel="noopener"' : ''}
                       onclick="${isEdit ? 'event.preventDefault()' : `app.trackClick('${item.ID}')`}"
                       class="flex items-center gap-3 flex-1 min-w-0 ${isEdit ? 'pointer-events-none' : ''}">
                        <div class="w-9 h-9 rounded-full ${c.bg} flex items-center justify-center shrink-0">
                            <i data-lucide="${icon}" class="w-4 h-4 ${c.text}"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-1.5">
                                ${isPinned ? '<span class="text-[10px]">⭐</span>' : ''}
                                <h4 class="text-xs font-semibold text-white truncate">${this.escape(item.JUDUL)}</h4>
                            </div>
                            ${item.DESKRIPSI ? `<p class="text-[10px] text-zinc-500 truncate">${this.escape(item.DESKRIPSI)}</p>` : ''}
                        </div>
                        ${showClicks ? `<span class="text-[9px] text-zinc-600 font-mono">${item.CLICKS}×</span>` : ''}
                    </a>
                    ${isEdit ? `
                        <div class="flex gap-0.5 shrink-0">
                            <button onclick="app.editLink('${item.ID}')" class="icon-btn w-7 h-7"><i data-lucide="pencil" class="w-3 h-3"></i></button>
                            <button onclick="app.deleteLink('${item.ID}')" class="icon-btn w-7 h-7 text-red-400"><i data-lucide="trash-2" class="w-3 h-3"></i></button>
                        </div>
                    ` : ''}
                </div>
            `;
        },
        
        colorConfig: function(color) {
            const m = {
                indigo:  { bg: 'bg-indigo-500/15',  text: 'text-indigo-300',  glow: '' },
                sky:     { bg: 'bg-sky-500/15',     text: 'text-sky-300',     glow: '' },
                emerald: { bg: 'bg-emerald-500/15', text: 'text-emerald-300', glow: '' },
                rose:    { bg: 'bg-rose-500/15',    text: 'text-rose-300',    glow: '' },
                amber:   { bg: 'bg-amber-500/15',   text: 'text-amber-300',   glow: '' },
                purple:  { bg: 'bg-purple-500/15',  text: 'text-purple-300',  glow: '' },
                teal:    { bg: 'bg-teal-500/15',    text: 'text-teal-300',    glow: '' },
                pink:    { bg: 'bg-pink-500/15',    text: 'text-pink-300',    glow: '' },
                orange:  { bg: 'bg-orange-500/15',  text: 'text-orange-300',  glow: '' },
                red:     { bg: 'bg-red-500/15',     text: 'text-red-300',     glow: '' },
                green:   { bg: 'bg-green-500/15',   text: 'text-green-300',   glow: '' },
                blue:    { bg: 'bg-blue-500/15',    text: 'text-blue-300',    glow: '' },
                violet:  { bg: 'bg-violet-500/15',  text: 'text-violet-300',  glow: '' },
                zinc:    { bg: 'bg-zinc-500/15',    text: 'text-zinc-300',    glow: '' }
            };
            return m[color] || m.indigo;
        },
        
        // ============================================================
        // INFO PAGE
        // ============================================================
        renderInfoPage: function() {
            const info = this.info || {};
            const canEdit = this.user && (this.user.jabatan.toLowerCase() === 'super admin' || this.user.jabatan.toLowerCase() === 'admin');
            const d = canEdit ? '' : 'disabled';
            
            return `
                <div class="max-w-2xl space-y-4">
                    <div class="card p-4">
                        <div class="flex items-center gap-2 mb-4">
                            <div class="w-8 h-8 rounded-lg bg-accent-soft flex items-center justify-center">
                                <i data-lucide="megaphone" class="w-4 h-4 text-accent"></i>
                            </div>
                            <div>
                                <h3 class="text-sm font-semibold text-white">Banner Pengumuman</h3>
                                <p class="text-[10px] text-zinc-500">Muncul di atas dashboard</p>
                            </div>
                        </div>
                        
                        <div class="space-y-3">
                            <div>
                                <label class="block text-[10px] font-semibold uppercase tracking-wider text-zinc-500 mb-1.5">Status</label>
                                <select id="info-status" ${d} class="input">
                                    <option value="ON" ${info.STATUS === 'ON' ? 'selected' : ''}>ON</option>
                                    <option value="OFF" ${info.STATUS !== 'ON' ? 'selected' : ''}>OFF</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[10px] font-semibold uppercase tracking-wider text-zinc-500 mb-1.5">Pesan</label>
                                <textarea id="info-pesan" rows="3" ${d} class="input resize-none">${this.escape(info.PESAN || '')}</textarea>
                            </div>
                            <div>
                                <label class="block text-[10px] font-semibold uppercase tracking-wider text-zinc-500 mb-1.5">Warna</label>
                                <select id="info-warna" ${d} class="input">

                    </div>

                        <h4 class="text-xs font-semibold text-red-400 uppercase tracking-wider">Zona Berbahaya</h4>

        exportJSON: function() {
            const data = { version: '4.0', exportedAt: new Date().toISOString(), menu: this.menu, kategori: this.kategori, info: this.info };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `console-backup-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
            this.toast('Backup didownload', 'success');
        },
        
        importJSON: function(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (!data.menu) throw new Error('Format invalid');
                    this.toast(`File berisi ${data.menu.length} menu — apply manual via Sheet`, 'warning');
                } catch(err) { this.toast('File tidak valid', 'error'); }
                event.target.value = '';
            };
            reader.readAsText(file);
        },
        
        clearCache: function() {
            if (!confirm('Clear cache & sync ulang?')) return;
            localStorage.removeItem(this.KEYS.CACHE);
            localStorage.removeItem(this.KEYS.LAST_SYNC);
            this.menu = []; this.kategori = [];
            this.saveCache();
            this.syncNow();
        },
        
        factoryReset: function() {
            if (!confirm('Reset SEMUA data lokal? Anda akan logout.')) return;
            if (!confirm('Yakin?')) return;
            Object.values(this.KEYS).forEach(k => localStorage.removeItem(k));
            location.reload();
        },

        runDiagnostic: function() {
            const out = document.getElementById('diagnostic-output');

            const tests = [];
            tests.push(fetch(`${this.apiURL}?action=ping`).then(r => r.json()).then(d => ({ name: 'Ping', status: d.status, data: d })).catch(e => ({ name: 'Ping', status: 'error', error: e.message })));
            tests.push(fetch(`${this.apiURL}?action=bootstrap`).then(r => r.json()).then(d => ({ name: 'Bootstrap', status: d.status, data: { menu: d.data?.menu?.length } })).catch(e => ({ name: 'Bootstrap', status: 'error', error: e.message })));
            
            Promise.all(tests).then(results => {
                out.innerHTML = results.map(r => `
                    <div class="mt-2 p-2 rounded-lg border ${r.status === 'success' ? 'border-emerald-500/30 bg-emerald-500/5' : 'border-red-500/30 bg-red-500/5'}">
                        <div class="flex items-center justify-between">

                            <span class="text-[10px] font-mono">${r.status}</span>
                        </div>
                        <pre class="text-[9px] text-zinc-400 mt-1 whitespace-pre-wrap">${this.escape(JSON.stringify(r.data || r.error, null, 2).substring(0, 300))}</pre>

                `).join('');
            });
        },
        
        updateApiUrl: function() {
            const url = document.getElementById('diag-apiurl').value.trim();
            if (!url) return;

            localStorage.setItem('sa4_apiurl', url);
            this.toast('API URL diupdate', 'success');
        },
        
        // ============================================================
        // SYNC
        // ============================================================
        syncNow: function(silent) {
            if (!this.isOnline) {
                if (!silent) this.toast('Offline', 'warning');
                this.updateSyncIndicator('offline');
                return;
            }
            
            this.updateSyncIndicator('syncing');
            const btn = document.getElementById('btn-sync');
            if (btn) btn.querySelector('i').classList.add('animate-spin');
            
            fetch(`${this.apiURL}?action=bootstrap`)
                .then(r => r.json())
                .then(res => {
                    if (res.status !== 'success') throw new Error(res.message);
                    const d = res.data;
                    if (d.menu) this.menu = d.menu;
                    if (d.kategori) this.kategori = d.kategori;
                    if (d.info) this.info = d.info;
                    if (d.footer) this.footer = d.footer;
                    if (d.users) this.users = d.users;
                    this.saveCache();
                    localStorage.setItem(this.KEYS.LAST_SYNC, res.serverTime);
                    this.renderCurrentView();
                    this.updateSyncIndicator('synced');
                    if (!silent) this.toast('Data tersinkron', 'success');
                    if (this.user && (this.user.jabatan === 'Super Admin' || this.user.jabatan === 'Admin')) this.loadFeedback(silent);
                })
                .catch(err => {
                    this.updateSyncIndicator('error');
                    if (!silent) this.toast('Sync gagal: ' + err.message, 'error');
                })
                .finally(() => { if (btn) btn.querySelector('i').classList.remove('animate-spin'); });
        },
        
        apiPost: function(payload) {
            if (!this.isOnline) return;
            fetch(this.apiURL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            })
            .then(r => r.json())
            .then(res => {
                if (res.status !== 'success') console.error('[API]', res);
            })
            .catch(e => console.error('[API]', e));
        },
        
        // ============================================================
        // FORCE SYNC
        // ============================================================
        forceSync: function() {
            if (!this.user) { this.toast('Login dulu', 'warning'); return; }
            const role = this.user.jabatan.toLowerCase();
            if (role !== 'super admin' && role !== 'admin') { this.toast('Tidak punya akses', 'error'); return; }
            
            if (!confirm('Force Sync?\n\nAkan:\n• Hapus cache lokal\n• Update file ke versi terbaru\n• Reload halaman\n\nSession login TETAP tersimpan.')) return;
            
            const pending = JSON.parse(localStorage.getItem(this.KEYS.PENDING) || '[]');
            if (pending.length > 0) {
                if (!confirm(`Ada ${pending.length} pending. Sync dulu?`)) {
                    // Lanjut
                } else {
                    this.syncPending();
                    setTimeout(() => this._doForceSync(), 2500);
                    return;
                }
            }
            this._doForceSync();
        },
        
        _doForceSync: function() {
            this.toast('Memproses...', 'info');
            
            const clearCaches = (typeof caches !== 'undefined') ? 
                caches.keys().then(names => Promise.all(names.map(name => caches.delete(name)))) : Promise.resolve();
            const unregisterSW = ('serviceWorker' in navigator) ?
                navigator.serviceWorker.getRegistrations().then(regs => Promise.all(regs.map(r => r.unregister()))) : Promise.resolve();
            
            const keep = [this.KEYS.SESSION, this.KEYS.PREFS, this.KEYS.THEME];
            Object.values(this.KEYS).forEach(k => { if (!keep.includes(k)) localStorage.removeItem(k); });
            
            Promise.all([clearCaches, unregisterSW]).then(() => {
                sessionStorage.setItem('force_sync_done', '1');
                setTimeout(() => {
                    const url = new URL(window.location.href);
                    url.searchParams.set('_fs', Date.now());
                    window.location.replace(url.toString());
                }, 600);
            }).catch(() => {
                sessionStorage.setItem('force_sync_done', '1');
                setTimeout(() => window.location.reload(true), 500);
            });
        },
        
        // ============================================================
        // PENDING
        // ============================================================
        queuePending: function(op) {
            const q = JSON.parse(localStorage.getItem(this.KEYS.PENDING) || '[]');
            q.push({ ...op, queuedAt: Date.now() });
            localStorage.setItem(this.KEYS.PENDING, JSON.stringify(q));
            this.updateSyncIndicator();
        },
        
        syncPending: function() {
            if (!this.isOnline) { this.updateSyncIndicator('offline'); return; }
            const queue = JSON.parse(localStorage.getItem(this.KEYS.PENDING) || '[]');
            if (queue.length === 0) { this.updateSyncIndicator(); return; }
            
            this.updateSyncIndicator('syncing');
            console.log('[SYNC] Processing', queue.length, 'ops');
            
            const next = (i) => {
                if (i >= queue.length) {
                    localStorage.setItem(this.KEYS.PENDING, '[]');
                    this.updateSyncIndicator('synced');
                    console.log('[SYNC] All done');
                    this.syncNow(true);
                    return;
                }
                const op = queue[i];
                console.log('[SYNC]', op.action, op);
                
                fetch(this.apiURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(op)
                })
                .then(r => r.text())
                .then(text => {
                    let res;
                    try { res = JSON.parse(text); }
                    catch(e) { throw new Error('Not JSON: ' + text.substring(0, 100)); }
                    
                    console.log('[SYNC] Response:', res);
                    
                    if (res.status === 'success') {
                        if (op.action === 'add' && op.tempId && res.id) {
                            const item = this.menu.find(m => m.ID === op.tempId);
                            if (item) item.ID = res.id;
                            this.saveCache();
                        }
                        next(i + 1);
                    } else {
                        console.error('[SYNC] Server error:', res);
                        localStorage.setItem(this.KEYS.PENDING, JSON.stringify(queue.slice(i + 1)));
                        this.updateSyncIndicator('error');
                        this.toast('Gagal simpan: ' + (res.message || 'Unknown'), 'error');
                    }
                })
                .catch(err => {
                    console.error('[SYNC] Exception:', err);
                    this.updateSyncIndicator('error');
                    this.toast('Gagal kirim: ' + err.message, 'error');
                });
            };
            next(0);
        },
        
        trackClick: function(id) {
            const item = this.menu.find(m => m.ID === id);
            if (item) item.CLICKS = (Number(item.CLICKS) || 0) + 1;
            if (!this.isOnline) return;
            fetch(this.apiURL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'trackClick', id }) }).catch(() => {});

        // ============================================================
        // AUTH

        doLogin: function() {
            const email = document.getElementById('input-email').value.trim();
            const pass = document.getElementById('input-pass').value;
            const remember = document.getElementById('remember-me').checked;
            const btn = document.getElementById('btn-submit');
            if (!email || !pass) { this.toast('Email & password wajib', 'error'); return; }
            
            const orig = btn.innerHTML;
            btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Memverifikasi...';
            btn.disabled = true;
            lucide.createIcons();
            
            fetch(this.apiURL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'login', email, password: pass })
            })
            .then(r => r.json())
            .then(res => {
                if (res.status === 'success') {
                    this.user = { nama: res.nama, jabatan: res.jabatan, unit: res.unit, email: res.email };
                    this.saveSession();
                    this.updateUIState();
                    this.renderCurrentView();
                    this.closeModal('auth-modal');
                    this.toast('Selamat datang, ' + res.nama, 'success');
                    if (remember) { this.trackLogin(); setTimeout(() => this.loadFeedback(true), 800); }
                    this.syncNow(true);
                } else {
                    this.toast(res.message || 'Login gagal', 'error');
                }
            })
            .catch(() => this.toast('Server tidak dapat dijangkau', 'error'))
            .finally(() => { btn.innerHTML = orig; btn.disabled = false; lucide.createIcons(); });
        },

        saveLink: function() {
            const id = document.getElementById('link-id').value;
            const data = {
                judul: document.getElementById('link-judul').value.trim(),
                url: document.getElementById('link-url').value.trim(),
                deskripsi: document.getElementById('link-deskripsi').value.trim(),
                kategori: document.getElementById('link-kategori').value,
                akses_role: document.getElementById('link-role').value.trim(),
                icon: document.getElementById('link-icon').value,
                warna: document.getElementById('link-warna').value,
                pinned: document.getElementById('link-pinned').checked,
                status: document.getElementById('link-status').value
            };
            
            if (!data.judul || !data.url) { this.toast('Judul & URL wajib', 'error'); return; }
            try { const u = new URL(data.url); if (u.protocol !== 'http:' && u.protocol !== 'https:') throw new Error(); }
            catch(e) { this.toast('URL tidak valid', 'error'); return; }
            
            this.closeModal('link-modal');
            
            if (!id) {
                const tempId = 'tmp-' + Date.now();
                data.ID = tempId; data.CLICKS = 0; data.DELETED = false;
                this.menu.push(data);
                this.queuePending({ action: 'add', tempId, data, userEmail: this.user?.email });
            } else {
                const idx = this.menu.findIndex(m => m.ID === id);
                if (idx >= 0) this.menu[idx] = { ...this.menu[idx], ...data };
                this.queuePending({ action: 'update', id, data, userEmail: this.user?.email });
            }
            this.saveCache();
            this.renderCurrentView();
            
            // Immediate sync attempt
            this.syncPending();
            this.toast(id ? 'Link diupdate' : 'Link ditambahkan', 'success');
        },

            const item = this.menu.find(m => m.ID === id);
            if (!item) return;
            if (!confirm(`Hapus "${item.JUDUL}"?`)) return;
            this.menu = this.menu.filter(m => m.ID !== id);
            this.saveCache();
            this.renderCurrentView();
            this.queuePending({ action: 'delete', id, userEmail: this.user?.email });
            this.syncPending();
            this.toast('Link dihapus', 'success');
        },

        updateSyncIndicator: function(state) {
            const dot = document.getElementById('sync-dot');
            const text = document.getElementById('sync-text');
            if (!dot || !text) return;
            const queue = JSON.parse(localStorage.getItem(this.KEYS.PENDING) || '[]');
            const lastSync = localStorage.getItem(this.KEYS.LAST_SYNC);
            
            const s = state || (this.isOnline ? 'synced' : 'offline');
            dot.className = 'sync-dot';
            if (s === 'syncing') dot.classList.add('syncing');
            else if (s === 'offline') dot.classList.add('offline');
            else if (s === 'error') dot.classList.add('error');
            
            let label = 'Synced';
            if (queue.length > 0) label = `Pending ${queue.length}`;
            else if (!this.isOnline) label = 'Offline';
            else if (lastSync) label = this.timeAgo(lastSync);
            text.textContent = label;
        },
        
        timeAgo: function(iso) {
            if (!iso) return 'Belum sync';
            try {
                const d = new Date(iso.replace(' ', 'T'));
                const diff = Math.floor((Date.now() - d.getTime()) / 1000);
                if (diff < 60) return 'Baru saja';
                if (diff < 3600) return `${Math.floor(diff/60)}m`;
                if (diff < 86400) return `${Math.floor(diff/3600)}j`;
                return `${Math.floor(diff/86400)}h`;
            } catch(e) { return 'Belum sync'; }
        },

            document.getElementById('link-icon').value = ic;
            document.querySelectorAll('#icon-grid > div').forEach(b => {
                b.classList.remove('bg-accent', 'text-ink-950');
                b.classList.add('text-zinc-400');
                if (b.title === ic) {
                    b.classList.add('bg-accent', 'text-ink-950');
                    b.classList.remove('text-zinc-400');
                }
            });
        },
        
        setupColorPicker: function() {
            const picker = document.getElementById('color-picker');
            if (!picker) return;
            const map = {
                indigo: 'bg-indigo-400', sky: 'bg-sky-400', emerald: 'bg-emerald-400', rose: 'bg-rose-400',
                amber: 'bg-amber-400', purple: 'bg-purple-400', teal: 'bg-teal-400', pink: 'bg-pink-400',
                orange: 'bg-orange-400', red: 'bg-red-400', green: 'bg-green-400', blue: 'bg-blue-400',
                violet: 'bg-violet-400', zinc: 'bg-zinc-400'
            };
            picker.innerHTML = this.COLORS.map(c => `
                <button type="button" class="w-6 h-6 rounded-full ${map[c]} ring-2 ring-transparent hover:ring-white/30 transition" data-color="${c}" onclick="app.selectColor('${c}')" title="${c}"></button>
            `).join('');
        },
        
        selectColor: function(c) {
            document.getElementById('link-warna').value = c;
            document.querySelectorAll('#color-picker button').forEach(b => b.classList.remove('ring-white/60'));
            const target = document.querySelector(`#color-picker button[data-color="${c}"]`);
            if (target) target.classList.add('ring-white/60');
        },
        
        // ============================================================
        // UTILS
        // ============================================================
        escape: function(s) {
            return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]);
        },
        
        safeUrl: function(url) {
            try { const u = new URL(String(url)); if (u.protocol === 'http:' || u.protocol === 'https:') return u.href; } catch(e) {}
            return '#';
        }
    };
    
    // Restore API URL if saved
    const savedUrl = localStorage.getItem('sa4_apiurl');
    if (savedUrl) app.apiURL = savedUrl;
    
    document.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
</html>
