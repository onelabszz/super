<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" content="#18181b">
    <meta name="description" content="Super Admin Console v2.0">
    <title>Admin Console v2.0</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/onelabszz/super/refs/heads/main/super.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        bgdark: '#09090b',
                        panel: '#18181b',
                        border: '#27272a',
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { background-color: #f4f4f5; -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; }
        .dark body { background-color: #09090b; }
        .bg-grid { background-image: radial-gradient(#a1a1aa 1px, transparent 1px); background-size: 20px 20px; opacity: 0.15; }
        .dark .bg-grid { background-image: radial-gradient(#3f3f46 1px, transparent 1px); opacity: 0.1; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .dark .glass { background: rgba(24, 24, 27, 0.85); }
        .card-hover:active { transform: scale(0.98); }
        @media (hover: hover) { .card-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); } }
        .cloak { visibility: hidden; }
        .sortable-ghost { opacity: 0.4; background: #818cf8 !important; }
        .sortable-chosen { transform: scale(1.05); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2); z-index: 100; }
        .drag-handle { cursor: grab; }
        .drag-handle:active { cursor: grabbing; }
        .modal-enter { animation: modalIn 0.2s ease-out; }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .toast { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .icon-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); 
            gap: 6px; 
            max-height: 200px; 
            overflow-y: auto; 
            padding: 8px;
            border: 1px solid #e4e4e7;
            border-radius: 8px;
        }
        .dark .icon-grid { border-color: #27272a; }
        .icon-btn { 
            aspect-ratio: 1; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 6px; 
            cursor: pointer; 
            transition: all 0.15s;
        }
        .icon-btn:hover { background: #f4f4f5; }
        .dark .icon-btn:hover { background: #27272a; }
        .icon-btn.selected { background: #4f46e5; color: white; }
        .color-dot { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: all 0.15s; }
        .color-dot:hover { transform: scale(1.15); }
        .color-dot.selected { border-color: #18181b; transform: scale(1.15); }
        .dark .color-dot.selected { border-color: white; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #3f3f46; }
        ::-webkit-scrollbar-thumb:hover { background: #a1a1aa; }
        .menu-card { transition: opacity 0.2s ease, transform 0.2s ease; }
        .menu-card.removing { opacity: 0; transform: scale(0.95); }
        @keyframes syncPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .sync-pulse { animation: syncPulse 1.5s ease-in-out infinite; }
    </style>
</head>
<body class="text-zinc-800 dark:text-zinc-200 min-h-screen flex flex-col transition-colors duration-300 relative">

    <div class="fixed inset-0 bg-grid pointer-events-none z-0"></div>

    <!-- ============ NAVBAR ============ -->
    <nav class="sticky top-0 z-40 w-full border-b border-zinc-200 dark:border-border glass">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded bg-zinc-900 dark:bg-white flex items-center justify-center text-white dark:text-black shadow-sm shrink-0">
                        <img src="https://raw.githubusercontent.com/onelabszz/super/refs/heads/main/super.png" class="w-6 h-6 object-contain" alt="Logo">
                    </div>
                    <div>
                        <h1 class="font-bold text-lg tracking-tight leading-none dark:text-white">Admin<span class="text-indigo-600">Console</span></h1>
                        <div class="flex items-center gap-2">
                            <span id="nav-role-badge" class="text-[10px] font-mono uppercase tracking-wider text-zinc-500 font-semibold">Guest Access</span>
                            <span id="sync-indicator" class="text-[10px] font-mono flex items-center gap-1 text-zinc-400">
                                <span id="sync-dot" class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                                <span id="sync-text" class="hidden sm:inline">Synced</span>
                            </span>
                        </div>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button id="btn-feedback-admin" onclick="app.openFeedbackList()" class="hidden items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400 hover:opacity-80 transition relative">
                        <i data-lucide="inbox" class="w-3.5 h-3.5"></i>
                        <span class="hidden sm:inline">Feedback</span>
                        <span id="feedback-badge" class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-[9px] font-bold rounded-full w-4 h-4 flex items-center justify-center">0</span>
                    </button>
                    <button id="btn-kategori" onclick="app.openKategoriModal()" class="hidden items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-purple-100 text-purple-700 dark:bg-purple-900/30 dark:text-purple-400 hover:opacity-80 transition">
                        <i data-lucide="folder-cog" class="w-3.5 h-3.5"></i>
                        <span class="hidden sm:inline">Kategori</span>
                    </button>
                    <button id="btn-edit-mode" onclick="app.toggleEditMode()" class="hidden items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-400 hover:opacity-80 transition">
                        <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                        <span class="hidden sm:inline">Edit Mode</span>
                    </button>
                    <button onclick="app.toggleTheme()" class="p-2 text-zinc-500 hover:text-zinc-900 dark:hover:text-white transition rounded-full hover:bg-zinc-100 dark:hover:bg-zinc-800">
                        <i data-lucide="moon" class="w-5 h-5 hidden dark:block"></i>
                        <i data-lucide="sun" class="w-5 h-5 block dark:hidden"></i>
                    </button>
                    <div class="h-6 w-px bg-zinc-200 dark:bg-zinc-800"></div>
                    <button onclick="app.openAuthModal()" class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-sm font-semibold bg-zinc-900 text-white dark:bg-white dark:text-black hover:opacity-90 transition shadow-sm">
                        <i data-lucide="user-circle" class="w-4 h-4"></i>
                        <span id="btn-auth-text" class="hidden sm:inline">Login</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- ============ MAIN ============ -->
    <main class="flex-1 relative z-10 p-4 sm:p-8 pb-24">
        <div class="max-w-7xl mx-auto space-y-6">
            
            <div id="dashboard-header" class="hidden">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-zinc-200 dark:border-border pb-6">
                    <div>
                        <h2 class="text-2xl font-bold text-zinc-900 dark:text-white">Dashboard</h2>
                        <p class="text-zinc-500 text-sm mt-1">Selamat datang, <span id="user-display-name" class="font-semibold text-indigo-600">Admin</span>.</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="px-3 py-1.5 rounded-md border border-zinc-200 dark:border-zinc-700 text-xs font-mono text-zinc-500 flex items-center gap-2 bg-zinc-50 dark:bg-zinc-900">
                            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> SYSTEM ONLINE
                        </span>
                    </div>
                </div>
            </div>

            <!-- Toolbar -->
            <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
                <div class="relative flex-1">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-zinc-400"></i>
                    <input type="text" id="search-input" placeholder="Cari link..." 
                        class="w-full pl-9 pr-4 py-2.5 bg-white dark:bg-panel border border-zinc-200 dark:border-border rounded-lg text-sm focus:ring-2 focus:ring-indigo-600 focus:border-transparent outline-none">
                </div>
                <div id="btn-tambah-link" class="hidden">
                    <button onclick="app.openLinkModal()" class="w-full px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-semibold transition flex items-center justify-center gap-2">
                        <i data-lucide="plus" class="w-4 h-4"></i> Tambah Link
                    </button>
                </div>
                <button onclick="app.loadData(true)" class="px-4 py-2.5 bg-white dark:bg-panel border border-zinc-200 dark:border-border rounded-lg text-sm font-semibold hover:bg-zinc-50 dark:hover:bg-zinc-800 transition flex items-center justify-center gap-2">
                    <i data-lucide="refresh-cw" class="w-4 h-4"></i> Sync
                </button>
                <div id="import-export-group" class="hidden items-center gap-2">
                    <button onclick="app.exportJSON()" class="px-4 py-2.5 bg-white dark:bg-panel border border-zinc-200 dark:border-border rounded-lg text-sm font-semibold hover:bg-zinc-50 dark:hover:bg-zinc-800 transition flex items-center justify-center gap-2" title="Download backup JSON">
                        <i data-lucide="download" class="w-4 h-4"></i>
                        <span class="hidden md:inline">Export</span>
                    </button>
                    <label class="px-4 py-2.5 bg-white dark:bg-panel border border-zinc-200 dark:border-border rounded-lg text-sm font-semibold hover:bg-zinc-50 dark:hover:bg-zinc-800 transition flex items-center justify-center gap-2 cursor-pointer" title="Upload backup JSON">
                        <i data-lucide="upload" class="w-4 h-4"></i>
                        <span class="hidden md:inline">Import</span>
                        <input type="file" id="import-file" accept=".json" class="hidden" onchange="app.importJSON(event)">
                    </label>
                </div>
            </div>

            <div id="menu-container" class="space-y-8">
                <div class="h-32 rounded-xl bg-zinc-200 dark:bg-zinc-800/50 animate-pulse"></div>
                <div class="h-32 rounded-xl bg-zinc-200 dark:bg-zinc-800/50 animate-pulse"></div>
            </div>

            <div id="feedback-link" class="hidden pt-8">
                <button onclick="app.openFeedbackModal()" class="w-full p-4 border border-dashed border-zinc-300 dark:border-zinc-700 rounded-xl text-sm text-zinc-500 hover:border-indigo-500 hover:text-indigo-600 transition flex items-center justify-center gap-2">
                    <i data-lucide="message-circle" class="w-4 h-4"></i>
                    Kirim Feedback / Laporan Bug
                </button>
            </div>

        </div>
    </main>

    <!-- ============ MODAL: LOGIN ============ -->
    <div id="auth-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
        <div class="w-full max-w-md bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-xl shadow-2xl overflow-hidden modal-enter relative">
            <button onclick="app.closeModal('auth-modal')" class="absolute top-4 right-4 text-zinc-400 hover:text-zinc-900 dark:hover:text-white z-10"><i data-lucide="x" class="w-5 h-5"></i></button>

            <div id="form-login" class="p-8">
                <div class="mb-6">
                    <div class="w-12 h-12 bg-indigo-100 dark:bg-indigo-900/30 text-indigo-600 rounded-xl flex items-center justify-center mb-4"><i data-lucide="shield-lock" class="w-6 h-6"></i></div>
                    <h3 class="text-xl font-bold text-zinc-900 dark:text-white">Authentication</h3>
                    <p class="text-sm text-zinc-500 mt-1">Masuk untuk akses penuh.</p>
                </div>
                <form onsubmit="event.preventDefault(); app.doLogin()" class="space-y-4">
                    <input type="email" id="input-email" autocomplete="email" class="w-full bg-zinc-50 dark:bg-zinc-950 border border-zinc-300 dark:border-zinc-700 rounded-lg px-4 py-3 text-sm focus:ring-2 focus:ring-indigo-600 outline-none" placeholder="Email">
                    <input type="password" id="input-pass" autocomplete="current-password" class="w-full bg-zinc-50 dark:bg-zinc-950 border border-zinc-300 dark:border-zinc-700 rounded-lg px-4 py-3 text-sm focus:ring-2 focus:ring-indigo-600 outline-none" placeholder="Password">
                    <button type="submit" id="btn-submit" class="w-full bg-zinc-900 dark:bg-white text-white dark:text-black font-bold py-3 rounded-lg shadow-lg hover:opacity-90 transition active:scale-[0.98] flex justify-center items-center gap-2">Access Console</button>
                </form>
            </div>

            <div id="view-profile" class="hidden">
                <div class="bg-zinc-100 dark:bg-zinc-800/50 p-8 border-b border-zinc-200 dark:border-zinc-700 text-center">
                    <div class="w-20 h-20 bg-white dark:bg-zinc-700 rounded-full mx-auto mb-4 flex items-center justify-center border-4 border-zinc-200 dark:border-zinc-600 shadow-xl overflow-hidden">
                        <img src="https://raw.githubusercontent.com/onelabszz/super/refs/heads/main/super.png" class="w-12 h-12 object-contain" alt="Avatar">
                    </div>
                    <h3 class="text-lg font-bold text-zinc-900 dark:text-white" id="prof-name">-</h3>
                    <p class="text-indigo-600 dark:text-indigo-400 text-xs font-mono font-bold tracking-widest uppercase mt-1" id="prof-role">-</p>
                </div>
                <div class="p-6 space-y-3">
                    <div class="flex justify-between text-sm py-2 border-b border-zinc-100 dark:border-zinc-800">
                        <span class="text-zinc-500">Unit Kerja</span>
                        <span class="font-semibold dark:text-zinc-300" id="prof-unit">-</span>
                    </div>
                    <div class="flex justify-between text-sm py-2 border-b border-zinc-100 dark:border-zinc-800">
                        <span class="text-zinc-500">Email</span>
                        <span class="font-semibold dark:text-zinc-300 text-xs" id="prof-email">-</span>
                    </div>
                    <button onclick="app.doLogout()" class="w-full mt-4 bg-red-50 hover:bg-red-100 text-red-600 dark:bg-red-900/20 dark:text-red-400 font-bold py-3 rounded-lg transition flex items-center justify-center gap-2">
                        <i data-lucide="log-out" class="w-4 h-4"></i> Logout
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ============ MODAL: CRUD LINK ============ -->
    <div id="link-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
        <div class="w-full max-w-2xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-xl shadow-2xl overflow-hidden modal-enter max-h-[90vh] flex flex-col">
            <div class="flex items-center justify-between p-5 border-b border-zinc-200 dark:border-zinc-800 shrink-0">
                <h3 class="text-lg font-bold dark:text-white" id="link-modal-title">Tambah Link</h3>
                <button onclick="app.closeModal('link-modal')" class="text-zinc-400 hover:text-zinc-900 dark:hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            
            <div class="p-5 overflow-y-auto space-y-4">
                <input type="hidden" id="link-id">
                
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-zinc-500 mb-1.5">Judul *</label>
                    <input type="text" id="link-judul" class="w-full bg-zinc-50 dark:bg-zinc-950 border border-zinc-300 dark:border-zinc-700 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-600 outline-none" placeholder="Nama link">
                </div>
                
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-zinc-500 mb-1.5">URL *</label>
                    <input type="url" id="link-url" class="w-full bg-zinc-50 dark:bg-zinc-950 border border-zinc-300 dark:border-zinc-700 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-600 outline-none font-mono" placeholder="https://...">
                </div>
                
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-zinc-500 mb-1.5">Deskripsi</label>
                    <textarea id="link-deskripsi" rows="2" class="w-full bg-zinc-50 dark:bg-zinc-950 border border-zinc-300 dark:border-zinc-700 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-600 outline-none resize-none" placeholder="Deskripsi singkat"></textarea>
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-zinc-500 mb-1.5">Kategori</label>
                        <select id="link-kategori" class="w-full bg-zinc-50 dark:bg-zinc-950 border border-zinc-300 dark:border-zinc-700 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-600 outline-none"></select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-zinc-500 mb-1.5">Akses Role</label>
                        <input type="text" id="link-role" class="w-full bg-zinc-50 dark:bg-zinc-950 border border-zinc-300 dark:border-zinc-700 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-600 outline-none" placeholder="Super Admin,Admin">
                    </div>
                </div>
                
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-zinc-500 mb-1.5">Icon</label>
                    <input type="text" id="link-icon-search" placeholder="Cari icon..." class="w-full bg-zinc-50 dark:bg-zinc-950 border border-zinc-300 dark:border-zinc-700 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-600 outline-none mb-2">
                    <div id="icon-grid" class="icon-grid"></div>
                    <input type="hidden" id="link-icon" value="link">
                </div>
                
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-zinc-500 mb-1.5">Warna</label>
                    <div class="flex flex-wrap gap-2" id="color-picker"></div>
                    <input type="hidden" id="link-warna" value="zinc">
                </div>
                
                <div class="flex items-center gap-4">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="link-pinned" class="w-4 h-4 rounded">
                        <span class="text-sm font-semibold">⭐ Pin ke atas</span>
                    </label>
                    <select id="link-status" class="text-sm bg-zinc-50 dark:bg-zinc-950 border border-zinc-300 dark:border-zinc-700 rounded-lg px-2 py-1 focus:ring-2 focus:ring-indigo-600 outline-none">
                        <option value="aktif">Aktif</option>
                        <option value="arsip">Arsip</option>
                    </select>
                </div>
            </div>
            
            <div class="flex items-center gap-3 p-5 border-t border-zinc-200 dark:border-zinc-800 shrink-0">
                <button onclick="app.closeModal('link-modal')" class="flex-1 px-4 py-2.5 border border-zinc-300 dark:border-zinc-700 rounded-lg text-sm font-semibold hover:bg-zinc-50 dark:hover:bg-zinc-800 transition">Batal</button>
                <button onclick="app.saveLink()" id="btn-save-link" class="flex-1 px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-semibold transition flex items-center justify-center gap-2">
                    <i data-lucide="save" class="w-4 h-4"></i> Simpan
                </button>
            </div>
        </div>
    </div>

    <!-- ============ MODAL: KATEGORI ============ -->
    <div id="kategori-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
        <div class="w-full max-w-lg bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-xl shadow-2xl overflow-hidden modal-enter max-h-[90vh] flex flex-col">
            <div class="flex items-center justify-between p-5 border-b border-zinc-200 dark:border-zinc-800 shrink-0">
                <h3 class="text-lg font-bold dark:text-white">Kelola Kategori</h3>
                <button onclick="app.closeModal('kategori-modal')" class="text-zinc-400 hover:text-zinc-900 dark:hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="p-5 overflow-y-auto">
                <button onclick="app.openKategoriForm()" class="w-full mb-4 px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-semibold transition flex items-center justify-center gap-2">
                    <i data-lucide="plus" class="w-4 h-4"></i> Tambah Kategori
                </button>
                <div id="kategori-list" class="space-y-2"></div>
                
                <div id="kategori-form" class="hidden mt-4 p-4 border border-indigo-200 dark:border-indigo-800 rounded-lg bg-indigo-50 dark:bg-indigo-900/20 space-y-3">
                    <input type="hidden" id="kat-id">
                    <input type="text" id="kat-nama" placeholder="Nama kategori" class="w-full bg-white dark:bg-zinc-950 border border-zinc-300 dark:border-zinc-700 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-600 outline-none">
                    <input type="text" id="kat-icon" placeholder="Icon (contoh: folder)" class="w-full bg-white dark:bg-zinc-950 border border-zinc-300 dark:border-zinc-700 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-600 outline-none">
                    <div class="flex gap-2">
                        <button onclick="app.saveKategori()" class="flex-1 px-3 py-2 bg-indigo-600 text-white rounded-lg text-sm font-semibold">Simpan</button>
                        <button onclick="document.getElementById('kategori-form').classList.add('hidden')" class="px-3 py-2 border border-zinc-300 dark:border-zinc-700 rounded-lg text-sm">Batal</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ============ MODAL: FEEDBACK (KIRIM) ============ -->
    <div id="feedback-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
        <div class="w-full max-w-md bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-xl shadow-2xl overflow-hidden modal-enter">
            <div class="flex items-center justify-between p-5 border-b border-zinc-200 dark:border-zinc-800">
                <h3 class="text-lg font-bold dark:text-white">Kirim Feedback</h3>
                <button onclick="app.closeModal('feedback-modal')" class="text-zinc-400 hover:text-zinc-900 dark:hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="p-5 space-y-3">
                <select id="fb-tipe" class="w-full bg-zinc-50 dark:bg-zinc-950 border border-zinc-300 dark:border-zinc-700 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-600 outline-none">
                    <option value="saran">💡 Saran</option>
                    <option value="bug">🐛 Laporan Bug</option>
                    <option value="lain">📝 Lainnya</option>
                </select>
                <textarea id="fb-pesan" rows="4" placeholder="Tulis pesan..." class="w-full bg-zinc-50 dark:bg-zinc-950 border border-zinc-300 dark:border-zinc-700 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-600 outline-none resize-none"></textarea>
                <button onclick="app.sendFeedback()" class="w-full px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-semibold transition">Kirim</button>
            </div>
        </div>
    </div>

    <!-- ============ MODAL: FEEDBACK LIST (ADMIN) ============ -->
    <div id="feedback-list-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
        <div class="w-full max-w-3xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-xl shadow-2xl overflow-hidden modal-enter max-h-[90vh] flex flex-col">
            <div class="flex items-center justify-between p-5 border-b border-zinc-200 dark:border-zinc-800 shrink-0">
                <h3 class="text-lg font-bold dark:text-white">Feedback Masuk</h3>
                <div class="flex items-center gap-2">
                    <select id="fb-filter-status" onchange="app.renderFeedbackList()" class="text-xs bg-zinc-50 dark:bg-zinc-950 border border-zinc-300 dark:border-zinc-700 rounded-lg px-2 py-1.5 outline-none">
                        <option value="">Semua</option>
                        <option value="baru">Baru</option>
                        <option value="dibaca">Dibaca</option>
                        <option value="diproses">Diproses</option>
                        <option value="selesai">Selesai</option>
                    </select>
                    <button onclick="app.closeModal('feedback-list-modal')" class="text-zinc-400 hover:text-zinc-900 dark:hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
            </div>
            <div class="p-5 overflow-y-auto">
                <div id="feedback-list" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <!-- ============ TOAST ============ -->
    <div id="toast-container" class="fixed top-20 right-4 z-[60] space-y-2 max-w-sm"></div>

    <script>
    // ============================================================
    // APP
    // ============================================================
    const app = {
        apiURL: "https://script.google.com/macros/s/AKfycbx-VZ5H9Yy0drhyHucFrrhe4CHm5R7gNzmA-3VFrhgTBzYJzHYPCMp-TkWDVU0eIdr0/exec",
        
        user: null,
        menu: [],
        kategori: [],
        info: {},
        footer: [],
        users: [],
        feedbackList: [],
        editMode: false,
        sortables: [],
        isOnline: navigator.onLine,
        
        CACHE_KEY: 'sa_cache_v2',
        SESSION_KEY: 'sa_sess_v2',
        PENDING_KEY: 'sa_pending_v2',
        LAST_SYNC_KEY: 'sa_lastsync_v2',
        
        ICONS: ['link','home','settings','user','users','folder','folder-cog','file','file-text','image','video','music','download','upload','cloud','database','server','globe','map-pin','calendar','clock','mail','message-circle','phone','bell','book','book-open','graduation-cap','clipboard','clipboard-check','award','star','heart','bookmark','tag','shopping-cart','shopping-bag','credit-card','dollar-sign','trending-up','bar-chart','pie-chart','activity','zap','shield','shield-check','lock','unlock','key','eye','search','filter','edit','trash-2','plus','minus','check','x','arrow-right','arrow-up-right','external-link','play','pause','power','wifi','battery','monitor','smartphone','tablet','printer','cpu','hard-drive','code','terminal','github','inbox','send','log-out','log-in','layout-dashboard','package','truck','map','compass','sparkles','rocket','flame','crown','gem','palette','brush','pen-tool','camera','headphones','mic','radio','tv','film','gamepad-2','puzzle','trophy','target','flag','hash','at-sign','slash','regex'],
        
        COLORS: ['zinc','blue','red','green','emerald','rose','yellow','indigo','purple','orange','pink','sky','teal','violet'],
        
        // ============================================================
        // INIT
        // ============================================================
        init: function() {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            }
            
            if(localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
            
            const sess = localStorage.getItem(this.SESSION_KEY);
            if(sess) {
                try { this.user = JSON.parse(sess); } catch(e) { localStorage.removeItem(this.SESSION_KEY); }
            }
            
            this.loadFromCache();
            this.updateUIState();
            this.renderAll();
            
            window.addEventListener('online', () => { 
                this.isOnline = true; 
                this.updateSyncIndicator(); 
                this.syncPending(); 
                this.loadData(); 
            });
            window.addEventListener('offline', () => { 
                this.isOnline = false; 
                this.updateSyncIndicator(); 
            });
            
            window.addEventListener('storage', (e) => {
                if (e.key === this.CACHE_KEY) {
                    this.loadFromCache();
                    this.renderAll();
                }
            });
            
            document.getElementById('search-input').addEventListener('input', (e) => this.renderAll(e.target.value.toLowerCase()));
            
            this.setupIconPicker();
            this.setupColorPicker();
            
            this.loadData();
            
            // Load feedback badge kalau admin
            if (this.user && (this.user.jabatan === 'Super Admin' || this.user.jabatan === 'Admin')) {
                setTimeout(() => this.loadFeedback(), 1500);
            }
            
            lucide.createIcons();
        },
        
        // ============================================================
        // DATA
        // ============================================================
        loadFromCache: function() {
            try {
                const cached = JSON.parse(localStorage.getItem(this.CACHE_KEY) || '{}');
                this.menu = cached.menu || [];
                this.kategori = cached.kategori || [];
                this.info = cached.info || {};
                this.footer = cached.footer || [];
                this.users = cached.users || [];
            } catch(e) {}
        },
        
        saveCache: function() {
            localStorage.setItem(this.CACHE_KEY, JSON.stringify({
                menu: this.menu,
                kategori: this.kategori,
                info: this.info,
                footer: this.footer,
                users: this.users,
                cachedAt: new Date().toISOString()
            }));
        },
        
        loadData: function(force) {
            if (!this.isOnline) {
                this.updateSyncIndicator('offline');
                return;
            }
            
            this.updateSyncIndicator('syncing');
            const since = force ? null : localStorage.getItem(this.LAST_SYNC_KEY);
            const url = since 
                ? `${this.apiURL}?action=delta&since=${encodeURIComponent(since)}` 
                : `${this.apiURL}?action=bootstrap`;
            
            fetch(url)
                .then(r => r.json())
                .then(res => {
                    if (res.status !== 'success') throw new Error(res.message || 'Unknown error');
                    
                    const data = res.data;
                    if (data.menu) this.menu = data.menu;
                    if (data.kategori) this.kategori = data.kategori;
                    if (data.info) this.info = data.info;
                    if (data.footer) this.footer = data.footer;
                    if (data.users) this.users = data.users;
                    
                    this.saveCache();
                    localStorage.setItem(this.LAST_SYNC_KEY, res.serverTime);
                    
                    this.renderAll();
                    this.updateSyncIndicator('synced');
                    if (force) this.toast('Data tersinkron', 'success');
                })
                .catch(err => {
                    console.error('Load error:', err);
                    this.updateSyncIndicator('error');
                    if (force) this.toast('Gagal sync: ' + err.message, 'error');
                });
        },
        
        // ============================================================
        // RENDER
        // ============================================================
        renderAll: function(searchQuery) {
            this.renderMenu(searchQuery);
            this.renderKategoriList();
            this.renderKategoriOptions();
            lucide.createIcons();
        },
        
        renderMenu: function(searchQuery) {
            const container = document.getElementById('menu-container');
            const q = searchQuery || '';
            const userRole = this.user ? this.user.jabatan.toLowerCase() : '';
            
            let items = this.menu.filter(item => {
                if (item.DELETED === true || item.DELETED === 'TRUE') return false;
                if (item.STATUS === 'arsip') return false;
                
                if (q && !(
                    String(item.JUDUL).toLowerCase().includes(q) ||
                    String(item.DESKRIPSI || '').toLowerCase().includes(q) ||
                    String(item.URL).toLowerCase().includes(q)
                )) return false;
                
                const reqRole = String(item.AKSES_ROLE || '').trim();
                if (!reqRole) return true;
                const roles = reqRole.split(',').map(r => r.trim().toLowerCase()).filter(Boolean);
                if (roles.length === 0) return true;
                if (userRole === 'super admin') return true;
                return roles.includes(userRole);
            });
            
            if (items.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16 flex flex-col items-center text-zinc-400">
                        <i data-lucide="inbox" class="w-12 h-12 mb-3 opacity-50"></i>
                        <p class="text-sm">${q ? 'Tidak ada hasil untuk "' + this.escape(q) + '"' : 'Belum ada menu.'}</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }
            
            const groups = {};
            this.kategori.forEach(k => groups[k.NAMA] = []);
            groups['Lain-lain'] = groups['Lain-lain'] || [];
            
            items.forEach(item => {
                const kat = item.KATEGORI || 'Lain-lain';
                if (!groups[kat]) groups[kat] = [];
                groups[kat].push(item);
            });
            
            const sortedKatNames = Object.keys(groups).sort((a, b) => {
                const ka = this.kategori.find(k => k.NAMA === a);
                const kb = this.kategori.find(k => k.NAMA === b);
                return (Number(ka?.URUTAN) || 999) - (Number(kb?.URUTAN) || 999);
            });
            
            let html = '';
            sortedKatNames.forEach(katName => {
                const katItems = groups[katName];
                if (!katItems || katItems.length === 0) return;
                
                katItems.sort((a, b) => {
                    const pa = (a.PINNED === true || a.PINNED === 'TRUE') ? 0 : 1;
                    const pb = (b.PINNED === true || b.PINNED === 'TRUE') ? 0 : 1;
                    if (pa !== pb) return pa - pb;
                    return (Number(a.URUTAN) || 999) - (Number(b.URUTAN) || 999);
                });
                
                const katInfo = this.kategori.find(k => k.NAMA === katName);
                const katIcon = katInfo?.ICON || 'folder';
                
                html += `
                    <div class="space-y-3">
                        <h3 class="text-sm font-bold uppercase tracking-wider text-zinc-500 flex items-center gap-2">
                            <i data-lucide="${katIcon}" class="w-4 h-4"></i>
                            ${this.escape(katName)}
                            <span class="text-[10px] bg-zinc-100 dark:bg-zinc-800 px-1.5 py-0.5 rounded font-mono">${katItems.length}</span>
                        </h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 menu-grid">
                            ${katItems.map(item => this.renderCard(item)).join('')}
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
            this.setupSortable();
        },
        
        renderCard: function(item) {
            const isPinned = item.PINNED === true || item.PINNED === 'TRUE';
            const colorClasses = this.getColorClasses(item.WARNA);
            const icon = item.ICON || 'link';
            const isEdit = this.editMode;
            const safeUrl = this.safeUrl(item.URL);
            
            return `
                <div class="menu-card group relative flex flex-col p-5 bg-white dark:bg-panel border border-zinc-200 dark:border-zinc-800 rounded-xl hover:border-indigo-500/50 transition-all duration-300 card-hover" data-id="${item.ID}">
                    ${isEdit ? `
                        <div class="drag-handle absolute top-2 left-2 p-1 rounded hover:bg-zinc-100 dark:hover:bg-zinc-800 text-zinc-400">
                            <i data-lucide="grip-vertical" class="w-4 h-4"></i>
                        </div>
                        <div class="absolute top-2 right-2 flex gap-1">
                            <button onclick="app.editLink('${item.ID}')" class="p-1.5 rounded hover:bg-zinc-100 dark:hover:bg-zinc-800 text-zinc-500" title="Edit">
                                <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                            </button>
                            <button onclick="app.deleteLink('${item.ID}')" class="p-1.5 rounded hover:bg-red-50 dark:hover:bg-red-900/30 text-red-500" title="Hapus">
                                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                            </button>
                        </div>
                    ` : ''}
                    
                    ${isPinned && !isEdit ? `<div class="absolute top-2 right-2 text-amber-400">⭐</div>` : ''}
                    
                    <a href="${isEdit ? 'javascript:void(0)' : safeUrl}" ${!isEdit ? 'target="_blank" rel="noopener"' : ''} 
                       onclick="${isEdit ? 'event.preventDefault()' : `app.trackClick('${item.ID}')`}"
                       class="flex flex-col flex-1 ${isEdit ? 'pointer-events-none' : ''}">
                        <div class="flex items-start justify-between mb-4 ${isEdit ? 'mt-6' : ''}">
                            <div class="w-12 h-12 rounded-lg flex items-center justify-center ${colorClasses}">
                                <i data-lucide="${icon}" class="w-6 h-6"></i>
                            </div>
                            ${!isEdit ? `<i data-lucide="arrow-up-right" class="w-4 h-4 text-zinc-300 group-hover:text-indigo-500 transition"></i>` : ''}
                        </div>
                        <h4 class="font-bold text-base text-zinc-800 dark:text-zinc-100 group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition line-clamp-1">${this.escape(item.JUDUL)}</h4>
                        <p class="text-xs text-zinc-500 mt-1 line-clamp-2 leading-relaxed flex-1">${this.escape(item.DESKRIPSI || '')}</p>
                        ${Number(item.CLICKS) > 0 ? `<div class="mt-2 text-[10px] text-zinc-400 font-mono">${item.CLICKS} clicks</div>` : ''}
                    </a>
                </div>
            `;
        },
        
        renderKategoriList: function() {
            const el = document.getElementById('kategori-list');
            if (!el) return;
            
            if (this.kategori.length === 0) {
                el.innerHTML = `<p class="text-sm text-zinc-500 text-center py-4">Belum ada kategori</p>`;
                return;
            }
            
            el.innerHTML = this.kategori.map(k => `
                <div class="flex items-center gap-2 p-3 border border-zinc-200 dark:border-zinc-800 rounded-lg hover:bg-zinc-50 dark:hover:bg-zinc-800/50">
                    <i data-lucide="${k.ICON || 'folder'}" class="w-4 h-4"></i>
                    <span class="flex-1 font-semibold text-sm">${this.escape(k.NAMA)}</span>
                    <button onclick="app.openKategoriForm('${k.ID}')" class="p-1.5 text-zinc-500 hover:text-indigo-600">
                        <i data-lucide="pencil" class="w-4 h-4"></i>
                    </button>
                    <button onclick="app.deleteKategori('${k.ID}')" class="p-1.5 text-zinc-500 hover:text-red-500">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                </div>
            `).join('');
            lucide.createIcons();
        },
        
        renderKategoriOptions: function() {
            const sel = document.getElementById('link-kategori');
            if (!sel) return;
            sel.innerHTML = this.kategori.map(k => 
                `<option value="${this.escape(k.NAMA)}">${this.escape(k.NAMA)}</option>`
            ).join('') + `<option value="Lain-lain">Lain-lain</option>`;
        },
        
        // ============================================================
        // SORTABLE
        // ============================================================
        setupSortable: function() {
            this.sortables.forEach(s => { try { s.destroy(); } catch(e) {} });
            this.sortables = [];
            
            if (!this.editMode) return;
            
            document.querySelectorAll('.menu-grid').forEach(grid => {
                const sortable = Sortable.create(grid, {
                    animation: 200,
                    handle: '.drag-handle',
                    ghostClass: 'sortable-ghost',
                    chosenClass: 'sortable-chosen',
                    onEnd: () => {
                        const allIds = [];
                        document.querySelectorAll('.menu-grid').forEach(g => {
                            g.querySelectorAll('[data-id]').forEach(el => allIds.push(el.dataset.id));
                        });
                        this.reorderMenus(allIds);
                    }
                });
                this.sortables.push(sortable);
            });
        },
        
        // ============================================================
        // EDIT MODE
        // ============================================================
        toggleEditMode: function() {
            if (!this.user) { this.toast('Login dulu untuk edit', 'warning'); return; }
            const role = this.user.jabatan.toLowerCase();
            if (role !== 'super admin' && role !== 'admin') {
                this.toast('Anda tidak punya akses edit', 'error');
                return;
            }
            this.editMode = !this.editMode;
            this.updateUIState();
            this.renderAll();
            this.toast(this.editMode ? '🔓 Edit mode aktif' : '🔒 Edit mode nonaktif', 'info');
        },
        
        // ============================================================
        // LINK CRUD
        // ============================================================
        openLinkModal: function(id) {
            const modal = document.getElementById('link-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            if (id) {
                const item = this.menu.find(m => m.ID === id);
                if (!item) return;
                document.getElementById('link-modal-title').textContent = 'Edit Link';
                document.getElementById('link-id').value = item.ID;
                document.getElementById('link-judul').value = item.JUDUL || '';
                document.getElementById('link-url').value = item.URL || '';
                document.getElementById('link-deskripsi').value = item.DESKRIPSI || '';
                document.getElementById('link-kategori').value = item.KATEGORI || 'Lain-lain';
                document.getElementById('link-role').value = item.AKSES_ROLE || '';
                document.getElementById('link-icon').value = item.ICON || 'link';
                document.getElementById('link-warna').value = item.WARNA || 'zinc';
                document.getElementById('link-pinned').checked = item.PINNED === true || item.PINNED === 'TRUE';
                document.getElementById('link-status').value = item.STATUS || 'aktif';
                this.selectIcon(item.ICON || 'link');
                this.selectColor(item.WARNA || 'zinc');
            } else {
                document.getElementById('link-modal-title').textContent = 'Tambah Link';
                document.getElementById('link-id').value = '';
                document.getElementById('link-judul').value = '';
                document.getElementById('link-url').value = '';
                document.getElementById('link-deskripsi').value = '';
                document.getElementById('link-kategori').value = this.kategori[0]?.NAMA || 'Lain-lain';
                document.getElementById('link-role').value = '';
                document.getElementById('link-icon').value = 'link';
                document.getElementById('link-warna').value = 'zinc';
                document.getElementById('link-pinned').checked = false;
                document.getElementById('link-status').value = 'aktif';
                this.selectIcon('link');
                this.selectColor('zinc');
            }
            lucide.createIcons();
        },
        
        editLink: function(id) { this.openLinkModal(id); },
        
        saveLink: function() {
            const id = document.getElementById('link-id').value;
            const data = {
                judul: document.getElementById('link-judul').value.trim(),
                url: document.getElementById('link-url').value.trim(),
                deskripsi: document.getElementById('link-deskripsi').value.trim(),
                kategori: document.getElementById('link-kategori').value,
                akses_role: document.getElementById('link-role').value.trim(),
                icon: document.getElementById('link-icon').value,
                warna: document.getElementById('link-warna').value,
                pinned: document.getElementById('link-pinned').checked,
                status: document.getElementById('link-status').value
            };
            
            if (!data.judul || !data.url) {
                this.toast('Judul & URL wajib diisi', 'error');
                return;
            }
            
            try {
                const u = new URL(data.url);
                if (u.protocol !== 'http:' && u.protocol !== 'https:') throw new Error();
            } catch(e) {
                this.toast('URL tidak valid (harus http/https)', 'error');
                return;
            }
            
            const action = id ? 'update' : 'add';
            const payload = id 
                ? { action, id, data, userEmail: this.user?.email }
                : { action, data, userEmail: this.user?.email };
            
            this.closeModal('link-modal');
            
            if (!id) {
                const tempId = 'tmp-' + Date.now();
                data.ID = tempId;
                data.CLICKS = 0;
                data.DELETED = false;
                this.menu.push(data);
                this.renderAll();
                this.queuePending({ action: 'add', tempId, data, userEmail: this.user?.email });
            } else {
                const idx = this.menu.findIndex(m => m.ID === id);
                if (idx >= 0) this.menu[idx] = { ...this.menu[idx], ...data };
                this.renderAll();
                this.queuePending({ action: 'update', id, data, userEmail: this.user?.email });
            }
            
            this.saveCache();
            this.syncPending();
        },
        
        deleteLink: function(id) {
            const item = this.menu.find(m => m.ID === id);
            if (!item) return;
            if (!confirm(`Hapus "${item.JUDUL}"?`)) return;
            
            this.menu = this.menu.filter(m => m.ID !== id);
            this.renderAll();
            this.saveCache();
            
            this.queuePending({ action: 'delete', id, userEmail: this.user?.email });
            this.syncPending();
        },
        
        reorderMenus: function(ids) {
            ids.forEach((id, idx) => {
                const item = this.menu.find(m => m.ID === id);
                if (item) item.URUTAN = idx + 1;
            });
            this.saveCache();
            this.queuePending({ action: 'reorder', ids, userEmail: this.user?.email });
            this.syncPending();
        },
        
        // ============================================================
        // KATEGORI CRUD
        // ============================================================
        openKategoriModal: function() {
            const m = document.getElementById('kategori-modal');
            m.classList.remove('hidden'); m.classList.add('flex');
            this.renderKategoriList();
        },
        
        openKategoriForm: function(id) {
            const form = document.getElementById('kategori-form');
            form.classList.remove('hidden');
            
            if (id) {
                const k = this.kategori.find(x => x.ID === id);
                if (!k) return;
                document.getElementById('kat-id').value = k.ID;
                document.getElementById('kat-nama').value = k.NAMA;
                document.getElementById('kat-icon').value = k.ICON || 'folder';
            } else {
                document.getElementById('kat-id').value = '';
                document.getElementById('kat-nama').value = '';
                document.getElementById('kat-icon').value = 'folder';
            }
        },
        
        saveKategori: function() {
            const id = document.getElementById('kat-id').value;
            const nama = document.getElementById('kat-nama').value.trim();
            const icon = document.getElementById('kat-icon').value.trim() || 'folder';
            
            if (!nama) { this.toast('Nama wajib', 'error'); return; }
            
            const data = { ID: id || null, NAMA: nama, ICON: icon };
            this.closeModal('kategori-modal');
            
            if (id) {
                const idx = this.kategori.findIndex(k => k.ID === id);
                if (idx >= 0) this.kategori[idx] = { ...this.kategori[idx], ...data };
            } else {
                this.kategori.push({ ID: 'tmp-' + Date.now(), NAMA: nama, ICON: icon, WARNA: 'zinc', URUTAN: this.kategori.length + 1 });
            }
            this.renderAll();
            this.saveCache();
            
            this.queuePending({ action: 'saveKategori', data, userEmail: this.user?.email });
            this.syncPending();

        deleteKategori: function(id) {
            const k = this.kategori.find(x => x.ID === id);
            if (!k) return;
            if (!confirm(`Hapus kategori "${k.NAMA}"?`)) return;
            
            this.kategori = this.kategori.filter(x => x.ID !== id);
            this.renderAll();

        // ============================================================
        // SYNC / PENDING
        // ============================================================
        queuePending: function(op) {
            const queue = JSON.parse(localStorage.getItem(this.PENDING_KEY) || '[]');
            queue.push({ ...op, queuedAt: Date.now() });
            localStorage.setItem(this.PENDING_KEY, JSON.stringify(queue));
            this.updateSyncIndicator();
        },
        
        syncPending: function() {
            if (!this.isOnline) { this.updateSyncIndicator('offline'); return; }
            
            const queue = JSON.parse(localStorage.getItem(this.PENDING_KEY) || '[]');
            if (queue.length === 0) { this.updateSyncIndicator('synced'); return; }
            
            this.updateSyncIndicator('syncing');
            
            const processNext = (i) => {
                if (i >= queue.length) {
                    localStorage.setItem(this.PENDING_KEY, '[]');
                    this.updateSyncIndicator('synced');
                    this.loadData(true);
                    return;
                }
                
                const op = queue[i];
                fetch(this.apiURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(op)
                })
                .then(r => r.json())
                .then(res => {
                    if (res.status === 'success') {
                        if (op.action === 'add' && op.tempId && res.id) {
                            const item = this.menu.find(m => m.ID === op.tempId);
                            if (item) item.ID = res.id;
                            this.saveCache();
                        }
                        processNext(i + 1);
                    } else {
                        console.error('Sync error:', res);
                        this.toast('Sync error: ' + res.message, 'error');
                        const remaining = queue.slice(i + 1);
                        localStorage.setItem(this.PENDING_KEY, JSON.stringify(remaining));
                        this.updateSyncIndicator('error');
                    }
                })
                .catch(err => {
                    console.error('Sync exception:', err);
                    this.updateSyncIndicator('offline');
                });
            };
            
            processNext(0);
        },
        
        trackClick: function(id) {
            if (!this.isOnline) return;
            fetch(this.apiURL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'trackClick', id })
            }).catch(() => {});
            
            const item = this.menu.find(m => m.ID === id);
            if (item) item.CLICKS = (Number(item.CLICKS) || 0) + 1;
        },

            const btn = document.getElementById('btn-submit');

        exportJSON: function() {
            const data = {
                version: '2.0',
                exportedAt: new Date().toISOString(),
                menu: this.menu,
                kategori: this.kategori,
                info: this.info
            };
            
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `superapp-backup-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
            this.toast('Backup didownload', 'success');
        },
        
        importJSON: function(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (!data.menu || !Array.isArray(data.menu)) {
                        this.toast('File JSON tidak valid', 'error');
                        event.target.value = '';
                        return;
                    }
                    
                    const counts = {
                        menu: data.menu?.length || 0,
                        kategori: data.kategori?.length || 0
                    };
                    
                    if (!confirm(`Import ${counts.menu} menu & ${counts.kategori} kategori?\n\nFitur import apply sedang dikembangkan. Untuk saat ini, gunakan Google Sheet untuk import massal.`)) {
                        event.target.value = '';
                        return;
                    }
                    
                    this.toast('Import dalam pengembangan', 'warning');
                } catch (err) {
                    this.toast('File tidak valid: ' + err.message, 'error');
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        },

                orange: 'text-orange-600 dark:text-orange-400 bg-orange-50 dark:bg-orange-900/20',
                pink: 'text-pink-600 dark:text-pink-400 bg-pink-50 dark:bg-pink-900/20',
                sky: 'text-sky-600 dark:text-sky-400 bg-sky-50 dark:bg-sky-900/20',
                teal: 'text-teal-600 dark:text-teal-400 bg-teal-50 dark:bg-teal-900/20',
                violet: 'text-violet-600 dark:text-violet-400 bg-violet-50 dark:bg-violet-900/20'
            };
            return map[color] || 'text-zinc-600 dark:text-zinc-400 bg-zinc-100 dark:bg-zinc-800';
        },
        
        escape: function(str) {
            return String(str ?? '').replace(/[&<>"']/g, m => ({
                '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
            })[m]);
        },
        
        safeUrl: function(url) {
            try {
                const u = new URL(String(url));
                if (u.protocol === 'http:' || u.protocol === 'https:') return u.href;
            } catch(e) {}
            return '#';
        }
    };
    
    document.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
</html>
