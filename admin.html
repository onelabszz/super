<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="description" content="Super Admin Console v3.3">
    <title>Console</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/onelabszz/super/refs/heads/main/super.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        ink: {
                            950: '#0a0a0a',
                            900: '#141416',
                            850: '#1a1a1c',
                            800: '#1c1c1e',
                            750: '#232326',
                            700: '#2a2a2e',
                            600: '#3a3a3f',
                        },
                        accent: {
                            DEFAULT: '#fcd34d',
                            hover: '#fbbf24',
                            dim: '#eab308',
                        }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        html, body { background-color: #0a0a0a; }
        body { font-family: 'Inter', sans-serif; color: #e4e4e7; }
        
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 3px 3px;
            pointer-events: none;
            z-index: 0;
        }
        
        html:not(.dark) body { background-color: #f5f5f7; color: #18181b; }
        html:not(.dark) body::before { background-image: radial-gradient(rgba(0,0,0,0.03) 1px, transparent 1px); }
        html:not(.dark) .bg-ink-950 { background-color: #f5f5f7 !important; }
        html:not(.dark) .bg-ink-900 { background-color: #ffffff !important; }
        html:not(.dark) .bg-ink-800 { background-color: #ffffff !important; }
        html:not(.dark) .bg-ink-850 { background-color: #fafafa !important; }
        html:not(.dark) .bg-ink-750 { background-color: #f4f4f5 !important; }
        html:not(.dark) .border-ink-700 { border-color: #e4e4e7 !important; }
        html:not(.dark) .border-ink-800 { border-color: #e4e4e7 !important; }
        html:not(.dark) .border-ink-750 { border-color: #e4e4e7 !important; }
        html:not(.dark) .text-white { color: #18181b !important; }
        html:not(.dark) .text-zinc-400 { color: #71717a !important; }
        html:not(.dark) .text-zinc-500 { color: #71717a !important; }
        html:not(.dark) .text-zinc-300 { color: #3f3f46 !important; }
        html:not(.dark) .text-zinc-200 { color: #27272a !important; }
        html:not(.dark) .text-zinc-100 { color: #18181b !important; }
        
        .glass { background: rgba(10, 10, 10, 0.85); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); }
        html:not(.dark) .glass { background: rgba(255, 255, 255, 0.85); }
        
        .card-link { transition: transform 0.2s ease, background 0.2s ease; }
        @media (hover: hover) {
            .card-link:hover { transform: translateY(-2px); }
            .card-link:hover .card-inner { background: #232326; }
        }
        html:not(.dark) .card-link:hover .card-inner { background: #f4f4f5; }
        
        .sortable-ghost { opacity: 0.3; background: rgba(252, 211, 77, 0.3) !important; }
        .sortable-chosen { transform: scale(1.03) rotate(1deg); z-index: 100; }
        .drag-handle { cursor: grab; }
        .drag-handle:active { cursor: grabbing; }
        
        .modal-enter { animation: modalIn 0.22s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.96) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        
        .panel-enter { animation: panelIn 0.28s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes panelIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
        .panel-exit { animation: panelOut 0.22s ease-in forwards; }
        @keyframes panelOut { from { transform: translateX(0); } to { transform: translateX(100%); } }
        
        .toast { animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        .icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 6px; max-height: 180px; overflow-y: auto; padding: 8px; border: 1px solid #232326; border-radius: 14px; background: #141416; }
        html:not(.dark) .icon-grid { background: #fafafa; border-color: #e4e4e7; }
        .icon-btn { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 10px; cursor: pointer; transition: all 0.15s; color: #a1a1aa; }
        .icon-btn:hover { background: #232326; color: #fcd34d; }
        html:not(.dark) .icon-btn:hover { background: #f4f4f5; }
        .icon-btn.selected { background: #fcd34d; color: #0a0a0a; }
        
        .color-dot { width: 26px; height: 26px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: all 0.15s; }
        .color-dot:hover { transform: scale(1.15); }
        .color-dot.selected { border-color: #fcd34d; transform: scale(1.15); }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #2a2a2e; border-radius: 3px; }
        html:not(.dark) ::-webkit-scrollbar-thumb { background: #d4d4d8; }
        ::-webkit-scrollbar-thumb:hover { background: #3a3a3f; }
        
        @keyframes syncPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .sync-pulse { animation: syncPulse 1.2s ease-in-out infinite; }
        
        .line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        .ptab-active { background: #fcd34d; color: #0a0a0a; font-weight: 700; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes forceSpin { 100% { transform: rotate(360deg); } }
        .force-spin { animation: forceSpin 1s linear infinite; }
        
        .edit-mode-active { background: #fcd34d !important; color: #0a0a0a !important; box-shadow: 0 10px 15px -3px rgba(252, 211, 77, 0.3); }
    </style>
</head>
<body class="min-h-screen flex flex-col relative transition-colors duration-200">

    <!-- NAVBAR -->
    <nav class="sticky top-0 z-40 w-full glass border-b border-ink-800/50">
        <div class="max-w-[1600px] mx-auto px-3 sm:px-4">
            <div class="flex items-center justify-between h-14 gap-2">
                
                <div class="flex items-center gap-2.5 min-w-0">
                    <div class="w-9 h-9 rounded-2xl bg-accent flex items-center justify-center shrink-0 shadow-lg shadow-accent/20">
                        <img src="https://raw.githubusercontent.com/onelabszz/super/refs/heads/main/super.png" class="w-6 h-6 object-contain" alt="Logo">
                    </div>
                    <div class="min-w-0">
                        <div class="flex items-center gap-1.5">
                            <h1 class="font-bold text-sm tracking-tight leading-none text-white">Console</h1>
                            <span id="nav-role-badge" class="text-[9px] font-mono uppercase tracking-wider text-zinc-500 font-semibold hidden sm:inline">Guest</span>
                        </div>
                        <div class="flex items-center gap-1.5 mt-0.5">
                            <span id="sync-dot" class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                            <span id="sync-text" class="text-[9px] font-mono text-zinc-500 truncate">Baru saja</span>
                        </div>
                    </div>
                </div>

                <div class="hidden md:flex flex-1 max-w-md mx-4">
                    <div class="relative w-full">
                        <i data-lucide="search" class="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500"></i>
                        <input type="text" id="search-input" placeholder="Cari menu..." 
                            class="w-full pl-9 pr-3 py-2 bg-ink-850 border border-ink-750 focus:border-accent/50 focus:ring-2 focus:ring-accent/20 rounded-2xl text-xs text-white placeholder-zinc-500 outline-none transition">
                    </div>
                </div>

                <div class="flex items-center gap-1">
                    <button onclick="app.toggleView()" class="p-2 text-zinc-400 hover:text-accent rounded-xl hover:bg-ink-850 transition" title="Ganti tampilan">
                        <i data-lucide="layout-grid" id="view-icon" class="w-4 h-4"></i>
                    </button>
                    <button onclick="app.syncNow()" id="btn-sync" class="p-2 text-zinc-400 hover:text-accent rounded-xl hover:bg-ink-850 transition" title="Sync">
                        <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                    </button>
                    <button onclick="app.forceSync()" id="btn-force-sync" class="hidden p-2 text-zinc-400 hover:text-accent rounded-xl hover:bg-ink-850 transition" title="Force Sync (Ctrl+Shift+R)">
                        <i data-lucide="zap" class="w-4 h-4"></i>
                    </button>
                    <button id="btn-tambah" onclick="app.openLinkModal()" class="hidden items-center gap-1 px-3 py-1.5 bg-accent hover:bg-accent-hover text-black rounded-full text-xs font-bold transition shadow-lg shadow-accent/20" title="Tambah link">
                        <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                        <span class="hidden sm:inline">Tambah</span>
                    </button>
                    <button id="btn-edit-mode" onclick="app.toggleEditMode()" class="hidden p-2 text-zinc-400 hover:text-accent rounded-xl hover:bg-ink-850 transition" title="Edit Mode">
                        <i data-lucide="pencil" class="w-4 h-4"></i>
                    </button>
                    <button onclick="app.toggleTheme()" class="p-2 text-zinc-400 hover:text-accent rounded-xl hover:bg-ink-850 transition">
                        <i data-lucide="moon" class="w-4 h-4 hidden dark:block"></i>
                        <i data-lucide="sun" class="w-4 h-4 block dark:hidden"></i>
                    </button>
                    <button onclick="app.openPanel()" class="p-2 text-zinc-400 hover:text-accent rounded-xl hover:bg-ink-850 transition" title="Pengaturan">
                        <i data-lucide="settings-2" class="w-4 h-4"></i>
                    </button>
                    <button onclick="app.openAuthModal()" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-full text-xs font-bold bg-ink-800 hover:bg-ink-750 text-white transition ml-0.5 border border-ink-700">
                        <i data-lucide="user-circle" class="w-3.5 h-3.5"></i>
                        <span id="btn-auth-text" class="hidden sm:inline">Login</span>
                    </button>
                </div>
            </div>
        </div>
        
        <div class="md:hidden px-3 pb-2.5">
            <div class="relative w-full">
                <i data-lucide="search" class="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500"></i>
                <input type="text" id="search-input-mobile" placeholder="Cari menu..." 
                    class="w-full pl-9 pr-3 py-2 bg-ink-850 border border-ink-750 focus:border-accent/50 rounded-2xl text-xs text-white placeholder-zinc-500 outline-none transition">
            </div>
        </div>
    </nav>

    <!-- MAIN -->
    <main class="flex-1 relative z-10 p-3 sm:p-5 max-w-[1600px] mx-auto w-full">
        <div id="info-banner" class="hidden mb-4"></div>
        
        <div id="content-container">
            <div class="flex flex-col items-center justify-center py-20 text-zinc-500">
                <i data-lucide="loader" class="w-6 h-6 animate-spin mb-3 text-accent"></i>
                <span class="text-xs font-mono uppercase tracking-wider">Memuat...</span>
            </div>
        </div>
    </main>

    <!-- SETTINGS PANEL -->
    <div id="settings-panel" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/70 backdrop-blur-sm" onclick="app.closePanel()"></div>
        
        <div id="panel-content" class="absolute right-0 top-0 bottom-0 w-full max-w-lg bg-ink-900 border-l border-ink-800 flex flex-col panel-enter">
            
            <div class="flex items-center justify-between p-4 border-b border-ink-800 shrink-0">
                <div class="flex items-center gap-2.5">
                    <div class="w-8 h-8 rounded-xl bg-accent/10 flex items-center justify-center">
                        <i data-lucide="settings-2" class="w-4 h-4 text-accent"></i>
                    </div>
                    <h2 class="font-bold text-sm text-white">Pengaturan</h2>
                </div>
                <button onclick="app.closePanel()" class="p-2 text-zinc-400 hover:text-white rounded-xl hover:bg-ink-800 transition">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
            
            <div class="flex gap-1 p-2 border-b border-ink-800 overflow-x-auto shrink-0 no-scrollbar">
                <button onclick="app.setPanelTab('info')" data-ptab="info" class="ptab whitespace-nowrap px-3 py-1.5 text-[11px] font-semibold rounded-xl text-zinc-400 hover:text-white transition">
                    <i data-lucide="info" class="w-3 h-3 inline mr-1"></i> Info
                </button>
                <button onclick="app.setPanelTab('kategori')" data-ptab="kategori" class="ptab whitespace-nowrap px-3 py-1.5 text-[11px] font-semibold rounded-xl text-zinc-400 hover:text-white transition">
                    <i data-lucide="folder" class="w-3 h-3 inline mr-1"></i> Kategori
                </button>
                <button onclick="app.setPanelTab('users')" data-ptab="users" class="ptab whitespace-nowrap px-3 py-1.5 text-[11px] font-semibold rounded-xl text-zinc-400 hover:text-white transition">
                    <i data-lucide="users" class="w-3 h-3 inline mr-1"></i> Users
                </button>
                <button onclick="app.setPanelTab('feedback')" data-ptab="feedback" class="ptab whitespace-nowrap px-3 py-1.5 text-[11px] font-semibold rounded-xl text-zinc-400 hover:text-white transition">
                    <i data-lucide="inbox" class="w-3 h-3 inline mr-1"></i> Feedback
                </button>
                <button onclick="app.setPanelTab('backup')" data-ptab="backup" class="ptab whitespace-nowrap px-3 py-1.5 text-[11px] font-semibold rounded-xl text-zinc-400 hover:text-white transition">
                    <i data-lucide="database" class="w-3 h-3 inline mr-1"></i> Backup
                </button>
                <button onclick="app.setPanelTab('prefs')" data-ptab="prefs" class="ptab whitespace-nowrap px-3 py-1.5 text-[11px] font-semibold rounded-xl text-zinc-400 hover:text-white transition">
                    <i data-lucide="sliders" class="w-3 h-3 inline mr-1"></i> Preferensi
                </button>
            </div>
            
            <div id="panel-body" class="flex-1 overflow-y-auto p-5"></div>
        </div>
    </div>

    <!-- MODAL: LOGIN -->
    <div id="auth-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/80 backdrop-blur-md">
        <div class="w-full max-w-sm bg-ink-900 border border-ink-800 rounded-3xl shadow-2xl overflow-hidden modal-enter relative">
            <button onclick="app.closeModal('auth-modal')" class="absolute top-4 right-4 text-zinc-500 hover:text-white z-10 p-1.5 rounded-xl hover:bg-ink-800 transition">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>

            <div id="form-login" class="p-7">
                <div class="mb-6 text-center">
                    <div class="w-16 h-16 bg-accent/10 rounded-3xl flex items-center justify-center mb-4 mx-auto border border-accent/20">
                        <i data-lucide="shield-lock" class="w-7 h-7 text-accent"></i>
                    </div>
                    <h3 class="text-lg font-bold text-white">Selamat Datang</h3>
                    <p class="text-xs text-zinc-500 mt-1">Masuk untuk akses penuh</p>
                </div>
                <form onsubmit="event.preventDefault(); app.doLogin()" class="space-y-3">
                    <div class="relative">
                        <i data-lucide="mail" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-zinc-500"></i>
                        <input type="email" id="input-email" autocomplete="email" class="w-full pl-10 pr-4 py-3 bg-ink-850 border border-ink-750 focus:border-accent/50 focus:ring-2 focus:ring-accent/20 rounded-2xl text-sm text-white placeholder-zinc-500 outline-none transition" placeholder="Email">
                    </div>
                    <div class="relative">
                        <i data-lucide="lock" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-zinc-500"></i>
                        <input type="password" id="input-pass" autocomplete="current-password" class="w-full pl-10 pr-4 py-3 bg-ink-850 border border-ink-750 focus:border-accent/50 focus:ring-2 focus:ring-accent/20 rounded-2xl text-sm text-white placeholder-zinc-500 outline-none transition" placeholder="Password">
                    </div>
                    <label class="flex items-center gap-2 cursor-pointer text-xs text-zinc-400 px-1">
                        <input type="checkbox" id="remember-me" checked class="w-3.5 h-3.5 rounded accent-amber-400">
                        <span>Ingat saya di perangkat ini</span>
                    </label>
                    <button type="submit" id="btn-submit" class="w-full bg-accent hover:bg-accent-hover text-black font-bold py-3.5 rounded-2xl text-sm transition active:scale-[0.98] flex justify-center items-center gap-2 shadow-lg shadow-accent/20 mt-2">Masuk</button>
                </form>
            </div>

            <div id="view-profile" class="hidden">
                <div class="p-7 text-center border-b border-ink-800">
                    <div class="w-20 h-20 rounded-3xl mx-auto mb-4 flex items-center justify-center border-2 border-accent/30 bg-accent/5 shadow-lg shadow-accent/10 overflow-hidden">
                        <img src="https://raw.githubusercontent.com/onelabszz/super/refs/heads/main/super.png" class="w-12 h-12 object-contain" alt="Avatar">
                    </div>
                    <h3 class="text-base font-bold text-white" id="prof-name">-</h3>
                    <p class="inline-block mt-2 px-3 py-0.5 bg-accent/10 text-accent text-[10px] font-mono font-bold tracking-widest uppercase rounded-full border border-accent/20" id="prof-role">-</p>
                </div>
                <div class="p-5 space-y-3">
                    <div class="flex justify-between items-center text-xs py-2 border-b border-ink-800">
                        <span class="text-zinc-500">Unit Kerja</span>
                        <span class="font-semibold text-zinc-300" id="prof-unit">-</span>
                    </div>
                    <div class="flex justify-between items-center text-xs py-2 border-b border-ink-800">
                        <span class="text-zinc-500">Email</span>
                        <span class="font-semibold text-zinc-300 text-[11px]" id="prof-email">-</span>
                    </div>
                    <button onclick="app.doLogout()" class="w-full mt-4 bg-red-500/10 hover:bg-red-500/20 text-red-400 font-bold py-3 rounded-2xl text-sm transition flex items-center justify-center gap-2 border border-red-500/20">
                        <i data-lucide="log-out" class="w-4 h-4"></i> Logout
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: LINK CRUD -->
    <div id="link-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/80 backdrop-blur-md">
        <div class="w-full max-w-xl bg-ink-900 border border-ink-800 rounded-3xl shadow-2xl overflow-hidden modal-enter max-h-[90vh] flex flex-col">
            <div class="flex items-center justify-between p-5 border-b border-ink-800 shrink-0">
                <div class="flex items-center gap-2.5">
                    <div class="w-8 h-8 rounded-xl bg-accent/10 flex items-center justify-center">
                        <i data-lucide="link" class="w-4 h-4 text-accent"></i>
                    </div>
                    <h3 class="text-sm font-bold text-white" id="link-modal-title">Tambah Link</h3>
                </div>
                <button onclick="app.closeModal('link-modal')" class="text-zinc-500 hover:text-white p-2 rounded-xl hover:bg-ink-800 transition">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
            
            <div class="p-5 overflow-y-auto space-y-4">
                <input type="hidden" id="link-id">
                
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-zinc-500 mb-1.5">Judul *</label>
                    <input type="text" id="link-judul" class="w-full bg-ink-850 border border-ink-750 focus:border-accent/50 focus:ring-2 focus:ring-accent/20 rounded-2xl px-4 py-2.5 text-sm text-white placeholder-zinc-500 outline-none transition" placeholder="Nama link">
                </div>
                
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-zinc-500 mb-1.5">URL *</label>
                    <input type="url" id="link-url" class="w-full bg-ink-850 border border-ink-750 focus:border-accent/50 focus:ring-2 focus:ring-accent/20 rounded-2xl px-4 py-2.5 text-sm text-white placeholder-zinc-500 outline-none transition font-mono" placeholder="https://...">
                </div>
                
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-zinc-500 mb-1.5">Deskripsi</label>
                    <textarea id="link-deskripsi" rows="2" class="w-full bg-ink-850 border border-ink-750 focus:border-accent/50 focus:ring-2 focus:ring-accent/20 rounded-2xl px-4 py-2.5 text-sm text-white placeholder-zinc-500 outline-none transition resize-none" placeholder="Deskripsi singkat"></textarea>
                </div>
                
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-zinc-500 mb-1.5">Kategori</label>
                        <select id="link-kategori" class="w-full bg-ink-850 border border-ink-750 focus:border-accent/50 focus:ring-2 focus:ring-accent/20 rounded-2xl px-4 py-2.5 text-sm text-white outline-none transition"></select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-zinc-500 mb-1.5">Akses Role</label>
                        <input type="text" id="link-role" class="w-full bg-ink-850 border border-ink-750 focus:border-accent/50 focus:ring-2 focus:ring-accent/20 rounded-2xl px-4 py-2.5 text-sm text-white placeholder-zinc-500 outline-none transition" placeholder="Super Admin">
                    </div>
                </div>
                
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-zinc-500 mb-1.5">Icon</label>
                    <input type="text" id="link-icon-search" placeholder="Cari icon..." class="w-full bg-ink-850 border border-ink-750 focus:border-accent/50 rounded-2xl px-4 py-2 text-xs text-white placeholder-zinc-500 outline-none transition mb-2">
                    <div id="icon-grid" class="icon-grid"></div>
                    <input type="hidden" id="link-icon" value="link">
                </div>
                
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-zinc-500 mb-1.5">Warna</label>
                    <div class="flex flex-wrap gap-2" id="color-picker"></div>
                    <input type="hidden" id="link-warna" value="zinc">
                </div>
                
                <div class="flex items-center gap-4 pt-1">
                    <label class="flex items-center gap-2 cursor-pointer text-xs text-zinc-300">
                        <input type="checkbox" id="link-pinned" class="w-4 h-4 rounded accent-amber-400">
                        <span class="font-semibold">⭐ Pin</span>
                    </label>
                    <select id="link-status" class="text-xs bg-ink-850 border border-ink-750 focus:border-accent/50 rounded-2xl px-3 py-1.5 text-white outline-none">
                        <option value="aktif">Aktif</option>
                        <option value="arsip">Arsip</option>
                    </select>
                </div>
            </div>
            
            <div class="flex items-center gap-3 p-5 border-t border-ink-800 shrink-0">
                <button onclick="app.closeModal('link-modal')" class="flex-1 px-4 py-2.5 border border-ink-750 hover:bg-ink-850 text-white rounded-2xl text-sm font-semibold transition">Batal</button>
                <button onclick="app.saveLink()" class="flex-1 px-4 py-2.5 bg-accent hover:bg-accent-hover text-black rounded-2xl text-sm font-bold transition flex items-center justify-center gap-1.5 shadow-lg shadow-accent/20">
                    <i data-lucide="save" class="w-4 h-4"></i> Simpan
                </button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast-container" class="fixed top-20 right-3 z-[60] space-y-2 max-w-xs"></div>

    <script>
    // ============================================================
    // APP v3.3 — Fixed Edit Mode
    // ============================================================
    const app = {
        apiURL: "https://script.google.com/macros/s/AKfycbx-VZ5H9Yy0drhyHucFrrhe4CHm5R7gNzmA-3VFrhgTBzYJzHYPCMp-TkWDVU0eIdr0/exec",
        
        user: null,
        menu: [],
        kategori: [],
        info: {},
        footer: [],
        users: [],
        feedbackList: [],
        editMode: false,
        sortables: [],
        isOnline: navigator.onLine,
        currentTab: 'info',
        panelOpen: false,
        
        KEYS: {
            SESSION: 'sa3_session',
            CACHE: 'sa3_cache',
            PENDING: 'sa3_pending',
            LAST_SYNC: 'sa3_lastsync',
            PREFS: 'sa3_prefs',
            THEME: 'sa3_theme'
        },
        
        prefs: {
            view: 'grid',
            compact: true,
            autoSync: false,
            autoSyncInterval: 5,
            showClicks: true,
            showBanner: true
        },
        
        ICONS: ['link','home','settings','user','users','folder','folder-cog','file','file-text','image','video','music','download','upload','cloud','database','server','globe','map-pin','calendar','clock','mail','message-circle','phone','bell','book','book-open','graduation-cap','clipboard','clipboard-check','award','star','heart','bookmark','tag','shopping-cart','shopping-bag','credit-card','dollar-sign','trending-up','bar-chart','pie-chart','activity','zap','shield','shield-check','lock','unlock','key','eye','search','filter','edit','trash-2','plus','minus','check','x','arrow-right','arrow-up-right','external-link','play','pause','power','wifi','battery','monitor','smartphone','tablet','printer','cpu','hard-drive','code','terminal','git-branch','inbox','send','log-out','log-in','layout-dashboard','package','truck','map','compass','sparkles','rocket','flame','crown','gem','palette','brush','pen-tool','camera','headphones','mic','radio','tv','film','gamepad-2','puzzle','trophy','target','flag','hash','at-sign','regex','info','help-circle','alert-circle','alert-triangle','save','grip-vertical','pencil','loader-2','refresh-cw','layout-grid','layout-list','settings-2','user-circle','user-plus','sliders','check-circle','shield-lock'],
        
        COLORS: ['zinc','blue','red','green','emerald','rose','yellow','amber','indigo','purple','orange','pink','sky','teal','violet'],
        
        // ============================================================
        // INIT
        // ============================================================
        init: function() {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            }
            
            const forceSyncFlag = sessionStorage.getItem('force_sync_done');
            if (forceSyncFlag) {
                sessionStorage.removeItem('force_sync_done');
                console.log('[Force Sync] Reload complete');
                setTimeout(() => {
                    if (app && app.toast) app.toast('Force Sync selesai — data terbaru dimuat', 'success');
                }, 800);
                setTimeout(() => {
                    if (app && app.syncNow) app.syncNow(true);
                }, 1200);
            }
            
            const savedTheme = localStorage.getItem(this.KEYS.THEME);
            if(savedTheme === 'light') {
                document.documentElement.classList.remove('dark');
            } else {
                document.documentElement.classList.add('dark');
            }
            
            try {
                const p = JSON.parse(localStorage.getItem(this.KEYS.PREFS) || '{}');
                this.prefs = { ...this.prefs, ...p };
            } catch(e) {}
            
            try {
                const sess = JSON.parse(localStorage.getItem(this.KEYS.SESSION) || 'null');
                if (sess && sess.user) this.user = sess.user;
            } catch(e) { localStorage.removeItem(this.KEYS.SESSION); }
            
            this.loadFromCache();
            this.updateUIState();
            this.renderAll();
            this.updateSyncIndicator();
            this.updateViewIcon();
            
            ['search-input','search-input-mobile'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.addEventListener('input', (e) => this.renderMenu(e.target.value.toLowerCase()));
            });
            
            this.setupIconPicker();
            this.setupColorPicker();
            
            window.addEventListener('online', () => { 
                this.isOnline = true; this.updateSyncIndicator(); 
                if (this.prefs.autoSync) this.syncNow(true); 
                this.syncPending();
            });
            window.addEventListener('offline', () => { 
                this.isOnline = false; this.updateSyncIndicator(); 
            });
            
            window.addEventListener('storage', (e) => {
                if (e.key === this.KEYS.CACHE) { this.loadFromCache(); this.renderAll(); }
            });
            
            if (this.prefs.autoSync) {
                setInterval(() => { if (this.isOnline) this.syncNow(true); }, this.prefs.autoSyncInterval * 60 * 1000);
            }
            
            this.renderPanel();
            
            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'k') { 
                    e.preventDefault(); 
                    document.getElementById('search-input').focus(); 
                }
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'R') { 
                    e.preventDefault();
                    if (this.user && (this.user.jabatan.toLowerCase() === 'super admin' || this.user.jabatan.toLowerCase() === 'admin')) {
                        this.forceSync();
                    }
                }
                if (e.key === 'Escape') { 
                    this.closeModal('auth-modal'); 
                    this.closeModal('link-modal'); 
                    this.closePanel(); 
                }
            });
            
            lucide.createIcons();
        },
        
        // ============================================================
        // STORAGE
        // ============================================================
        loadFromCache: function() {
            try {
                const cached = JSON.parse(localStorage.getItem(this.KEYS.CACHE) || '{}');
                this.menu = cached.menu || [];
                this.kategori = cached.kategori || [];
                this.info = cached.info || {};
                this.footer = cached.footer || [];
                this.users = cached.users || [];
                this.feedbackList = cached.feedback || [];
            } catch(e) {}
        },
        
        saveCache: function() {
            localStorage.setItem(this.KEYS.CACHE, JSON.stringify({
                menu: this.menu, kategori: this.kategori, info: this.info,
                footer: this.footer, users: this.users, feedback: this.feedbackList,
                cachedAt: new Date().toISOString()
            }));
        },
        
        saveSession: function() {
            if (this.user) {
                localStorage.setItem(this.KEYS.SESSION, JSON.stringify({ user: this.user, savedAt: new Date().toISOString() }));
            } else {
                localStorage.removeItem(this.KEYS.SESSION);
            }
        },
        
        savePrefs: function() { localStorage.setItem(this.KEYS.PREFS, JSON.stringify(this.prefs)); },
        
        // ============================================================
        // SYNC
        // ============================================================
        syncNow: function(silent) {
            if (!this.isOnline) {
                if (!silent) this.toast('Offline — tidak bisa sync', 'warning');
                this.updateSyncIndicator('offline'); return;
            }
            
            this.updateSyncIndicator('syncing');
            const btn = document.getElementById('btn-sync');
            if (btn && !silent) btn.querySelector('i').classList.add('animate-spin');
            
            fetch(`${this.apiURL}?action=bootstrap`)
                .then(r => r.json())
                .then(res => {
                    if (res.status !== 'success') throw new Error(res.message);
                    const d = res.data;
                    if (d.menu) this.menu = d.menu;
                    if (d.kategori) this.kategori = d.kategori;
                    if (d.info) this.info = d.info;
                    if (d.footer) this.footer = d.footer;
                    if (d.users) this.users = d.users;
                    this.saveCache();
                    localStorage.setItem(this.KEYS.LAST_SYNC, res.serverTime);
                    this.renderAll();
                    this.updateSyncIndicator('synced');
                    if (!silent) this.toast('Data tersinkron', 'success');
                    if (this.user && (this.user.jabatan === 'Super Admin' || this.user.jabatan === 'Admin')) {
                        this.loadFeedback(silent);
                    }
                })
                .catch(err => {
                    this.updateSyncIndicator('error');
                    if (!silent) this.toast('Sync gagal: ' + err.message, 'error');
                })
                .finally(() => { if (btn) btn.querySelector('i').classList.remove('animate-spin'); });
        },
        
        // ============================================================
        // FORCE SYNC
        // ============================================================
        forceSync: function() {
            if (!this.user) { this.toast('Login dulu untuk Force Sync', 'warning'); return; }
            const role = this.user.jabatan.toLowerCase();
            if (role !== 'super admin' && role !== 'admin') {
                this.toast('Hanya Admin/Super Admin yang bisa Force Sync', 'error');
                return;
            }
            
            const confirmed = confirm(
                'FORCE SYNC\n\n' +
                'Tindakan ini akan:\n' +
                '• Hapus semua cache lokal (menu, kategori, feedback)\n' +
                '• Update file aplikasi ke versi terbaru\n' +
                '• Reload halaman otomatis\n\n' +
                '✓ Session login tetap tersimpan\n' +
                '✗ Perubahan yang belum sync akan HILANG\n\n' +
                'Lanjutkan?'
            );
            if (!confirmed) return;
            
            const pending = JSON.parse(localStorage.getItem(this.KEYS.PENDING) || '[]');
            if (pending.length > 0) {
                const doSyncFirst = confirm(
                    `Ada ${pending.length} perubahan belum tersinkron.\n\n` +
                    'OK = Sync dulu, baru Force Sync\n' +
                    'Cancel = Lanjut Force Sync (data pending HILANG)'
                );
                if (doSyncFirst) {
                    this.syncPending();
                    setTimeout(() => {
                        if (confirm('Sync selesai. Lanjut Force Sync sekarang?')) {
                            this._doForceSync();
                        }
                    }, 2500);
                    return;
                }
            }
            
            this._doForceSync();
        },
        
        _doForceSync: function() {
            this.toast('Memproses Force Sync...', 'info');
            this.updateSyncIndicator('syncing');
            
            const btnFS = document.getElementById('btn-force-sync');
            if (btnFS) btnFS.querySelector('i').classList.add('force-spin');
            
            const clearCaches = (typeof caches !== 'undefined') ? 
                caches.keys().then(names => 
                    Promise.all(names.map(name => caches.delete(name)))
                ) : Promise.resolve();
            
            const unregisterSW = ('serviceWorker' in navigator) ?
                navigator.serviceWorker.getRegistrations().then(regs => 
                    Promise.all(regs.map(reg => reg.unregister()))
                ) : Promise.resolve();
            
            const keysToKeep = [this.KEYS.SESSION, this.KEYS.PREFS, this.KEYS.THEME];
            Object.values(this.KEYS).forEach(k => {
                if (!keysToKeep.includes(k)) {
                    localStorage.removeItem(k);
                }
            });
            
            Promise.all([clearCaches, unregisterSW])
                .then(() => {
                    console.log('[Force Sync] Cache & SW cleared');
                    sessionStorage.setItem('force_sync_done', Date.now().toString());
                    setTimeout(() => {
                        const url = new URL(window.location.href);
                        url.searchParams.set('_fs', Date.now());
                        window.location.replace(url.toString());
                    }, 800);
                })
                .catch(err => {
                    console.error('[Force Sync] Error:', err);
                    sessionStorage.setItem('force_sync_done', Date.now().toString());
                    setTimeout(() => {
                        const url = new URL(window.location.href);
                        url.searchParams.set('_fs', Date.now());
                        window.location.replace(url.toString());
                    }, 500);
                });
        },
        
        // ============================================================
        // RENDER
        // ============================================================
        renderAll: function(searchQuery) {
            this.renderMenu(searchQuery);
            this.renderInfoBanner();
            lucide.createIcons();
        },
        
        renderInfoBanner: function() {
            const banner = document.getElementById('info-banner');
            if (!banner) return;
            const info = this.info;
            const showBanner = this.prefs.showBanner && info && (info.STATUS === 'ON' || info.STATUS === 'on' || info.STATUS === true);
            
            if (!showBanner || !info.PESAN) { banner.classList.add('hidden'); return; }
            
            const colorMap = {
                green: 'bg-emerald-500/10 border-emerald-500/30 text-emerald-300',
                blue: 'bg-blue-500/10 border-blue-500/30 text-blue-300',
                red: 'bg-red-500/10 border-red-500/30 text-red-300',
                yellow: 'bg-accent/10 border-accent/30 text-accent',
                indigo: 'bg-indigo-500/10 border-indigo-500/30 text-indigo-300'
            };
            const cls = colorMap[info.WARNA] || colorMap.yellow;
            
            banner.className = `mb-4 p-3.5 border rounded-2xl flex items-start gap-3 ${cls}`;
            banner.innerHTML = `
                <div class="w-7 h-7 rounded-xl bg-current/10 flex items-center justify-center shrink-0">
                    <i data-lucide="info" class="w-3.5 h-3.5"></i>
                </div>
                <div class="flex-1 text-xs leading-relaxed pt-0.5">${this.escape(info.PESAN)}</div>
                <button onclick="document.getElementById('info-banner').classList.add('hidden')" class="opacity-60 hover:opacity-100 shrink-0 p-1">
                    <i data-lucide="x" class="w-3.5 h-3.5"></i>
                </button>
            `;
            lucide.createIcons();
        },
        
        renderMenu: function(searchQuery) {
            const container = document.getElementById('content-container');
            const q = searchQuery || '';
            const userRole = this.user ? this.user.jabatan.toLowerCase() : '';
            
            let items = this.menu.filter(item => {
                if (item.DELETED === true || item.DELETED === 'TRUE') return false;
                if (item.STATUS === 'arsip') return false;
                if (q && !(
                    String(item.JUDUL).toLowerCase().includes(q) ||
                    String(item.DESKRIPSI || '').toLowerCase().includes(q) ||
                    String(item.URL).toLowerCase().includes(q)
                )) return false;
                const reqRole = String(item.AKSES_ROLE || '').trim();
                if (!reqRole) return true;
                const roles = reqRole.split(',').map(r => r.trim().toLowerCase()).filter(Boolean);
                if (roles.length === 0) return true;
                if (userRole === 'super admin') return true;
                return roles.includes(userRole);
            });
            
            if (items.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-20 text-zinc-600">
                        <div class="w-16 h-16 rounded-3xl bg-ink-850 flex items-center justify-center mb-4 border border-ink-800">
                            <i data-lucide="inbox" class="w-7 h-7 opacity-50"></i>
                        </div>
                        <p class="text-xs">${q ? 'Tidak ada hasil untuk "' + this.escape(q) + '"' : 'Belum ada menu'}</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }
            
            const groups = {};
            this.kategori.forEach(k => groups[k.NAMA] = []);
            groups['Lain-lain'] = groups['Lain-lain'] || [];
            
            items.forEach(item => {
                const kat = item.KATEGORI || 'Lain-lain';
                if (!groups[kat]) groups[kat] = [];
                groups[kat].push(item);
            });
            
            const sortedKatNames = Object.keys(groups).sort((a, b) => {
                const ka = this.kategori.find(k => k.NAMA === a);
                const kb = this.kategori.find(k => k.NAMA === b);
                return (Number(ka?.URUTAN) || 999) - (Number(kb?.URUTAN) || 999);
            });
            
            const isListView = this.prefs.view === 'list';
            let html = '';
            
            sortedKatNames.forEach(katName => {
                const katItems = groups[katName];
                if (!katItems || katItems.length === 0) return;
                
                katItems.sort((a, b) => {
                    const pa = (a.PINNED === true || a.PINNED === 'TRUE') ? 0 : 1;
                    const pb = (b.PINNED === true || b.PINNED === 'TRUE') ? 0 : 1;
                    if (pa !== pb) return pa - pb;
                    return (Number(a.URUTAN) || 999) - (Number(b.URUTAN) || 999);
                });
                
                const katInfo = this.kategori.find(k => k.NAMA === katName);
                const katIcon = katInfo?.ICON || 'folder';
                
                html += `
                    <div class="mb-6">
                        <div class="flex items-center gap-2 mb-3 px-1">
                            <div class="w-6 h-6 rounded-lg bg-ink-850 border border-ink-800 flex items-center justify-center">
                                <i data-lucide="${katIcon}" class="w-3 h-3 text-accent"></i>
                            </div>
                            <h3 class="text-[11px] font-bold uppercase tracking-widest text-zinc-400">${this.escape(katName)}</h3>
                            <span class="text-[9px] bg-ink-850 border border-ink-800 px-1.5 py-0.5 rounded-full font-mono text-zinc-500">${katItems.length}</span>
                        </div>
                        ${isListView 
                            ? `<div class="menu-list flex flex-col gap-1.5">${katItems.map(item => this.renderListRow(item)).join('')}</div>`
                            : `<div class="menu-grid grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-2.5">${katItems.map(item => this.renderCard(item)).join('')}</div>`
                        }
                    </div>
                `;
            });
            
            container.innerHTML = html;
            this.setupSortable();
            lucide.createIcons();
        },
        
        renderCard: function(item) {
            const isPinned = item.PINNED === true || item.PINNED === 'TRUE';
            const colorMap = this.getColorConfig(item.WARNA);
            const icon = item.ICON || 'link';
            const isEdit = this.editMode;
            const safeUrl = this.safeUrl(item.URL);
            const showClicks = this.prefs.showClicks && Number(item.CLICKS) > 0;
            
            return `
                <div class="menu-card card-link group relative" data-id="${item.ID}">
                    <div class="card-inner relative flex flex-col p-4 bg-ink-800 border border-ink-700/60 rounded-3xl transition-all duration-200">
                        
                        ${isEdit ? `
                            <div class="drag-handle absolute top-2.5 left-2.5 p-1 rounded-lg hover:bg-ink-750 text-zinc-500 z-10">
                                <i data-lucide="grip-vertical" class="w-3.5 h-3.5"></i>
                            </div>
                            <div class="absolute top-2.5 right-2.5 flex gap-1 z-10">
                                <button onclick="event.stopPropagation();app.editLink('${item.ID}')" class="p-1.5 rounded-lg bg-ink-750/80 hover:bg-ink-700 text-zinc-400 hover:text-accent" title="Edit">
                                    <i data-lucide="pencil" class="w-3 h-3"></i>
                                </button>
                                <button onclick="event.stopPropagation();app.deleteLink('${item.ID}')" class="p-1.5 rounded-lg bg-ink-750/80 hover:bg-red-500/20 text-zinc-400 hover:text-red-400" title="Hapus">
                                    <i data-lucide="trash-2" class="w-3 h-3"></i>
                                </button>
                            </div>
                        ` : ''}
                        
                        <a href="${isEdit ? 'javascript:void(0)' : safeUrl}" ${!isEdit ? 'target="_blank" rel="noopener"' : ''} 
                           onclick="${isEdit ? 'event.preventDefault()' : `app.trackClick('${item.ID}')`}"
                           class="flex flex-col items-center text-center ${isEdit ? 'pointer-events-none' : ''}">
                            
                            <div class="relative mt-1 mb-3">
                                <div class="w-14 h-14 rounded-full flex items-center justify-center ${colorMap.bg} ${colorMap.glow}">
                                    <i data-lucide="${icon}" class="w-6 h-6 ${colorMap.text}"></i>
                                </div>
                                ${isPinned ? `<div class="absolute -top-1 -right-1 w-5 h-5 rounded-full bg-accent flex items-center justify-center text-[10px] shadow-lg shadow-accent/30">⭐</div>` : ''}
                            </div>
                            
                            <h4 class="font-semibold text-xs text-white leading-tight line-clamp-2 group-hover:text-accent transition min-h-[2rem]">${this.escape(item.JUDUL)}</h4>
                            ${item.DESKRIPSI ? `<p class="text-[10px] text-zinc-500 mt-1 line-clamp-1 leading-tight">${this.escape(item.DESKRIPSI)}</p>` : ''}
                            
                            ${showClicks ? `<div class="mt-2 inline-flex items-center gap-1 px-2 py-0.5 bg-ink-850 border border-ink-700 rounded-full text-[9px] text-zinc-500 font-mono">${item.CLICKS}×</div>` : ''}
                        </a>
                    </div>
                </div>
            `;
        },
        
        renderListRow: function(item) {
            const isPinned = item.PINNED === true || item.PINNED === 'TRUE';
            const colorMap = this.getColorConfig(item.WARNA);
            const icon = item.ICON || 'link';
            const isEdit = this.editMode;
            const safeUrl = this.safeUrl(item.URL);
            const showClicks = this.prefs.showClicks && Number(item.CLICKS) > 0;
            
            return `
                <div class="list-row group flex items-center gap-3 p-3 bg-ink-800 border border-ink-700/60 rounded-2xl hover:border-accent/30 transition" data-id="${item.ID}">
                    ${isEdit ? `<div class="drag-handle p-1 text-zinc-500 cursor-grab"><i data-lucide="grip-vertical" class="w-3.5 h-3.5"></i></div>` : ''}
                    
                    <a href="${isEdit ? 'javascript:void(0)' : safeUrl}" ${!isEdit ? 'target="_blank" rel="noopener"' : ''} 
                       onclick="${isEdit ? 'event.preventDefault()' : `app.trackClick('${item.ID}')`}"
                       class="flex items-center gap-3 flex-1 min-w-0 ${isEdit ? 'pointer-events-none' : ''}">
                        <div class="w-10 h-10 rounded-full flex items-center justify-center shrink-0 ${colorMap.bg} ${colorMap.glow}">
                            <i data-lucide="${icon}" class="w-4 h-4 ${colorMap.text}"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-1.5">
                                ${isPinned ? '<span class="text-[10px]">⭐</span>' : ''}
                                <h4 class="font-semibold text-xs text-white truncate group-hover:text-accent transition">${this.escape(item.JUDUL)}</h4>
                            </div>
                            <p class="text-[10px] text-zinc-500 truncate mt-0.5">${this.escape(item.DESKRIPSI || item.URL)}</p>
                        </div>
                        ${showClicks ? `<span class="text-[9px] text-zinc-500 font-mono shrink-0 px-2 py-0.5 bg-ink-850 border border-ink-700 rounded-full">${item.CLICKS}×</span>` : ''}
                    </a>
                    
                    ${isEdit ? `
                        <div class="flex gap-1 shrink-0">
                            <button onclick="app.editLink('${item.ID}')" class="p-1.5 rounded-lg hover:bg-ink-750 text-zinc-400 hover:text-accent">
                                <i data-lucide="pencil" class="w-3 h-3"></i>
                            </button>
                            <button onclick="app.deleteLink('${item.ID}')" class="p-1.5 rounded-lg hover:bg-red-500/20 text-zinc-400 hover:text-red-400">
                                <i data-lucide="trash-2" class="w-3 h-3"></i>

            const data = {

            if (!data.judul || !data.url) { this.toast('Judul & URL wajib', 'error'); return; }
            try {
                const u = new URL(data.url);
                if (u.protocol !== 'http:' && u.protocol !== 'https:') throw new Error();
            } catch(e) { this.toast('URL tidak valid', 'error'); return; }
            
            this.closeModal('link-modal');
            
            if (!id) {

            } else {
                const idx = this.menu.findIndex(m => m.ID === id);
                if (idx >= 0) this.menu[idx] = { ...this.menu[idx], ...data };
                this.queuePending({ action: 'update', id, data, userEmail: this.user?.email });

        reorderMenus: function(ids) {

                if (item) item.URUTAN = idx + 1;

        // ============================================================
        // PENDING
        // ============================================================
        queuePending: function(op) {
            const queue = JSON.parse(localStorage.getItem(this.KEYS.PENDING) || '[]');
            queue.push({ ...op, queuedAt: Date.now() });
            localStorage.setItem(this.KEYS.PENDING, JSON.stringify(queue));
            this.updateSyncIndicator();
        },
        
        syncPending: function() {
            if (!this.isOnline) { this.updateSyncIndicator('offline'); return; }
            const queue = JSON.parse(localStorage.getItem(this.KEYS.PENDING) || '[]');
            if (queue.length === 0) { this.updateSyncIndicator(); return; }
            
            const processNext = (i) => {
                if (i >= queue.length) {
                    localStorage.setItem(this.KEYS.PENDING, '[]');
                    this.updateSyncIndicator();
                    return;
                }
                const op = queue[i];
                fetch(this.apiURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(op)
                })
                .then(r => r.json())
                .then(res => {
                    if (res.status === 'success') {
                        if (op.action === 'add' && op.tempId && res.id) {
                            const item = this.menu.find(m => m.ID === op.tempId);
                            if (item) item.ID = res.id;
                            this.saveCache();
                        }
                        processNext(i + 1);
                    } else {
                        localStorage.setItem(this.KEYS.PENDING, JSON.stringify(queue.slice(i + 1)));
                        this.updateSyncIndicator('error');
                        console.error('Sync error:', res);
                    }
                })
                .catch(() => this.updateSyncIndicator('offline'));
            };
            processNext(0);
        },
        
        trackClick: function(id) {
            const item = this.menu.find(m => m.ID === id);
            if (item) item.CLICKS = (Number(item.CLICKS) || 0) + 1;
            if (!this.isOnline) return;
            fetch(this.apiURL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'trackClick', id })
            }).catch(() => {});
        },
        
        // ============================================================
        // AUTH
        // ============================================================
        doLogin: function() {
            const email = document.getElementById('input-email').value.trim();
            const pass = document.getElementById('input-pass').value;
            const remember = document.getElementById('remember-me').checked;
            const btn = document.getElementById('btn-submit');
            if (!email || !pass) { this.toast('Email & password wajib', 'error'); return; }
            
            const orig = btn.innerHTML;
            btn.innerHTML = `<i data-lucide="loader-2" class="animate-spin w-4 h-4"></i> Memverifikasi...`;
            btn.disabled = true;
            lucide.createIcons();
            
            fetch(this.apiURL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'login', email, password: pass })
            })
            .then(r => r.json())
            .then(res => {
                if (res.status === 'success') {
                    this.user = { nama: res.nama, jabatan: res.jabatan, unit: res.unit, email: res.email };
                    this.saveSession();
                    this.updateUIState();
                    this.renderAll();
                    this.closeModal('auth-modal');
                    this.toast('Selamat datang, ' + res.nama, 'success');
                    if (remember) { this.trackLogin(); this.loadFeedback(true); }
                } else {
                    this.toast(res.message || 'Login gagal', 'error');
                }
            })
            .catch(() => this.toast('Server tidak dapat dijangkau', 'error'))
            .finally(() => { btn.innerHTML = orig; btn.disabled = false; lucide.createIcons(); });
        },
        
        doLogout: function() {
            if (!confirm('Logout dari console?')) return;
            localStorage.removeItem(this.KEYS.SESSION);
            this.user = null;
            this.editMode = false;

            this.updateUIState();

            const data = { version: '3.3', exportedAt: new Date().toISOString(), menu: this.menu, kategori: this.kategori, info: this.info, footer: this.footer };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `superapp-backup-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
            this.toast('Backup didownload', 'success');
        },
        
        importJSON: function(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (!data.menu) throw new Error('Invalid');
                    this.toast(`File ${data.menu.length} menu. Apply manual via Sheet.`, 'warning');
                } catch(err) { this.toast('File tidak valid', 'error'); }
                event.target.value = '';
            };
            reader.readAsText(file);
        },

        updateSyncIndicator: function(state) {
            const dot = document.getElementById('sync-dot');
            const text = document.getElementById('sync-text');
            const queue = JSON.parse(localStorage.getItem(this.KEYS.PENDING) || '[]');
            const lastSync = localStorage.getItem(this.KEYS.LAST_SYNC);
            
            const s = state || (this.isOnline ? 'synced' : 'offline');
            const states = {
                synced: { color: 'bg-emerald-400' },
                syncing: { color: 'bg-accent sync-pulse' },
                offline: { color: 'bg-zinc-600' },
                error: { color: 'bg-red-400' }
            };
            const cfg = states[s] || states.synced;
            dot.className = 'w-1.5 h-1.5 rounded-full ' + cfg.color;
            
            let label = 'Baru saja';
            if (queue.length > 0) label = `Pending (${queue.length})`;
            else if (!this.isOnline) label = 'Offline';
            else if (lastSync) label = this.timeAgo(lastSync);
            text.innerText = label;
        },
        
        timeAgo: function(isoString) {
            if (!isoString) return 'Belum sync';
            try {
                const d = new Date(isoString.replace(' ', 'T'));
                const diff = Math.floor((Date.now() - d.getTime()) / 1000);
                if (diff < 60) return 'Baru saja';
                if (diff < 3600) return `${Math.floor(diff/60)}m lalu`;
                if (diff < 86400) return `${Math.floor(diff/3600)}j lalu`;
                return `${Math.floor(diff/86400)}h lalu`;
            } catch(e) { return 'Belum sync'; }
        },

            const el = document.createElement('div');

            el.innerHTML = `<i data-lucide="${icons[type] || 'info'}" class="w-4 h-4 shrink-0"></i><span class="flex-1">${this.escape(msg)}</span>`;
            document.getElementById('toast-container').appendChild(el);

            setTimeout(() => {
                el.style.transition = 'all 0.3s';

        getColorConfig: function(color) {
            const map = {
                zinc:    { bg: 'bg-zinc-500/15',   text: 'text-zinc-300',   glow: 'shadow-[0_0_20px_-4px_rgba(161,161,170,0.5)]' },
                blue:    { bg: 'bg-blue-500/15',   text: 'text-blue-400',   glow: 'shadow-[0_0_20px_-4px_rgba(59,130,246,0.6)]' },
                red:     { bg: 'bg-red-500/15',    text: 'text-red-400',    glow: 'shadow-[0_0_20px_-4px_rgba(239,68,68,0.6)]' },
                green:   { bg: 'bg-green-500/15',  text: 'text-green-400',  glow: 'shadow-[0_0_20px_-4px_rgba(34,197,94,0.6)]' },
                emerald: { bg: 'bg-emerald-500/15',text: 'text-emerald-400',glow: 'shadow-[0_0_20px_-4px_rgba(16,185,129,0.6)]' },
                rose:    { bg: 'bg-rose-500/15',   text: 'text-rose-400',   glow: 'shadow-[0_0_20px_-4px_rgba(244,63,94,0.6)]' },
                yellow:  { bg: 'bg-yellow-400/15', text: 'text-yellow-300', glow: 'shadow-[0_0_20px_-4px_rgba(250,204,21,0.7)]' },
                amber:   { bg: 'bg-amber-400/15',  text: 'text-amber-300',  glow: 'shadow-[0_0_20px_-4px_rgba(251,191,36,0.7)]' },
                indigo:  { bg: 'bg-indigo-500/15', text: 'text-indigo-400', glow: 'shadow-[0_0_20px_-4px_rgba(99,102,241,0.6)]' },
                purple:  { bg: 'bg-purple-500/15', text: 'text-purple-400', glow: 'shadow-[0_0_20px_-4px_rgba(168,85,247,0.6)]' },
                orange:  { bg: 'bg-orange-500/15', text: 'text-orange-400', glow: 'shadow-[0_0_20px_-4px_rgba(249,115,22,0.6)]' },
                pink:    { bg: 'bg-pink-500/15',   text: 'text-pink-400',   glow: 'shadow-[0_0_20px_-4px_rgba(236,72,153,0.6)]' },
                sky:     { bg: 'bg-sky-500/15',    text: 'text-sky-400',    glow: 'shadow-[0_0_20px_-4px_rgba(14,165,233,0.6)]' },
                teal:    { bg: 'bg-teal-500/15',   text: 'text-teal-400',   glow: 'shadow-[0_0_20px_-4px_rgba(20,184,166,0.6)]' },
                violet:  { bg: 'bg-violet-500/15', text: 'text-violet-400', glow: 'shadow-[0_0_20px_-4px_rgba(139,92,246,0.6)]' }
            };
            return map[color] || map.zinc;
        },
        
        escape: function(str) {
            return String(str ?? '').replace(/[&<>"']/g, m => ({
                '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
            })[m]);
        },
        
        safeUrl: function(url) {
            try {
                const u = new URL(String(url));
                if (u.protocol === 'http:' || u.protocol === 'https:') return u.href;
            } catch(e) {}
            return '#';
        }
    };
    
    document.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
</html>
