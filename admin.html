<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" content="#18181b">
    <meta name="description" content="Super Admin Console v3.0">
    <title>Admin Console v3.0</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/onelabszz/super/refs/heads/main/super.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        bgdark: '#09090b',
                        panel: '#18181b',
                        border: '#27272a',
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { background-color: #fafafa; font-family: 'Inter', sans-serif; }
        .dark body { background-color: #09090b; }
        .bg-grid { background-image: radial-gradient(#a1a1aa 1px, transparent 1px); background-size: 24px 24px; opacity: 0.1; }
        .dark .bg-grid { background-image: radial-gradient(#3f3f46 1px, transparent 1px); opacity: 0.08; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
        .dark .glass { background: rgba(9, 9, 11, 0.9); }
        
        /* Compact cards */
        .card-compact { padding: 12px; }
        .card-compact:hover { transform: translateY(-1px); }
        
        /* Sortable */
        .sortable-ghost { opacity: 0.3; background: #818cf8 !important; }
        .sortable-chosen { transform: scale(1.03); z-index: 100; }
        .drag-handle { cursor: grab; }
        .drag-handle:active { cursor: grabbing; }
        
        /* Modal */
        .modal-enter { animation: modalIn 0.18s ease-out; }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
        
        /* Panel slide */
        .panel-enter { animation: panelIn 0.22s ease-out; }
        @keyframes panelIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
        .panel-exit { animation: panelOut 0.2s ease-in forwards; }
        @keyframes panelOut { from { transform: translateX(0); } to { transform: translateX(100%); } }
        
        /* Toast */
        .toast { animation: slideIn 0.25s ease-out; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        /* Icon picker */
        .icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 4px; max-height: 180px; overflow-y: auto; padding: 8px; border: 1px solid #e4e4e7; border-radius: 8px; }
        .dark .icon-grid { border-color: #27272a; }
        .icon-btn { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer; transition: all 0.12s; }
        .icon-btn:hover { background: #f4f4f5; }
        .dark .icon-btn:hover { background: #27272a; }
        .icon-btn.selected { background: #4f46e5; color: white; }
        
        /* Color picker */
        .color-dot { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: all 0.12s; }
        .color-dot:hover { transform: scale(1.15); }
        .color-dot.selected { border-color: #18181b; transform: scale(1.15); }
        .dark .color-dot.selected { border-color: white; }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #3f3f46; }
        
        /* List view */
        .list-row { transition: all 0.12s; }
        .list-row:hover { background: #f4f4f5; }
        .dark .list-row:hover { background: rgba(39, 39, 42, 0.5); }
        
        /* Sync dot pulse */
        @keyframes syncPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .sync-pulse { animation: syncPulse 1.2s ease-in-out infinite; }
        
        /* Panel tab active */
        .ptab-active { background: #4f46e5; color: white; }
        
        /* Line clamp */
        .line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="text-zinc-800 dark:text-zinc-200 min-h-screen flex flex-col transition-colors duration-200 relative">

    <div class="fixed inset-0 bg-grid pointer-events-none z-0"></div>

    <!-- ============ NAVBAR (COMPACT) ============ -->
    <nav class="sticky top-0 z-40 w-full border-b border-zinc-200 dark:border-border glass">
        <div class="max-w-[1600px] mx-auto px-3 sm:px-4">
            <div class="flex items-center justify-between h-14 gap-2">
                
                <!-- Left: Logo & Brand -->
                <div class="flex items-center gap-2 min-w-0">
                    <div class="w-7 h-7 rounded bg-zinc-900 dark:bg-white flex items-center justify-center shrink-0">
                        <img src="https://raw.githubusercontent.com/onelabszz/super/refs/heads/main/super.png" class="w-5 h-5 object-contain" alt="Logo">
                    </div>
                    <div class="min-w-0">
                        <div class="flex items-center gap-1.5">
                            <h1 class="font-bold text-sm tracking-tight leading-none dark:text-white truncate">Console</h1>
                            <span id="nav-role-badge" class="text-[9px] font-mono uppercase tracking-wider text-zinc-500 font-semibold hidden sm:inline">Guest</span>
                        </div>
                        <div class="flex items-center gap-1.5 mt-0.5">
                            <span id="sync-dot" class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                            <span id="sync-text" class="text-[9px] font-mono text-zinc-400 truncate">Baru saja</span>
                        </div>
                    </div>
                </div>

                <!-- Center: Search -->
                <div class="hidden md:flex flex-1 max-w-md mx-4">
                    <div class="relative w-full">
                        <i data-lucide="search" class="w-3.5 h-3.5 absolute left-2.5 top-1/2 -translate-y-1/2 text-zinc-400"></i>
                        <input type="text" id="search-input" placeholder="Cari..." 
                            class="w-full pl-8 pr-3 py-1.5 bg-zinc-100 dark:bg-zinc-900 border border-transparent focus:border-indigo-500 rounded-lg text-xs outline-none transition">
                    </div>
                </div>

                <!-- Right: Actions -->
                <div class="flex items-center gap-1">
                    <button onclick="app.toggleView()" class="p-1.5 text-zinc-500 hover:text-zinc-900 dark:hover:text-white rounded-lg hover:bg-zinc-100 dark:hover:bg-zinc-800" title="Ganti tampilan">
                        <i data-lucide="layout-grid" id="view-icon" class="w-4 h-4"></i>
                    </button>
                    <button onclick="app.syncNow()" id="btn-sync" class="p-1.5 text-zinc-500 hover:text-zinc-900 dark:hover:text-white rounded-lg hover:bg-zinc-100 dark:hover:bg-zinc-800" title="Sync sekarang">
                        <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                    </button>
                    <button id="btn-tambah" onclick="app.openLinkModal()" class="hidden p-1.5 text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg" title="Tambah link">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                    </button>
                    <button onclick="app.toggleTheme()" class="p-1.5 text-zinc-500 hover:text-zinc-900 dark:hover:text-white rounded-lg hover:bg-zinc-100 dark:hover:bg-zinc-800">
                        <i data-lucide="moon" class="w-4 h-4 hidden dark:block"></i>
                        <i data-lucide="sun" class="w-4 h-4 block dark:hidden"></i>
                    </button>
                    <button onclick="app.openPanel()" class="p-1.5 text-zinc-500 hover:text-zinc-900 dark:hover:text-white rounded-lg hover:bg-zinc-100 dark:hover:bg-zinc-800" title="Pengaturan">
                        <i data-lucide="settings-2" class="w-4 h-4"></i>
                    </button>
                    <button onclick="app.openAuthModal()" class="flex items-center gap-1 px-2 py-1.5 rounded-lg text-xs font-semibold bg-zinc-900 text-white dark:bg-white dark:text-black hover:opacity-90 transition">
                        <i data-lucide="user-circle" class="w-3.5 h-3.5"></i>
                        <span id="btn-auth-text" class="hidden sm:inline">Login</span>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Mobile search bar -->
        <div class="md:hidden px-3 pb-2">
            <div class="relative w-full">
                <i data-lucide="search" class="w-3.5 h-3.5 absolute left-2.5 top-1/2 -translate-y-1/2 text-zinc-400"></i>
                <input type="text" id="search-input-mobile" placeholder="Cari..." 
                    class="w-full pl-8 pr-3 py-1.5 bg-zinc-100 dark:bg-zinc-900 border border-transparent focus:border-indigo-500 rounded-lg text-xs outline-none transition">
            </div>
        </div>
    </nav>

    <!-- ============ MAIN CONTENT ============ -->
    <main class="flex-1 relative z-10 p-3 sm:p-4 max-w-[1600px] mx-auto w-full">
        
        <!-- Info banner (jika ada) -->
        <div id="info-banner" class="hidden mb-3"></div>
        
        <!-- Content container -->
        <div id="content-container">
            <div class="flex flex-col items-center justify-center py-16 text-zinc-400">
                <i data-lucide="loader" class="w-6 h-6 animate-spin mb-2"></i>
                <span class="text-xs font-mono">MEMUAT...</span>
            </div>
        </div>
        
        <!-- Empty state placeholder -->
        <div id="empty-state" class="hidden flex-col items-center justify-center py-16 text-zinc-400">
            <i data-lucide="inbox" class="w-10 h-10 mb-2 opacity-50"></i>
            <p class="text-xs">Belum ada menu</p>
        </div>
    </main>

    <!-- ============ SETTINGS PANEL (SLIDE FROM RIGHT) ============ -->
    <div id="settings-panel" class="fixed inset-0 z-50 hidden">
        <!-- Backdrop -->
        <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="app.closePanel()"></div>
        
        <!-- Panel -->
        <div id="panel-content" class="absolute right-0 top-0 bottom-0 w-full max-w-lg bg-white dark:bg-zinc-950 border-l border-zinc-200 dark:border-zinc-800 flex flex-col panel-enter">
            
            <!-- Panel header -->
            <div class="flex items-center justify-between p-3 border-b border-zinc-200 dark:border-zinc-800 shrink-0">
                <div class="flex items-center gap-2">
                    <i data-lucide="settings-2" class="w-4 h-4 text-indigo-600"></i>
                    <h2 class="font-bold text-sm">Pengaturan</h2>
                </div>
                <button onclick="app.closePanel()" class="p-1.5 text-zinc-400 hover:text-zinc-900 dark:hover:text-white rounded-lg hover:bg-zinc-100 dark:hover:bg-zinc-800">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
            
            <!-- Tabs -->
            <div class="flex gap-1 p-2 border-b border-zinc-200 dark:border-zinc-800 overflow-x-auto shrink-0">
                <button onclick="app.setPanelTab('info')" data-ptab="info" class="ptab whitespace-nowrap px-2.5 py-1 text-[10px] font-semibold rounded-lg hover:bg-zinc-100 dark:hover:bg-zinc-800 transition">
                    <i data-lucide="info" class="w-3 h-3 inline mr-1"></i> Info
                </button>
                <button onclick="app.setPanelTab('kategori')" data-ptab="kategori" class="ptab whitespace-nowrap px-2.5 py-1 text-[10px] font-semibold rounded-lg hover:bg-zinc-100 dark:hover:bg-zinc-800 transition">
                    <i data-lucide="folder" class="w-3 h-3 inline mr-1"></i> Kategori
                </button>
                <button onclick="app.setPanelTab('users')" data-ptab="users" class="ptab whitespace-nowrap px-2.5 py-1 text-[10px] font-semibold rounded-lg hover:bg-zinc-100 dark:hover:bg-zinc-800 transition">
                    <i data-lucide="users" class="w-3 h-3 inline mr-1"></i> Users
                </button>
                <button onclick="app.setPanelTab('feedback')" data-ptab="feedback" class="ptab whitespace-nowrap px-2.5 py-1 text-[10px] font-semibold rounded-lg hover:bg-zinc-100 dark:hover:bg-zinc-800 transition">
                    <i data-lucide="inbox" class="w-3 h-3 inline mr-1"></i> Feedback
                </button>
                <button onclick="app.setPanelTab('backup')" data-ptab="backup" class="ptab whitespace-nowrap px-2.5 py-1 text-[10px] font-semibold rounded-lg hover:bg-zinc-100 dark:hover:bg-zinc-800 transition">
                    <i data-lucide="database" class="w-3 h-3 inline mr-1"></i> Backup
                </button>
                <button onclick="app.setPanelTab('prefs')" data-ptab="prefs" class="ptab whitespace-nowrap px-2.5 py-1 text-[10px] font-semibold rounded-lg hover:bg-zinc-100 dark:hover:bg-zinc-800 transition">
                    <i data-lucide="sliders" class="w-3 h-3 inline mr-1"></i> Preferensi
                </button>
            </div>
            
            <!-- Panel content -->
            <div id="panel-body" class="flex-1 overflow-y-auto p-4">
                <!-- Content dynamic -->
            </div>
        </div>
    </div>

    <!-- ============ MODAL: LOGIN ============ -->
    <div id="auth-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
        <div class="w-full max-w-sm bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-xl shadow-2xl overflow-hidden modal-enter relative">
            <button onclick="app.closeModal('auth-modal')" class="absolute top-3 right-3 text-zinc-400 hover:text-zinc-900 dark:hover:text-white z-10 p-1">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>

            <div id="form-login" class="p-6">
                <div class="mb-5">
                    <div class="w-10 h-10 bg-indigo-100 dark:bg-indigo-900/30 text-indigo-600 rounded-lg flex items-center justify-center mb-3">
                        <i data-lucide="shield-lock" class="w-5 h-5"></i>
                    </div>
                    <h3 class="text-base font-bold text-zinc-900 dark:text-white">Authentication</h3>
                    <p class="text-xs text-zinc-500 mt-0.5">Masuk untuk akses penuh.</p>
                </div>
                <form onsubmit="event.preventDefault(); app.doLogin()" class="space-y-3">
                    <input type="email" id="input-email" autocomplete="email" class="w-full bg-zinc-50 dark:bg-zinc-950 border border-zinc-300 dark:border-zinc-700 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-600 outline-none" placeholder="Email">
                    <input type="password" id="input-pass" autocomplete="current-password" class="w-full bg-zinc-50 dark:bg-zinc-950 border border-zinc-300 dark:border-zinc-700 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-600 outline-none" placeholder="Password">
                    <label class="flex items-center gap-2 cursor-pointer text-xs text-zinc-500">
                        <input type="checkbox" id="remember-me" checked class="w-3 h-3 rounded">
                        <span>Ingat saya di perangkat ini</span>
                    </label>
                    <button type="submit" id="btn-submit" class="w-full bg-zinc-900 dark:bg-white text-white dark:text-black font-bold py-2.5 rounded-lg text-sm hover:opacity-90 transition active:scale-[0.98] flex justify-center items-center gap-2">Access Console</button>
                </form>
            </div>

            <div id="view-profile" class="hidden">
                <div class="bg-zinc-50 dark:bg-zinc-800/50 p-6 border-b border-zinc-200 dark:border-zinc-700 text-center">
                    <div class="w-16 h-16 bg-white dark:bg-zinc-700 rounded-full mx-auto mb-3 flex items-center justify-center border-4 border-zinc-200 dark:border-zinc-600 shadow-lg overflow-hidden">
                        <img src="https://raw.githubusercontent.com/onelabszz/super/refs/heads/main/super.png" class="w-10 h-10 object-contain" alt="Avatar">
                    </div>
                    <h3 class="text-sm font-bold text-zinc-900 dark:text-white" id="prof-name">-</h3>
                    <p class="text-indigo-600 dark:text-indigo-400 text-[10px] font-mono font-bold tracking-widest uppercase mt-0.5" id="prof-role">-</p>
                </div>
                <div class="p-4 space-y-2">
                    <div class="flex justify-between text-xs py-1.5 border-b border-zinc-100 dark:border-zinc-800">
                        <span class="text-zinc-500">Unit</span>
                        <span class="font-semibold dark:text-zinc-300" id="prof-unit">-</span>
                    </div>
                    <div class="flex justify-between text-xs py-1.5 border-b border-zinc-100 dark:border-zinc-800">
                        <span class="text-zinc-500">Email</span>
                        <span class="font-semibold dark:text-zinc-300 text-[10px]" id="prof-email">-</span>
                    </div>
                    <button onclick="app.doLogout()" class="w-full mt-3 bg-red-50 hover:bg-red-100 text-red-600 dark:bg-red-900/20 dark:text-red-400 font-bold py-2.5 rounded-lg text-sm transition flex items-center justify-center gap-2">
                        <i data-lucide="log-out" class="w-3.5 h-3.5"></i> Logout
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ============ MODAL: LINK CRUD ============ -->
    <div id="link-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
        <div class="w-full max-w-xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-xl shadow-2xl overflow-hidden modal-enter max-h-[90vh] flex flex-col">
            <div class="flex items-center justify-between p-4 border-b border-zinc-200 dark:border-zinc-800 shrink-0">
                <h3 class="text-sm font-bold dark:text-white" id="link-modal-title">Tambah Link</h3>
                <button onclick="app.closeModal('link-modal')" class="text-zinc-400 hover:text-zinc-900 dark:hover:text-white p-1"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            
            <div class="p-4 overflow-y-auto space-y-3">
                <input type="hidden" id="link-id">
                
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-zinc-500 mb-1">Judul *</label>
                    <input type="text" id="link-judul" class="w-full bg-zinc-50 dark:bg-zinc-950 border border-zinc-300 dark:border-zinc-700 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-600 outline-none" placeholder="Nama link">
                </div>
                
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-zinc-500 mb-1">URL *</label>
                    <input type="url" id="link-url" class="w-full bg-zinc-50 dark:bg-zinc-950 border border-zinc-300 dark:border-zinc-700 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-600 outline-none font-mono" placeholder="https://...">
                </div>
                
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-zinc-500 mb-1">Deskripsi</label>
                    <textarea id="link-deskripsi" rows="2" class="w-full bg-zinc-50 dark:bg-zinc-950 border border-zinc-300 dark:border-zinc-700 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-600 outline-none resize-none" placeholder="Deskripsi singkat"></textarea>
                </div>
                
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-zinc-500 mb-1">Kategori</label>
                        <select id="link-kategori" class="w-full bg-zinc-50 dark:bg-zinc-950 border border-zinc-300 dark:border-zinc-700 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-600 outline-none"></select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-zinc-500 mb-1">Akses Role</label>
                        <input type="text" id="link-role" class="w-full bg-zinc-50 dark:bg-zinc-950 border border-zinc-300 dark:border-zinc-700 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-600 outline-none" placeholder="Super Admin,Admin">
                    </div>
                </div>
                
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-zinc-500 mb-1">Icon</label>
                    <input type="text" id="link-icon-search" placeholder="Cari icon..." class="w-full bg-zinc-50 dark:bg-zinc-950 border border-zinc-300 dark:border-zinc-700 rounded-lg px-3 py-1.5 text-xs focus:ring-2 focus:ring-indigo-600 outline-none mb-1.5">
                    <div id="icon-grid" class="icon-grid"></div>
                    <input type="hidden" id="link-icon" value="link">
                </div>
                
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-zinc-500 mb-1">Warna</label>
                    <div class="flex flex-wrap gap-1.5" id="color-picker"></div>
                    <input type="hidden" id="link-warna" value="zinc">
                </div>
                
                <div class="flex items-center gap-3 flex-wrap">
                    <label class="flex items-center gap-1.5 cursor-pointer text-xs">
                        <input type="checkbox" id="link-pinned" class="w-3.5 h-3.5 rounded">
                        <span class="font-semibold">⭐ Pin</span>
                    </label>
                    <select id="link-status" class="text-xs bg-zinc-50 dark:bg-zinc-950 border border-zinc-300 dark:border-zinc-700 rounded-lg px-2 py-1 focus:ring-2 focus:ring-indigo-600 outline-none">
                        <option value="aktif">Aktif</option>
                        <option value="arsip">Arsip</option>
                    </select>
                </div>
            </div>
            
            <div class="flex items-center gap-2 p-4 border-t border-zinc-200 dark:border-zinc-800 shrink-0">
                <button onclick="app.closeModal('link-modal')" class="flex-1 px-3 py-2 border border-zinc-300 dark:border-zinc-700 rounded-lg text-sm font-semibold hover:bg-zinc-50 dark:hover:bg-zinc-800 transition">Batal</button>
                <button onclick="app.saveLink()" class="flex-1 px-3 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-semibold transition flex items-center justify-center gap-1.5">
                    <i data-lucide="save" class="w-3.5 h-3.5"></i> Simpan
                </button>
            </div>
        </div>
    </div>

    <!-- ============ TOAST ============ -->
    <div id="toast-container" class="fixed top-16 right-3 z-[60] space-y-1.5 max-w-xs"></div>

    <script>
    // ============================================================
    // APP v3.0 — Compact + Persistent + Panel
    // ============================================================
    const app = {
        apiURL: "https://script.google.com/macros/s/AKfycbx-VZ5H9Yy0drhyHucFrrhe4CHm5R7gNzmA-3VFrhgTBzYJzHYPCMp-TkWDVU0eIdr0/exec",
        
        // State
        user: null,
        menu: [],
        kategori: [],
        info: {},
        footer: [],
        users: [],
        feedbackList: [],
        editMode: false,
        sortables: [],
        isOnline: navigator.onLine,
        currentTab: 'info',
        panelOpen: false,
        
        // Storage keys (v3)
        KEYS: {
            SESSION: 'sa3_session',
            CACHE: 'sa3_cache',
            PENDING: 'sa3_pending',
            LAST_SYNC: 'sa3_lastsync',
            PREFS: 'sa3_prefs',
            THEME: 'sa3_theme'
        },
        
        // Preferensi default
        prefs: {
            view: 'grid',           // 'grid' | 'list'
            compact: true,
            autoSync: false,
            autoSyncInterval: 5,    // menit
            showClicks: true,
            showBanner: true
        },
        
        ICONS: ['link','home','settings','user','users','folder','folder-cog','file','file-text','image','video','music','download','upload','cloud','database','server','globe','map-pin','calendar','clock','mail','message-circle','phone','bell','book','book-open','graduation-cap','clipboard','clipboard-check','award','star','heart','bookmark','tag','shopping-cart','shopping-bag','credit-card','dollar-sign','trending-up','bar-chart','pie-chart','activity','zap','shield','shield-check','lock','unlock','key','eye','search','filter','edit','trash-2','plus','minus','check','x','arrow-right','arrow-up-right','external-link','play','pause','power','wifi','battery','monitor','smartphone','tablet','printer','cpu','hard-drive','code','terminal','github','inbox','send','log-out','log-in','layout-dashboard','package','truck','map','compass','sparkles','rocket','flame','crown','gem','palette','brush','pen-tool','camera','headphones','mic','radio','tv','film','gamepad-2','puzzle','trophy','target','flag','hash','at-sign','regex','info','help-circle','alert-circle','alert-triangle'],
        
        COLORS: ['zinc','blue','red','green','emerald','rose','yellow','indigo','purple','orange','pink','sky','teal','violet'],
        
        // ============================================================
        // INIT
        // ============================================================
        init: function() {
            // Service worker
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            }
            
            // Theme (persistent)
            const savedTheme = localStorage.getItem(this.KEYS.THEME);
            if(savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
            
            // Prefs
            try {
                const p = JSON.parse(localStorage.getItem(this.KEYS.PREFS) || '{}');
                this.prefs = { ...this.prefs, ...p };
            } catch(e) {}
            
            // Session (NO auto validation — direct from storage)
            try {
                const sess = JSON.parse(localStorage.getItem(this.KEYS.SESSION) || 'null');
                if (sess && sess.user) this.user = sess.user;
            } catch(e) { localStorage.removeItem(this.KEYS.SESSION); }
            
            // Load cache
            this.loadFromCache();
            
            // Update UI
            this.updateUIState();
            this.renderAll();
            this.updateSyncIndicator();
            
            // Search listeners
            ['search-input','search-input-mobile'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.addEventListener('input', (e) => this.renderAll(e.target.value.toLowerCase()));
            });
            
            // Icon/Color picker
            this.setupIconPicker();
            this.setupColorPicker();
            
            // Network listeners
            window.addEventListener('online', () => { 
                this.isOnline = true; 
                this.updateSyncIndicator(); 
                if (this.prefs.autoSync) this.syncNow(true); 
                this.syncPending();
            });
            window.addEventListener('offline', () => { 
                this.isOnline = false; 
                this.updateSyncIndicator(); 
            });
            
            // Storage sync antar tab
            window.addEventListener('storage', (e) => {
                if (e.key === this.KEYS.CACHE) {
                    this.loadFromCache();
                    this.renderAll();
                }
            });
            
            // Auto sync kalau diaktifkan
            if (this.prefs.autoSync) {
                setInterval(() => {
                    if (this.isOnline) this.syncNow(true);
                }, this.prefs.autoSyncInterval * 60 * 1000);
            }
            
            // Render panel default tab
            this.renderPanel();
            
            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); document.getElementById('search-input').focus(); }
                if (e.key === 'Escape') { this.closeModal('auth-modal'); this.closeModal('link-modal'); this.closePanel(); }
            });
            
            lucide.createIcons();
        },
        
        // ============================================================
        // STORAGE
        // ============================================================
        loadFromCache: function() {
            try {
                const cached = JSON.parse(localStorage.getItem(this.KEYS.CACHE) || '{}');
                this.menu = cached.menu || [];
                this.kategori = cached.kategori || [];
                this.info = cached.info || {};
                this.footer = cached.footer || [];
                this.users = cached.users || [];
                this.feedbackList = cached.feedback || [];
            } catch(e) {
                console.error('Cache parse error:', e);
            }
        },
        
        saveCache: function() {
            localStorage.setItem(this.KEYS.CACHE, JSON.stringify({
                menu: this.menu,
                kategori: this.kategori,
                info: this.info,
                footer: this.footer,
                users: this.users,
                feedback: this.feedbackList,
                cachedAt: new Date().toISOString()
            }));
        },
        
        saveSession: function() {
            if (this.user) {
                localStorage.setItem(this.KEYS.SESSION, JSON.stringify({
                    user: this.user,
                    savedAt: new Date().toISOString()
                }));
            } else {
                localStorage.removeItem(this.KEYS.SESSION);
            }
        },
        
        savePrefs: function() {
            localStorage.setItem(this.KEYS.PREFS, JSON.stringify(this.prefs));
        },
        
        // ============================================================
        // SYNC (MANUAL)
        // ============================================================
        syncNow: function(silent) {
            if (!this.isOnline) {
                if (!silent) this.toast('Offline — tidak bisa sync', 'warning');
                this.updateSyncIndicator('offline');
                return;
            }
            
            this.updateSyncIndicator('syncing');
            const btn = document.getElementById('btn-sync');
            if (btn && !silent) {
                btn.querySelector('i').classList.add('animate-spin');
            }
            
            fetch(`${this.apiURL}?action=bootstrap`)
                .then(r => r.json())
                .then(res => {
                    if (res.status !== 'success') throw new Error(res.message);
                    
                    const d = res.data;
                    if (d.menu) this.menu = d.menu;
                    if (d.kategori) this.kategori = d.kategori;
                    if (d.info) this.info = d.info;
                    if (d.footer) this.footer = d.footer;
                    if (d.users) this.users = d.users;
                    
                    this.saveCache();
                    localStorage.setItem(this.KEYS.LAST_SYNC, res.serverTime);
                    
                    this.renderAll();
                    this.updateSyncIndicator('synced');
                    
                    if (!silent) this.toast('✓ Data tersinkron', 'success');
                    
                    // Load feedback badge kalau admin
                    if (this.user && (this.user.jabatan === 'Super Admin' || this.user.jabatan === 'Admin')) {
                        this.loadFeedback(silent);
                    }
                })
                .catch(err => {
                    console.error('Sync error:', err);
                    this.updateSyncIndicator('error');
                    if (!silent) this.toast('Sync gagal: ' + err.message, 'error');
                })
                .finally(() => {
                    if (btn) btn.querySelector('i').classList.remove('animate-spin');
                });
        },
        
        // ============================================================
        // RENDER
        // ============================================================
        renderAll: function(searchQuery) {
            this.renderMenu(searchQuery);
            this.renderInfoBanner();
            lucide.createIcons();
        },
        
        renderInfoBanner: function() {
            const banner = document.getElementById('info-banner');
            if (!banner) return;
            
            const info = this.info;
            const showBanner = this.prefs.showBanner && info && (info.STATUS === 'ON' || info.STATUS === 'on' || info.STATUS === true);
            
            if (!showBanner || !info.PESAN) {
                banner.classList.add('hidden');
                return;
            }
            
            const colorMap = {
                green: 'bg-emerald-50 border-emerald-200 text-emerald-800 dark:bg-emerald-900/20 dark:border-emerald-800 dark:text-emerald-300',
                blue: 'bg-blue-50 border-blue-200 text-blue-800 dark:bg-blue-900/20 dark:border-blue-800 dark:text-blue-300',
                red: 'bg-red-50 border-red-200 text-red-800 dark:bg-red-900/20 dark:border-red-800 dark:text-red-300',
                yellow: 'bg-amber-50 border-amber-200 text-amber-800 dark:bg-amber-900/20 dark:border-amber-800 dark:text-amber-300',
                indigo: 'bg-indigo-50 border-indigo-200 text-indigo-800 dark:bg-indigo-900/20 dark:border-indigo-800 dark:text-indigo-300'
            };
            
            const cls = colorMap[info.WARNA] || colorMap.blue;
            
            banner.className = `mb-3 p-3 border rounded-lg flex items-start gap-2 ${cls}`;
            banner.innerHTML = `
                <i data-lucide="info" class="w-4 h-4 shrink-0 mt-0.5"></i>
                <div class="flex-1 text-xs leading-relaxed">${this.escape(info.PESAN)}</div>
                <button onclick="document.getElementById('info-banner').classList.add('hidden')" class="text-current opacity-60 hover:opacity-100 shrink-0">
                    <i data-lucide="x" class="w-3.5 h-3.5"></i>
                </button>
            `;
            lucide.createIcons();
        },
        
        renderMenu: function(searchQuery) {
            const container = document.getElementById('content-container');
            const q = searchQuery || '';
            const userRole = this.user ? this.user.jabatan.toLowerCase() : '';
            
            let items = this.menu.filter(item => {
                if (item.DELETED === true || item.DELETED === 'TRUE') return false;
                if (item.STATUS === 'arsip') return false;
                
                if (q && !(
                    String(item.JUDUL).toLowerCase().includes(q) ||
                    String(item.DESKRIPSI || '').toLowerCase().includes(q) ||
                    String(item.URL).toLowerCase().includes(q)
                )) return false;
                
                const reqRole = String(item.AKSES_ROLE || '').trim();
                if (!reqRole) return true;
                const roles = reqRole.split(',').map(r => r.trim().toLowerCase()).filter(Boolean);
                if (roles.length === 0) return true;
                if (userRole === 'super admin') return true;
                return roles.includes(userRole);
            });
            
            if (items.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-16 text-zinc-400">
                        <i data-lucide="inbox" class="w-10 h-10 mb-2 opacity-50"></i>
                        <p class="text-xs">${q ? 'Tidak ada hasil untuk "' + this.escape(q) + '"' : 'Belum ada menu'}</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }
            
            // Group by kategori
            const groups = {};
            this.kategori.forEach(k => groups[k.NAMA] = []);
            groups['Lain-lain'] = groups['Lain-lain'] || [];
            
            items.forEach(item => {
                const kat = item.KATEGORI || 'Lain-lain';
                if (!groups[kat]) groups[kat] = [];
                groups[kat].push(item);
            });
            
            // Sort kategori
            const sortedKatNames = Object.keys(groups).sort((a, b) => {
                const ka = this.kategori.find(k => k.NAMA === a);
                const kb = this.kategori.find(k => k.NAMA === b);
                return (Number(ka?.URUTAN) || 999) - (Number(kb?.URUTAN) || 999);
            });
            
            const isListView = this.prefs.view === 'list';
            let html = '';
            
            sortedKatNames.forEach(katName => {
                const katItems = groups[katName];
                if (!katItems || katItems.length === 0) return;
                
                katItems.sort((a, b) => {
                    const pa = (a.PINNED === true || a.PINNED === 'TRUE') ? 0 : 1;
                    const pb = (b.PINNED === true || b.PINNED === 'TRUE') ? 0 : 1;
                    if (pa !== pb) return pa - pb;
                    return (Number(a.URUTAN) || 999) - (Number(b.URUTAN) || 999);
                });
                
                const katInfo = this.kategori.find(k => k.NAMA === katName);
                const katIcon = katInfo?.ICON || 'folder';
                
                html += `
                    <div class="mb-5">
                        <h3 class="text-[10px] font-bold uppercase tracking-wider text-zinc-500 mb-2 flex items-center gap-1.5">
                            <i data-lucide="${katIcon}" class="w-3 h-3"></i>
                            ${this.escape(katName)}
                            <span class="text-[9px] bg-zinc-100 dark:bg-zinc-800 px-1 py-0.5 rounded font-mono">${katItems.length}</span>
                        </h3>
                        ${isListView 
                            ? `<div class="menu-list flex flex-col gap-1">${katItems.map(item => this.renderListRow(item)).join('')}</div>`
                            : `<div class="menu-grid grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-2">${katItems.map(item => this.renderCard(item)).join('')}</div>`
                        }
                    </div>
                `;
            });
            
            container.innerHTML = html;
            this.setupSortable();
        },
        
        renderCard: function(item) {
            const isPinned = item.PINNED === true || item.PINNED === 'TRUE';
            const colorClasses = this.getColorClasses(item.WARNA);
            const icon = item.ICON || 'link';
            const isEdit = this.editMode;
            const safeUrl = this.safeUrl(item.URL);
            const showClicks = this.prefs.showClicks && Number(item.CLICKS) > 0;
            
            return `
                <div class="menu-card group relative flex flex-col p-3 bg-white dark:bg-panel border border-zinc-200 dark:border-zinc-800 rounded-lg hover:border-indigo-500/40 hover:shadow-sm transition-all duration-150" data-id="${item.ID}">
                    ${isEdit ? `
                        <div class="drag-handle absolute top-1 left-1 p-0.5 rounded hover:bg-zinc-100 dark:hover:bg-zinc-800 text-zinc-400">
                            <i data-lucide="grip-vertical" class="w-3 h-3"></i>
                        </div>
                        <div class="absolute top-1 right-1 flex gap-0.5">
                            <button onclick="app.editLink('${item.ID}')" class="p-1 rounded hover:bg-zinc-100 dark:hover:bg-zinc-800 text-zinc-500" title="Edit">
                                <i data-lucide="pencil" class="w-3 h-3"></i>
                            </button>
                            <button onclick="app.deleteLink('${item.ID}')" class="p-1 rounded hover:bg-red-50 dark:hover:bg-red-900/30 text-red-500" title="Hapus">
                                <i data-lucide="trash-2" class="w-3 h-3"></i>
                            </button>
                        </div>
                    ` : ''}
                    
                    ${isPinned && !isEdit ? `<div class="absolute top-1 right-1 text-amber-400 text-xs">⭐</div>` : ''}
                    
                    <a href="${isEdit ? 'javascript:void(0)' : safeUrl}" ${!isEdit ? 'target="_blank" rel="noopener"' : ''} 
                       onclick="${isEdit ? 'event.preventDefault()' : `app.trackClick('${item.ID}')`}"
                       class="flex flex-col flex-1 ${isEdit ? 'pointer-events-none' : ''}">
                        <div class="flex items-start justify-between mb-2 ${isEdit ? 'mt-4' : ''}">
                            <div class="w-8 h-8 rounded-md flex items-center justify-center ${colorClasses}">
                                <i data-lucide="${icon}" class="w-4 h-4"></i>
                            </div>
                            ${!isEdit ? `<i data-lucide="arrow-up-right" class="w-3 h-3 text-zinc-300 group-hover:text-indigo-500 transition"></i>` : ''}
                        </div>
                        <h4 class="font-semibold text-xs text-zinc-800 dark:text-zinc-100 group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition line-clamp-1 leading-tight">${this.escape(item.JUDUL)}</h4>
                        <p class="text-[10px] text-zinc-500 mt-0.5 line-clamp-1 leading-tight flex-1">${this.escape(item.DESKRIPSI || '')}</p>
                        ${showClicks ? `<div class="mt-1.5 text-[9px] text-zinc-400 font-mono">${item.CLICKS} clicks</div>` : ''}
                    </a>
                </div>
            `;
        },
        
        renderListRow: function(item) {
            const isPinned = item.PINNED === true || item.PINNED === 'TRUE';
            const colorClasses = this.getColorClasses(item.WARNA);
            const icon = item.ICON || 'link';
            const isEdit = this.editMode;
            const safeUrl = this.safeUrl(item.URL);
            const showClicks = this.prefs.showClicks && Number(item.CLICKS) > 0;
            
            return `
                <div class="list-row group flex items-center gap-2 p-2 bg-white dark:bg-panel border border-zinc-200 dark:border-zinc-800 rounded-lg" data-id="${item.ID}">
                    ${isEdit ? `<div class="drag-handle p-0.5 text-zinc-400"><i data-lucide="grip-vertical" class="w-3 h-3"></i></div>` : ''}
                    
                    <a href="${isEdit ? 'javascript:void(0)' : safeUrl}" ${!isEdit ? 'target="_blank" rel="noopener"' : ''} 
                       onclick="${isEdit ? 'event.preventDefault()' : `app.trackClick('${item.ID}')`}"
                       class="flex items-center gap-2 flex-1 min-w-0 ${isEdit ? 'pointer-events-none' : ''}">
                        <div class="w-7 h-7 rounded-md flex items-center justify-center shrink-0 ${colorClasses}">
                            <i data-lucide="${icon}" class="w-3.5 h-3.5"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-1.5">
                                ${isPinned ? '<span class="text-amber-400 text-[10px]">⭐</span>' : ''}
                                <h4 class="font-semibold text-xs text-zinc-800 dark:text-zinc-100 truncate">${this.escape(item.JUDUL)}</h4>
                            </div>
                            <p class="text-[10px] text-zinc-500 truncate">${this.escape(item.DESKRIPSI || item.URL)}</p>
                        </div>
                        ${showClicks ? `<span class="text-[9px] text-zinc-400 font-mono shrink-0">${item.CLICKS}</span>` : ''}
                    </a>
                    
                    ${isEdit ? `
                        <div class="flex gap-0.5 shrink-0">
                            <button onclick="app.editLink('${item.ID}')" class="p-1 rounded hover:bg-zinc-100 dark:hover:bg-zinc-800 text-zinc-500">
                                <i data-lucide="pencil" class="w-3 h-3"></i>
                            </button>
                            <button onclick="app.deleteLink('${item.ID}')" class="p-1 rounded hover:bg-red-50 dark:hover:bg-red-900/30 text-red-500">
                                <i data-lucide="trash-2" class="w-3 h-3"></i>
                            </button>
                        </div>
                    ` : ''}
                </div>
            `;
        },
        
        // ============================================================
        // VIEW TOGGLE
        // ============================================================
        toggleView: function() {
            this.prefs.view = this.prefs.view === 'grid' ? 'list' : 'grid';
            this.savePrefs();
            this.updateViewIcon();
            this.renderAll();
            
            const q = document.getElementById('search-input')?.value?.toLowerCase() || 
                      document.getElementById('search-input-mobile')?.value?.toLowerCase() || '';
            this.renderMenu(q);
            lucide.createIcons();
            this.toast(this.prefs.view === 'list' ? '📋 Tampilan list' : '🔲 Tampilan grid', 'info');
        },
        
        updateViewIcon: function() {
            const icon = document.getElementById('view-icon');
            if (!icon) return;
            const newIcon = this.prefs.view === 'grid' ? 'layout-grid' : 'layout-list';
            icon.setAttribute('data-lucide', newIcon);
            lucide.createIcons();
        },
        
        // ============================================================
        // SORTABLE
        // ============================================================
        setupSortable: function() {
            this.sortables.forEach(s => { try { s.destroy(); } catch(e) {} });
            this.sortables = [];
            if (!this.editMode) return;
            
            document.querySelectorAll('.menu-grid, .menu-list').forEach(grid => {
                const sortable = Sortable.create(grid, {
                    animation: 180,
                    handle: '.drag-handle',
                    ghostClass: 'sortable-ghost',
                    chosenClass: 'sortable-chosen',
                    onEnd: () => {
                        const allIds = [];
                        document.querySelectorAll('.menu-grid, .menu-list').forEach(g => {
                            g.querySelectorAll('[data-id]').forEach(el => allIds.push(el.dataset.id));
                        });
                        this.reorderMenus(allIds);
                    }
                });
                this.sortables.push(sortable);
            });
        },
        
        // ============================================================
        // EDIT MODE
        // ============================================================
        toggleEditMode: function() {
            if (!this.user) { this.toast('Login dulu', 'warning'); return; }
            const role = this.user.jabatan.toLowerCase();
            if (role !== 'super admin' && role !== 'admin') {
                this.toast('Tidak punya akses', 'error');
                return;
            }
            this.editMode = !this.editMode;
            this.updateUIState();
            this.renderAll();
            this.toast(this.editMode ? '🔓 Edit mode aktif' : '🔒 Edit mode nonaktif', 'info');
        },
        
        // ============================================================
        // LINK CRUD
        // ============================================================
        openLinkModal: function(id) {
            if (!this.user) { this.toast('Login dulu', 'warning'); return; }
            
            const modal = document.getElementById('link-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            if (id) {
                const item = this.menu.find(m => m.ID === id);
                if (!item) return;
                document.getElementById('link-modal-title').textContent = 'Edit Link';
                document.getElementById('link-id').value = item.ID;
                document.getElementById('link-judul').value = item.JUDUL || '';
                document.getElementById('link-url').value = item.URL || '';
                document.getElementById('link-deskripsi').value = item.DESKRIPSI || '';
                document.getElementById('link-kategori').value = item.KATEGORI || 'Lain-lain';
                document.getElementById('link-role').value = item.AKSES_ROLE || '';
                document.getElementById('link-icon').value = item.ICON || 'link';
                document.getElementById('link-warna').value = item.WARNA || 'zinc';
                document.getElementById('link-pinned').checked = item.PINNED === true || item.PINNED === 'TRUE';
                document.getElementById('link-status').value = item.STATUS || 'aktif';
                this.selectIcon(item.ICON || 'link');
                this.selectColor(item.WARNA || 'zinc');
            } else {
                document.getElementById('link-modal-title').textContent = 'Tambah Link';
                document.getElementById('link-id').value = '';
                document.getElementById('link-judul').value = '';
                document.getElementById('link-url').value = '';
                document.getElementById('link-deskripsi').value = '';
                document.getElementById('link-kategori').value = this.kategori[0]?.NAMA || 'Lain-lain';
                document.getElementById('link-role').value = '';
                document.getElementById('link-icon').value = 'link';
                document.getElementById('link-warna').value = 'zinc';
                document.getElementById('link-pinned').checked = false;
                document.getElementById('link-status').value = 'aktif';
                this.selectIcon('link');
                this.selectColor('zinc');
            }
            lucide.createIcons();
        },
        
        editLink: function(id) { this.openLinkModal(id); },
        
        saveLink: function() {
            const id = document.getElementById('link-id').value;
            const data = {
                judul: document.getElementById('link-judul').value.trim(),
                url: document.getElementById('link-url').value.trim(),
                deskripsi: document.getElementById('link-deskripsi').value.trim(),
                kategori: document.getElementById('link-kategori').value,
                akses_role: document.getElementById('link-role').value.trim(),
                icon: document.getElementById('link-icon').value,
                warna: document.getElementById('link-warna').value,
                pinned: document.getElementById('link-pinned').checked,
                status: document.getElementById('link-status').value
            };
            
            if (!data.judul || !data.url) { this.toast('Judul & URL wajib', 'error'); return; }
            
            try {
                const u = new URL(data.url);
                if (u.protocol !== 'http:' && u.protocol !== 'https:') throw new Error();
            } catch(e) { this.toast('URL tidak valid', 'error'); return; }
            
            this.closeModal('link-modal');
            
            if (!id) {
                const tempId = 'tmp-' + Date.now();
                data.ID = tempId;
                data.CLICKS = 0;
                data.DELETED = false;
                this.menu.push(data);
                this.queuePending({ action: 'add', tempId, data, userEmail: this.user?.email });
            } else {
                const idx = this.menu.findIndex(m => m.ID === id);
                if (idx >= 0) this.menu[idx] = { ...this.menu[idx], ...data };
                this.queuePending({ action: 'update', id, data, userEmail: this.user?.email });
            }
            
            this.saveCache();
            this.renderAll();

        // ============================================================
        // PENDING QUEUE
        // ============================================================
        queuePending: function(op) {
            const queue = JSON.parse(localStorage.getItem(this.KEYS.PENDING) || '[]');
            queue.push({ ...op, queuedAt: Date.now() });
            localStorage.setItem(this.KEYS.PENDING, JSON.stringify(queue));
            this.updateSyncIndicator();
        },
        
        syncPending: function() {
            if (!this.isOnline) { this.updateSyncIndicator('offline'); return; }
            
            const queue = JSON.parse(localStorage.getItem(this.KEYS.PENDING) || '[]');
            if (queue.length === 0) { this.updateSyncIndicator(); return; }
            
            const processNext = (i) => {
                if (i >= queue.length) {
                    localStorage.setItem(this.KEYS.PENDING, '[]');
                    this.updateSyncIndicator();
                    return;
                }
                
                const op = queue[i];
                fetch(this.apiURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(op)
                })
                .then(r => r.json())
                .then(res => {
                    if (res.status === 'success') {
                        if (op.action === 'add' && op.tempId && res.id) {
                            const item = this.menu.find(m => m.ID === op.tempId);
                            if (item) item.ID = res.id;
                            this.saveCache();
                        }
                        processNext(i + 1);
                    } else {
                        console.error('Sync error:', res);
                        localStorage.setItem(this.KEYS.PENDING, JSON.stringify(queue.slice(i + 1)));
                        this.updateSyncIndicator('error');
                    }
                })
                .catch(() => this.updateSyncIndicator('offline'));
            };
            
            processNext(0);
        },
        
        trackClick: function(id) {
            const item = this.menu.find(m => m.ID === id);
            if (item) item.CLICKS = (Number(item.CLICKS) || 0) + 1;
            if (!this.isOnline) return;
            fetch(this.apiURL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'trackClick', id })
            }).catch(() => {});
        },
        
        // ============================================================
        // AUTH
        // ============================================================
        doLogin: function() {
            const email = document.getElementById('input-email').value.trim();
            const pass = document.getElementById('input-pass').value;
            const remember = document.getElementById('remember-me').checked;
            const btn = document.getElementById('btn-submit');
            
            if (!email || !pass) { this.toast('Email & password wajib', 'error'); return; }
            
            const orig = btn.innerHTML;
            btn.innerHTML = `<i data-lucide="loader-2" class="animate-spin w-3.5 h-3.5"></i> Memverifikasi...`;
            btn.disabled = true;
            lucide.createIcons();
            
            fetch(this.apiURL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'login', email, password: pass })
            })
            .then(r => r.json())
            .then(res => {
                if (res.status === 'success') {
                    this.user = { nama: res.nama, jabatan: res.jabatan, unit: res.unit, email: res.email };
                    this.saveSession();
                    this.updateUIState();
                    this.renderAll();
                    this.closeModal('auth-modal');
                    this.toast('Selamat datang, ' + res.nama, 'success');
                    
                    if (remember) {
                        this.trackLogin();
                        this.loadFeedback(true);
                    }
                } else {
                    this.toast(res.message || 'Login gagal', 'error');
                }
            })
            .catch(() => this.toast('Server tidak dapat dijangkau', 'error'))
            .finally(() => {
                btn.innerHTML = orig;
                btn.disabled = false;
                lucide.createIcons();
            });
        },
